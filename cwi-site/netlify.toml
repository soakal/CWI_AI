[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 301 redirects from .html variants to canonical extensionless URLs
# Prevents duplicate indexable pages and enforces a single canonical form.

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/pricing.html"
  to = "/pricing"
  status = 301

[[redirects]]
  from = "/demo.html"
  to = "/demo"
  status = 301

[[redirects]]
  from = "/roi.html"
  to = "/roi"
  status = 301

[[redirects]]
  from = "/free-audit.html"
