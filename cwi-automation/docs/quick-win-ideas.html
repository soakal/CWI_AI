<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Win Ideas — CWI</title>
  <meta name="description" content="Track and prioritize 30 actionable quick-win ideas to grow CWI Automation, with effort and impact filters, progress tracking, and per-idea notes.">
  <link rel="icon" type="image/png" href="../assets/cwi-favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0A0C;--ink-2:#0E0E11;--surface:#141418;--surface-2:#191920;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.14);--accent:#FF5A1F;--ember:#FF8A3D;--steel:#85858E;--text:#F4F4F6;--text-dim:#C2C2C8;--font-disp:'Sora',sans-serif;--font-body:'Instrument Sans',sans-serif;--r-sm:12px;--r-md:18px;--r-pill:999px;--ease:cubic-bezier(.22,.61,.36,1);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--ink);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh;padding:0 0 64px;}
h1,h2,h3,h4,h5,h6{font-family:var(--font-disp);letter-spacing:-.03em;line-height:1.15;font-weight:800;color:var(--text);}
a{color:var(--accent);text-decoration:none;}
p{color:var(--text-dim);line-height:1.65;}
ul,ol{color:var(--text-dim);padding-left:1.4em;}
li{margin-bottom:6px;}
/* Layout */
.wrap{max-width:960px;margin:0 auto;padding:0 24px;}
.container{max-width:900px;margin:0 auto;padding:0 24px;}
/* Topbar */
.topbar{border-bottom:1px solid var(--line);background:rgba(10,10,12,.9);backdrop-filter:blur(14px);position:sticky;top:0;z-index:100;padding:14px 0;}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:960px;margin:0 auto;padding:0 24px;}
.logo{font-family:var(--font-disp);font-weight:800;font-size:17px;letter-spacing:-.04em;display:flex;align-items:center;gap:8px;color:var(--text);}
.logo .dot{color:var(--accent);}
.back-link{font-size:13px;color:var(--steel);display:flex;align-items:center;gap:5px;transition:color .2s;}
.back-link:hover{color:var(--text);}
/* Hero */
.page-header,.hero{padding:52px 0 32px;text-align:center;}
.page-header .logo-block,.hero .logo-block{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-disp);font-size:20px;font-weight:800;margin-bottom:10px;color:var(--accent);}
.kicker,.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--steel);margin-bottom:16px;}
.pip{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.hero h1,.page-title{font-size:clamp(26px,3.5vw,44px);margin-bottom:12px;}
.hero p,.page-subtitle{font-size:clamp(14px,1.5vw,16px);color:var(--text-dim);max-width:52ch;margin:0 auto;}
/* Cards & panels */
.card,.panel,.form-card,.section-card,.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;margin-bottom:24px;}
.card:hover,.panel:hover{border-color:var(--line-2);}
/* Form elements */
label,.form-label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);display:block;margin-bottom:6px;}
input,select,textarea,.form-control{width:100%;background:var(--ink-2);border:1.5px solid var(--line-2);border-radius:var(--r-sm);padding:10px 14px;font-size:14px;font-family:var(--font-body);color:var(--text);outline:none;transition:border-color .2s;box-sizing:border-box;}
input:focus,select:focus,textarea:focus,.form-control:focus{border-color:var(--accent);background:var(--surface);}
textarea{resize:vertical;min-height:96px;}
select option{background:var(--surface);color:var(--text);}
/* Form layout */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.form-group,.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.form-group.full,.field.full{grid-column:1/-1;}
/* Buttons */
.btn,.btn-primary,.btn-generate,.btn-action{font-family:var(--font-body);font-size:14px;font-weight:600;padding:11px 24px;border-radius:var(--r-pill);border:1.5px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:all .22s var(--ease);display:inline-flex;align-items:center;gap:8px;text-decoration:none;}
.btn:hover,.btn-primary:hover,.btn-generate:hover,.btn-action:hover{background:var(--ember);border-color:var(--ember);box-shadow:0 0 22px rgba(255,90,31,.35);}
.btn-outline,.btn-ghost,.btn-secondary{background:rgba(255,90,31,.1);border-color:var(--accent);color:var(--text);}
.btn-outline:hover,.btn-ghost:hover,.btn-secondary:hover{background:var(--accent);color:#fff;}
.btn-sm{padding:8px 16px;font-size:13px;}
/* Tables */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:32px;}
table{width:100%;border-collapse:collapse;}
thead{background:var(--surface-2);}
th{font-family:var(--font-disp);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);}
td{font-size:14px;color:var(--text-dim);padding:11px 16px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
/* Badges / tags */
.badge,.tag{display:inline-block;padding:3px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:600;background:rgba(255,90,31,.12);color:var(--accent);border:1px solid rgba(255,90,31,.25);}
.badge.green,.tag.green{background:rgba(74,222,128,.12);color:#4ade80;border-color:rgba(74,222,128,.25);}
.badge.red,.tag.red{background:rgba(248,113,113,.12);color:#f87171;border-color:rgba(248,113,113,.25);}
/* Sections */
.section{padding:40px 0 0;}
.section-title{font-family:var(--font-disp);font-size:20px;font-weight:700;margin-bottom:18px;color:var(--text);}
.section-title span,.acc{color:var(--accent);}
/* Output/preview areas */
.output-area,.preview,.result-card,.output-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;margin-top:24px;}
/* Dividers */
hr,.rule,.divider{border:none;border-top:1px solid var(--line);margin:32px 0;}
/* Checklist items */
.check-item{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
.check-item:last-child{border-bottom:none;}
.check-item input[type="checkbox"]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;}
/* Lists */
.list-item{padding:12px 0;border-bottom:1px solid var(--line);color:var(--text-dim);}
.list-item:last-child{border-bottom:none;}
/* Stats / KPI */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:28px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px 22px;}
.stat-label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin-bottom:8px;}
.stat-value{font-family:var(--font-disp);font-size:30px;font-weight:800;color:var(--text);}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:11px 22px;font-size:14px;color:var(--text);transition:transform .3s var(--ease),opacity .3s;opacity:0;z-index:999;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
/* Footer */
.footer{border-top:1px solid var(--line);padding:24px 0;text-align:center;font-size:13px;color:var(--steel);margin-top:64px;}
.footer a{color:var(--accent);}
/* Responsive */
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}.card,.panel,.form-card{padding:20px 16px;}.stat-grid{grid-template-columns:1fr 1fr;}}

/* ── Page-specific styles ── */
.stats-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 14px 32px;
  display: flex;
  align-items: center;
  gap: 28px;
  flex-wrap: wrap;
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.stat-val {
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
  font-family: var(--font-disp);
}

.stat-lbl {
  font-size: 0.75rem;
  color: var(--steel);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.progress-wrap {
  flex: 1;
  min-width: 180px;
}

.progress-label {
  font-size: 0.78rem;
  color: var(--steel);
  margin-bottom: 5px;
  display: flex;
  justify-content: space-between;
}

.progress-bar {
  height: 10px;
  background: var(--surface-2);
  border-radius: 99px;
  overflow: hidden;
  border: 1px solid var(--line);
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--ember));
  border-radius: 99px;
  transition: width 0.4s ease;
}

.controls {
  padding: 16px 32px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  background: var(--ink-2);
  border-bottom: 1px solid var(--line);
}

.controls label {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--steel);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 0;
}

.btn-group {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.filter-btn, .sort-btn {
  padding: 5px 12px;
  border: 1.5px solid var(--line-2);
  border-radius: 99px;
  font-size: 0.8rem;
  font-weight: 500;
  cursor: pointer;
  background: transparent;
  color: var(--text-dim);
  transition: all 0.15s;
  font-family: var(--font-body);
}

.filter-btn:hover, .sort-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.filter-btn.active, .sort-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.toggle-done-btn {
  margin-left: auto;
  padding: 5px 14px;
  border: 1.5px solid var(--line-2);
  border-radius: 99px;
  font-size: 0.8rem;
  font-weight: 500;
  cursor: pointer;
  background: transparent;
  color: var(--steel);
  transition: all 0.15s;
  font-family: var(--font-body);
}

.toggle-done-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.divider {
  width: 1px;
  height: 22px;
  background: var(--line-2);
  border: none;
  margin: 0;
}

main {
  padding: 28px 32px;
}

.section {
  margin-bottom: 36px;
  padding: 0;
}

.section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.section-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 0;
}

.section-count {
  font-size: 0.78rem;
  background: var(--accent);
  color: #fff;
  border-radius: 99px;
  padding: 1px 9px;
  font-weight: 600;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}

.card {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: var(--r-md);
  padding: 16px;
  transition: box-shadow 0.2s, opacity 0.2s, border-color 0.2s;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 0;
}

.card:hover {
  border-color: var(--line-2);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.card.done {
  background: var(--ink-2);
  opacity: 0.6;
}

.card.hidden { display: none; }

.card-top {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.card-checkbox {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  accent-color: var(--accent);
  cursor: pointer;
  margin-top: 1px;
}

.card-title {
  font-size: 0.95rem;
  font-weight: 600;
  line-height: 1.3;
  flex: 1;
  color: var(--text);
  font-family: var(--font-disp);
}

.card.done .card-title {
  color: var(--steel);
  text-decoration: line-through;
}

.card-desc {
  font-size: 0.83rem;
  color: var(--text-dim);
  line-height: 1.5;
}

.card.done .card-desc { color: var(--steel); }

.card-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}

.badge {
  font-size: 0.72rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 99px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  border: 1px solid transparent;
}

.badge-effort-low  { background: rgba(74,222,128,.12); color: #4ade80; border-color: rgba(74,222,128,.25); }
.badge-effort-med  { background: rgba(251,191,36,.12); color: #fbbf24; border-color: rgba(251,191,36,.25); }
.badge-effort-high { background: rgba(248,113,113,.12); color: #f87171; border-color: rgba(248,113,113,.25); }

.badge-impact-high { background: rgba(96,165,250,.12); color: #60a5fa; border-color: rgba(96,165,250,.25); }
.badge-impact-med  { background: rgba(255,90,31,.12); color: var(--accent); border-color: rgba(255,90,31,.25); }
.badge-impact-low  { background: rgba(133,133,142,.12); color: var(--steel); border-color: rgba(133,133,142,.25); }

.badge-time {
  background: rgba(133,133,142,.1);
  color: var(--steel);
  border-color: var(--line-2);
}

.card-notes {
  width: 100%;
  border: 1px solid var(--line-2);
  border-radius: var(--r-sm);
  font-size: 0.8rem;
  padding: 7px 9px;
  color: var(--text);
  resize: vertical;
  min-height: 52px;
  font-family: var(--font-body);
  background: var(--ink-2);
  transition: border-color 0.15s;
}

.card-notes:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--surface);
}

.card-notes::placeholder { color: var(--steel); }

.empty-state {
  text-align: center;
  padding: 40px;
  color: var(--steel);
  font-size: 0.9rem;
}

@media (max-width: 640px) {
  .stats-bar, .controls, main { padding-left: 16px; padding-right: 16px; }
  .cards-grid { grid-template-columns: 1fr; }
  .controls { gap: 8px; }
}
</style>
</head>
<body>

<div class="bg-field" style="position:fixed;inset:0;z-index:-1;pointer-events:none;"><div style="position:absolute;inset:0;background:radial-gradient(720px 460px at 82% -6%,rgba(255,90,31,.09),transparent 60%),radial-gradient(620px 520px at 6% 8%,rgba(255,90,31,.04),transparent 60%);"></div></div>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="4" y="10" width="4" height="12" rx="2" fill="#FF5A1F"/><rect x="10" y="6" width="4" height="20" rx="2" fill="#FF5A1F" opacity=".85"/><rect x="16" y="2" width="4" height="28" rx="2" fill="#FF5A1F" opacity=".7"/><rect x="22" y="6" width="4" height="20" rx="2" fill="#FF5A1F" opacity=".55"/></svg>
      CWI <span class="dot">·</span> Quick Win Ideas
    </div>
    <a class="back-link" href="../index.html">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2L3 7l5 5"/><line x1="3" y1="7" x2="12" y2="7"/></svg>
      Back
    </a>
  </div>
</header>

<div class="stats-bar">
  <div class="stat"><div class="stat-val" id="stat-total">30</div><div class="stat-lbl">Total Ideas</div></div>
  <div class="stat"><div class="stat-val" id="stat-done">0</div><div class="stat-lbl">Completed</div></div>
  <div class="stat"><div class="stat-val" id="stat-hours">0h</div><div class="stat-lbl">Hours Remaining</div></div>
  <div class="progress-wrap">
    <div class="progress-label"><span>Progress</span><span id="stat-pct">0%</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
</div>

<div class="controls">
  <label>Impact:</label>
  <div class="btn-group" id="impact-filters">
    <button class="filter-btn active" data-impact="all">All</button>
    <button class="filter-btn" data-impact="high">High</button>
    <button class="filter-btn" data-impact="medium">Medium</button>
    <button class="filter-btn" data-impact="low">Low</button>
  </div>
  <div class="divider"></div>
  <label>Effort:</label>
  <div class="btn-group" id="effort-filters">
    <button class="filter-btn active" data-effort="all">All</button>
    <button class="filter-btn" data-effort="low">Low</button>
    <button class="filter-btn" data-effort="medium">Medium</button>
    <button class="filter-btn" data-effort="high">High</button>
  </div>
  <div class="divider"></div>
  <label>Sort:</label>
  <div class="btn-group" id="sort-btns">
    <button class="sort-btn active" data-sort="smart">Smart</button>
    <button class="sort-btn" data-sort="impact">Highest Impact</button>
    <button class="sort-btn" data-sort="effort">Lowest Effort</button>
    <button class="sort-btn" data-sort="time">Shortest Time</button>
    <button class="sort-btn" data-sort="az">A-Z</button>
  </div>
  <button class="toggle-done-btn" id="toggle-done-btn">Hide Completed</button>
</div>

<main id="main-content"></main>

<script>
const STORAGE_KEY = 'cwiai_quickwins_v2';

const IDEAS = [
  // ===== HIGH IMPACT / LOW EFFORT =====
  {
    id: 'live-chat',
    section: 'high-low',
    title: 'Add Live Chat to Your Website',
    desc: 'Install a free tool like Tidio or Crisp so visitors can ask questions instantly. Captures leads who won\'t fill out a form.',
    effort: 'low', impact: 'high', minutes: 30
  },
  {
    id: 'free-audit-page',
    section: 'high-low',
    title: 'Create a Free Audit Landing Page',
    desc: 'Build a simple page offering a free automation audit. Give prospects a clear CTA to book a call and see quick ROI.',
    effort: 'low', impact: 'high', minutes: 45
  },
  {
    id: 'linkedin-post',
    section: 'high-low',
    title: 'Publish a LinkedIn Post Today',
    desc: 'Share a quick win, a client result, or a "before/after" automation story. Consistent posts build authority fast.',
    effort: 'low', impact: 'high', minutes: 20
  },
  {
    id: 'text-3-prospects',
    section: 'high-low',
    title: 'Text 3 Warm Prospects Right Now',
    desc: 'Send a short personal text to 3 people who showed interest but went cold. A simple "still thinking about automating?" often reopens deals.',
    effort: 'low', impact: 'high', minutes: 10
  },
  {
    id: 'google-review-signature',
    section: 'high-low',
    title: 'Add Google Review Link to Email Signature',
    desc: 'Every email you send is a chance to get a review. Drop a one-liner and link at the bottom of every message.',
    effort: 'low', impact: 'high', minutes: 10
  },
  {
    id: 'referral-ask',
    section: 'high-low',
    title: 'Ask Your Best Clients for a Referral',
    desc: 'Reach out to your top 3 clients and ask if they know anyone who could benefit from automation. Warm referrals close at 4x the rate.',
    effort: 'low', impact: 'high', minutes: 15
  },
  {
    id: 'linkedin-connections',
    section: 'high-low',
    title: 'Send 10 LinkedIn Connection Requests Daily',
    desc: 'Target plumbing/HVAC/field service owners in your market. A steady drip of connections builds a warm pipeline over time.',
    effort: 'low', impact: 'high', minutes: 15
  },

  // ===== HIGH IMPACT / MEDIUM EFFORT =====
  {
    id: 'facebook-ad',
    section: 'high-med',
    title: 'Run a $50 Facebook Ad for One Week',
    desc: 'Target local plumbers and HVAC owners with a "Save 10 hours/week" hook. Even a small test ad generates data and leads.',
    effort: 'medium', impact: 'high', minutes: 90
  },
  {
    id: 'cold-email-plumbers',
    section: 'high-med',
    title: 'Cold Email 20 Local Plumbers',
    desc: 'Write a tight 4-sentence email focused on one pain point (missed calls, slow invoicing). Personalize the first line for each.',
    effort: 'medium', impact: 'high', minutes: 120
  },
  {
    id: 'demo-video',
    section: 'high-med',
    title: 'Record a 60-Second Demo Video',
    desc: 'Show what happens when a lead fills out a form — the automation fires, the text goes out, the job gets booked. Post on LinkedIn and your site.',
    effort: 'medium', impact: 'high', minutes: 60
  },
  {
    id: 'web-designer-partner',
    section: 'high-med',
    title: 'Partner with a Local Web Designer',
    desc: 'Find 2-3 web designers who serve contractors. Offer a referral fee for every client they send your way. Warm leads, zero ad spend.',
    effort: 'medium', impact: 'high', minutes: 60
  },
  {
    id: 'apollo-plumbing-sequence',
    section: 'high-med',
    title: 'Build an Apollo Plumbing Outreach Sequence',
    desc: 'Use Apollo to build a list of 100 plumbing companies and run a 4-step email/LinkedIn sequence over 2 weeks.',
    effort: 'medium', impact: 'high', minutes: 150
  },
  {

const SECTIONS = [
  { key: 'high-low',  title: 'High Impact / Low Effort',    subtitle: 'Do First'     },
  { key: 'high-med',  title: 'High Impact / Medium Effort', subtitle: 'High Priority' },
  { key: 'high-high', title: 'High Impact / High Effort',   subtitle: 'Plan It'       },
  { key: 'medium',    title: 'Medium Impact',               subtitle: 'Worth Doing'   },
  { key: 'low',       title: 'Low Impact',                  subtitle: 'Nice to Have'  }
];

const IMPACT_ORDER = { high: 0, medium: 1, low: 2 };
const EFFORT_ORDER = { low: 0, medium: 1, high: 2 };

let state = { done: {}, notes: {} };
let filterImpact = 'all';
let filterEffort = 'all';
let currentSort = 'smart';
let showDone = true;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch(e) {}
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getFilteredSorted() {
  let items = IDEAS.filter(idea => {
    if (filterImpact !== 'all' && idea.impact !== filterImpact) return false;
    if (filterEffort !== 'all' && idea.effort !== filterEffort) return false;
    return true;
  });

  items = [...items].sort((a, b) => {
    const doneA = !!state.done[a.id];
    const doneB = !!state.done[b.id];

    if (currentSort === 'smart') {
      if (doneA !== doneB) return doneA ? 1 : -1;
      if (IMPACT_ORDER[a.impact] !== IMPACT_ORDER[b.impact])
        return IMPACT_ORDER[a.impact] - IMPACT_ORDER[b.impact];
      return EFFORT_ORDER[a.effort] - EFFORT_ORDER[b.effort];
    }
    if (currentSort === 'impact') {
      if (doneA !== doneB) return doneA ? 1 : -1;
      return IMPACT_ORDER[a.impact] - IMPACT_ORDER[b.impact];
    }
    if (currentSort === 'effort') {
      if (doneA !== doneB) return doneA ? 1 : -1;
      return EFFORT_ORDER[a.effort] - EFFORT_ORDER[b.effort];
    }
    if (currentSort === 'time') {
      if (doneA !== doneB) return doneA ? 1 : -1;
      return a.minutes - b.minutes;
    }
    if (currentSort === 'az') {
      return a.title.localeCompare(b.title);
    }
    return 0;
  });

  return items;
}

function formatTime(mins) {
  if (mins < 60) return mins + ' min';
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m ? h + 'h ' + m + 'm' : h + 'h';
}

function updateStats() {
  const total = IDEAS.length;
  const doneCount = IDEAS.filter(i => state.done[i.id]).length;
  const remainMins = IDEAS.filter(i => !state.done[i.id]).reduce((s, i) => s + i.minutes, 0);
  const pct = Math.round((doneCount / total) * 100);

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-done').textContent = doneCount;
  document.getElementById('stat-hours').textContent = formatTime(remainMins);
  document.getElementById('stat-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
}

function buildCard(idea) {
  const isDone = !!state.done[idea.id];
  const noteVal = state.notes[idea.id] || '';

  const card = document.createElement('div');
  card.className = 'card' + (isDone ? ' done' : '');
  card.dataset.id = idea.id;

  card.innerHTML = `
    <div class="card-top">
      <input type="checkbox" class="card-checkbox" ${isDone ? 'checked' : ''} />
      <div class="card-title">${idea.title}</div>
    </div>
    <div class="card-desc">${idea.desc}</div>
    <div class="card-badges">
      <span class="badge badge-effort-${idea.effort}">Effort: ${idea.effort.charAt(0).toUpperCase() + idea.effort.slice(1)}</span>
      <span class="badge badge-impact-${idea.impact}">Impact: ${idea.impact.charAt(0).toUpperCase() + idea.impact.slice(1)}</span>
      <span class="badge badge-time">${formatTime(idea.minutes)}</span>
    </div>
    <textarea class="card-notes" placeholder="Notes...">${noteVal}</textarea>
  `;

  card.querySelector('.card-checkbox').addEventListener('change', function() {
    state.done[idea.id] = this.checked;
    saveState();
    render();
  });

  card.querySelector('.card-notes').addEventListener('input', function() {
    state.notes[idea.id] = this.value;
    saveState();
  });

  return card;
}

function render() {
  const main = document.getElementById('main-content');
  main.innerHTML = '';
  updateStats();

  const filtered = getFilteredSorted();
  const useGroups = currentSort === 'smart' && filterImpact === 'all' && filterEffort === 'all';

  if (useGroups) {
    SECTIONS.forEach(sec => {
      const sectionIdeas = filtered.filter(i => i.section === sec.key);
      if (sectionIdeas.length === 0) return;

      const section = document.createElement('div');
      section.className = 'section';
      section.innerHTML = `
        <div class="section-header">
          <div class="section-title">${sec.title}</div>
          <span class="section-count">${sec.subtitle}</span>
        </div>
        <div class="cards-grid"></div>
      `;
      const grid = section.querySelector('.cards-grid');
      sectionIdeas.forEach(idea => {
        const card = buildCard(idea);
        if (!showDone && state.done[idea.id]) card.classList.add('hidden');
        grid.appendChild(card);
      });
      main.appendChild(section);
    });
  } else {
    const section = document.createElement('div');
    section.className = 'section';
    section.innerHTML = `
      <div class="section-header">
        <div class="section-title">Filtered Results</div>
        <span class="section-count">${filtered.length} idea${filtered.length !== 1 ? 's' : ''}</span>
      </div>
      <div class="cards-grid"></div>
    `;
    const grid = section.querySelector('.cards-grid');
    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty-state">No ideas match the current filters.</div>';
    } else {
      filtered.forEach(idea => {
        const card = buildCard(idea);
        if (!showDone && state.done[idea.id]) card.classList.add('hidden');
        grid.appendChild(card);
      });
    }
    main.appendChild(section);
  }
}

// Controls
document.getElementById('impact-filters').addEventListener('click', e => {
  const btn = e.target.closest('[data-impact]');
  if (!btn) return;
  filterImpact = btn.dataset.impact;
  document.querySelectorAll('[data-impact]').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

document.getElementById('effort-filters').addEventListener('click', e => {
  const btn = e.target.closest('[data-effort]');
  if (!btn) return;
  filterEffort = btn.dataset.effort;
  document.querySelectorAll('[data-effort]').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

document.getElementById('sort-btns').addEventListener('click', e => {
  const btn = e.target.closest('[data-sort]');
  if (!btn) return;
  currentSort = btn.dataset.sort;
  document.querySelectorAll('[data-sort]').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

document.getElementById('toggle-done-btn').addEventListener('click', function() {
  showDone = !showDone;
  this.textContent = showDone ? 'Hide Completed' : 'Show Completed';
  document.querySelectorAll('.card.done').forEach(c => {
    c.classList.toggle('hidden', !showDone);
  });
});

loadState();
render();
</script>
