<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Win Ideas — CWI Automation</title>
  <meta name="description" content="CWI internal tool: Quick Win Ideas — CWI Automation. Internal use only — CWI Compute With Imagination.">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #FF5A1F;
      --accent-dark: #d94a16;
      --bg: #f4f5f7;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --muted: #6b7280;
      --border: #e5e7eb;
      --done-bg: #f9fafb;
      --done-text: #9ca3af;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --blue: #3b82f6;
      --orange: #f97316;
      --gray: #6b7280;
      --radius: 10px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      padding: 28px 32px 20px;
      border-bottom: 3px solid var(--accent);
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    header h1 span { color: var(--accent); }

    header p {
      color: #a0aec0;
      font-size: 0.93rem;
      margin-top: 4px;
    }

    .stats-bar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      gap: 28px;
      flex-wrap: wrap;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .stat-val {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    .stat-lbl {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .progress-wrap {
      flex: 1;
      min-width: 180px;
    }

    .progress-label {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }

    .progress-bar {
      height: 10px;
      background: #e5e7eb;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #ff8c5a);
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    .controls {
      padding: 16px 32px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .controls label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-btn, .sort-btn {
      padding: 5px 12px;
      border: 1.5px solid var(--border);
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      background: #fff;
      color: var(--text);
      transition: all 0.15s;
    }

    .filter-btn:hover, .sort-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .filter-btn.active, .sort-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .toggle-done-btn {
      margin-left: auto;
      padding: 5px 14px;
      border: 1.5px solid var(--border);
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      background: #fff;
      color: var(--muted);
      transition: all 0.15s;
    }

    .toggle-done-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .divider {
      width: 1px;
      height: 22px;
      background: var(--border);
    }

    main {
      padding: 28px 32px;
    }

    .section {
      margin-bottom: 36px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }

    .section-count {
      font-size: 0.78rem;
      background: var(--accent);
      color: #fff;
      border-radius: 99px;
      padding: 1px 9px;
      font-weight: 600;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      transition: box-shadow 0.2s, opacity 0.2s;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    .card.done {
      background: var(--done-bg);
      opacity: 0.72;
    }

    .card.hidden { display: none; }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .card-checkbox {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      accent-color: var(--accent);
      cursor: pointer;
      margin-top: 1px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.3;
      flex: 1;
    }

    .card.done .card-title {
      color: var(--done-text);
      text-decoration: line-through;
    }

    .card-desc {
      font-size: 0.83rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .card.done .card-desc { color: #c4c9d4; }

    .card-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .badge-effort-low  { background: #d1fae5; color: #065f46; }
    .badge-effort-med  { background: #fef3c7; color: #92400e; }
    .badge-effort-high { background: #fee2e2; color: #991b1b; }

    .badge-impact-high { background: #dbeafe; color: #1e40af; }
    .badge-impact-med  { background: #fff7ed; color: #9a3412; }
    .badge-impact-low  { background: #f3f4f6; color: #374151; }

    .badge-time {
      background: #f3f4f6;
      color: var(--muted);
    }

    .card-notes {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.8rem;
      padding: 7px 9px;
      color: var(--text);
      resize: vertical;
      min-height: 52px;
      font-family: inherit;
      background: #fafafa;
      transition: border-color 0.15s;
    }

    .card-notes:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
    }

    .card-notes::placeholder { color: #c4c9d4; }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 640px) {
      header, .stats-bar, .controls, main { padding-left: 16px; padding-right: 16px; }
      .cards-grid { grid-template-columns: 1fr; }
      .controls { gap: 8px; }
    }
  </style>
</head>
<body>

<header>
  <h1>Quick Win <span>Ideas</span></h1>
  <p>30 actionable ideas to grow CWI Automation — track progress and add notes as you go.</p>
</header>

<div class="stats-bar">
  <div class="stat"><div class="stat-val" id="stat-total">30</div><div class="stat-lbl">Total Ideas</div></div>
  <div class="stat"><div class="stat-val" id="stat-done">0</div><div class="stat-lbl">Completed</div></div>
  <div class="stat"><div class="stat-val" id="stat-hours">0h</div><div class="stat-lbl">Hours Remaining</div></div>
  <div class="progress-wrap">
    <div class="progress-label"><span>Progress</span><span id="stat-pct">0%</span></div>

  </div>

<div class="controls">
  <label>Impact:</label>
  <div class="btn-group" id="impact-filters">
    <button class="filter-btn active" data-impact="all">All</button>
    <button class="filter-btn" data-impact="high">High</button>

  <div class="divider"></div>

</div>

<main id="main-content"></main>

  },
  {

    effort: 'low', impact: 'low', minutes: 20
  },
  {

    effort: 'low', impact: 'low', minutes: 30

];

const SECTIONS = [
  { key: 'high-low',  title: 'High Impact / Low Effort',    subtitle: 'Do First'     },
  { key: 'high-med',  title: 'High Impact / Medium Effort', subtitle: 'High Priority' },
  { key: 'high-high', title: 'High Impact / High Effort',   subtitle: 'Plan It'       },
  { key: 'medium',    title: 'Medium Impact',               subtitle: 'Worth Doing'   },
  { key: 'low',       title: 'Low Impact',                  subtitle: 'Nice to Have'  }
];

const IMPACT_ORDER = { high: 0, medium: 1, low: 2 };
const EFFORT_ORDER = { low: 0, medium: 1, high: 2 };

let state = { done: {}, notes: {} };
let filterImpact = 'all';
let filterEffort = 'all';
let currentSort = 'smart';
let showDone = true;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch(e) {}
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getFilteredSorted() {
  let items = IDEAS.filter(idea => {
    if (filterImpact !== 'all' && idea.impact !== filterImpact) return false;
    if (filterEffort !== 'all' && idea.effort !== filterEffort) return false;
    return true;
  });

  items = [...items].sort((a, b) => {
    const doneA = !!state.done[a.id];
    const doneB = !!state.done[b.id];

    if (currentSort === 'smart') {
      if (doneA !== doneB) return doneA ? 1 : -1;
      if (IMPACT_ORDER[a.impact] !== IMPACT_ORDER[b.impact])
        return IMPACT_ORDER[a.impact] - IMPACT_ORDER[b.impact];
      return EFFORT_ORDER[a.effort] - EFFORT_ORDER[b.effort];
    }
    if (currentSort === 'impact') {
      if (doneA !== doneB) return doneA ? 1 : -1;
      return IMPACT_ORDER[a.impact] - IMPACT_ORDER[b.impact];
    }
    if (currentSort === 'effort') {
      if (doneA !== doneB) return doneA ? 1 : -1;
      return EFFORT_ORDER[a.effort] - EFFORT_ORDER[b.effort];
    }
    if (currentSort === 'time') {
      if (doneA !== doneB) return doneA ? 1 : -1;
      return a.minutes - b.minutes;
    }
    if (currentSort === 'az') {
      return a.title.localeCompare(b.title);
    }
    return 0;
  });

  return items;
}

function formatTime(mins) {
  if (mins < 60) return mins + ' min';
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m ? h + 'h ' + m + 'm' : h + 'h';
}

function updateStats() {
  const total = IDEAS.length;
  const doneCount = IDEAS.filter(i => state.done[i.id]).length;
  const remainMins = IDEAS.filter(i => !state.done[i.id]).reduce((s, i) => s + i.minutes, 0);
  const pct = Math.round((doneCount / total) * 100);

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-done').textContent = doneCount;
  document.getElementById('stat-hours').textContent = formatTime(remainMins);
  document.getElementById('stat-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
}

function buildCard(idea) {
  const isDone = !!state.done[idea.id];
  const noteVal = state.notes[idea.id] || '';

  const card = document.createElement('div');
  card.className = 'card' + (isDone ? ' done' : '');
  card.dataset.id = idea.id;

  card.innerHTML = `
    <div class="card-top">
      <input type="checkbox" class="card-checkbox" ${isDone ? 'checked' : ''} />
      <div class="card-title">${idea.title}</div>
    </div>
    <div class="card-desc">${idea.desc}</div>
    <div class="card-badges">
      <span class="badge badge-effort-${idea.effort}">Effort: ${idea.effort.charAt(0).toUpperCase() + idea.effort.slice(1)}</span>
      <span class="badge badge-impact-${idea.impact}">Impact: ${idea.impact.charAt(0).toUpperCase() + idea.impact.slice(1)}</span>
      <span class="badge badge-time">${formatTime(idea.minutes)}</span>
    </div>
    <textarea class="card-notes" placeholder="Notes...">${noteVal}</textarea>
  `;

  card.querySelector('.card-checkbox').addEventListener('change', function() {
    state.done[idea.id] = this.checked;
    saveState();
    render();
  });

  card.querySelector('.card-notes').addEventListener('input', function() {
    state.notes[idea.id] = this.value;
    saveState();
  });

  return card;
}

function render() {
  const main = document.getElementById('main-content');
  main.innerHTML = '';
  updateStats();

  const filtered = getFilteredSorted();
  const useGroups = currentSort === 'smart' && filterImpact === 'all' && filterEffort === 'all';

  if (useGroups) {
    SECTIONS.forEach(sec => {
      const sectionIdeas = filtered.filter(i => i.section === sec.key);
      if (sectionIdeas.length === 0) return;

      const section = document.createElement('div');
      section.className = 'section';
      section.innerHTML = `
        <div class="section-header">
          <div class="section-title">${sec.title}</div>
          <span class="section-count">${sec.subtitle}</span>
        </div>
        <div class="cards-grid"></div>
      `;
      const grid = section.querySelector('.cards-grid');
      sectionIdeas.forEach(idea => {
        const card = buildCard(idea);
        if (!showDone && state.done[idea.id]) card.classList.add('hidden');
        grid.appendChild(card);
      });
      main.appendChild(section);
    });
  } else {
    const section = document.createElement('div');
    section.className = 'section';
    section.innerHTML = `
      <div class="section-header">
        <div class="section-title">Filtered Results</div>
        <span class="section-count">${filtered.length} idea${filtered.length !== 1 ? 's' : ''}</span>
      </div>
      <div class="cards-grid"></div>
    `;
    const grid = section.querySelector('.cards-grid');
    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty-state">No ideas match the current filters.</div>';
    } else {
      filtered.forEach(idea => {
        const card = buildCard(idea);
        if (!showDone && state.done[idea.id]) card.classList.add('hidden');
        grid.appendChild(card);
      });
    }
    main.appendChild(section);
  }
}

// Controls
document.getElementById('impact-filters').addEventListener('click', e => {
  const btn = e.target.closest('[data-impact]');
  if (!btn) return;
  filterImpact = btn.dataset.impact;
  document.querySelectorAll('[data-impact]').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

document.getElementById('effort-filters').addEventListener('click', e => {
  const btn = e.target.closest('[data-effort]');
  if (!btn) return;
  filterEffort = btn.dataset.effort;
  document.querySelectorAll('[data-effort]').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

document.getElementById('sort-btns').addEventListener('click', e => {
  const btn = e.target.closest('[data-sort]');
  if (!btn) return;
  currentSort = btn.dataset.sort;
  document.querySelectorAll('[data-sort]').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

document.getElementById('toggle-done-btn').addEventListener('click', function() {
  showDone = !showDone;
  this.textContent = showDone ? 'Hide Completed' : 'Show Completed';
  document.querySelectorAll('.card.done').forEach(c => {
    c.classList.toggle('hidden', !showDone);
  });
});

loadState();
render();
</script>
</body>
</html>
