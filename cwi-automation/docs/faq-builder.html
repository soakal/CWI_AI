<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ Builder — CWI</title>
<meta name="description" content="Build, edit, and export client FAQ sets with live accordion preview and one-click HTML, JSON, or plain-text output.">
<link rel="icon" type="image/png" href="../assets/cwi-favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0A0C;--ink-2:#0E0E11;--surface:#141418;--surface-2:#191920;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.14);--accent:#FF5A1F;--ember:#FF8A3D;--steel:#85858E;--text:#F4F4F6;--text-dim:#C2C2C8;--font-disp:'Sora',sans-serif;--font-body:'Instrument Sans',sans-serif;--r-sm:12px;--r-md:18px;--r-pill:999px;--ease:cubic-bezier(.22,.61,.36,1);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--ink);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh;padding:0 0 64px;}
h1,h2,h3,h4,h5,h6{font-family:var(--font-disp);letter-spacing:-.03em;line-height:1.15;font-weight:800;color:var(--text);}
a{color:var(--accent);text-decoration:none;}
p{color:var(--text-dim);line-height:1.65;}
ul,ol{color:var(--text-dim);padding-left:1.4em;}
li{margin-bottom:6px;}
/* Layout */
.wrap{max-width:960px;margin:0 auto;padding:0 24px;}
.container{max-width:900px;margin:0 auto;padding:0 24px;}
/* Topbar */
.topbar{border-bottom:1px solid var(--line);background:rgba(10,10,12,.9);backdrop-filter:blur(14px);position:sticky;top:0;z-index:100;padding:14px 0;}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:960px;margin:0 auto;padding:0 24px;}
.logo{font-family:var(--font-disp);font-weight:800;font-size:17px;letter-spacing:-.04em;display:flex;align-items:center;gap:8px;color:var(--text);}
.logo .dot{color:var(--accent);}
.back-link{font-size:13px;color:var(--steel);display:flex;align-items:center;gap:5px;transition:color .2s;}
.back-link:hover{color:var(--text);}
/* Hero */
.page-header,.hero{padding:52px 0 32px;text-align:center;}
.page-header .logo-block,.hero .logo-block{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-disp);font-size:20px;font-weight:800;margin-bottom:10px;color:var(--accent);}
.kicker,.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--steel);margin-bottom:16px;}
.pip{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.hero h1,.page-title{font-size:clamp(26px,3.5vw,44px);margin-bottom:12px;}
.hero p,.page-subtitle{font-size:clamp(14px,1.5vw,16px);color:var(--text-dim);max-width:52ch;margin:0 auto;}
/* Cards & panels */
.card,.panel,.form-card,.section-card,.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;margin-bottom:24px;}
.card:hover,.panel:hover{border-color:var(--line-2);}
/* Form elements */
label,.form-label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);display:block;margin-bottom:6px;}
input,select,textarea,.form-control{width:100%;background:var(--ink-2);border:1.5px solid var(--line-2);border-radius:var(--r-sm);padding:10px 14px;font-size:14px;font-family:var(--font-body);color:var(--text);outline:none;transition:border-color .2s;box-sizing:border-box;}
input:focus,select:focus,textarea:focus,.form-control:focus{border-color:var(--accent);background:var(--surface);}
textarea{resize:vertical;min-height:96px;}
select option{background:var(--surface);color:var(--text);}
/* Form layout */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.form-group,.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.form-group.full,.field.full{grid-column:1/-1;}
/* Buttons */
.btn,.btn-primary,.btn-generate,.btn-action{font-family:var(--font-body);font-size:14px;font-weight:600;padding:11px 24px;border-radius:var(--r-pill);border:1.5px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:all .22s var(--ease);display:inline-flex;align-items:center;gap:8px;text-decoration:none;}
.btn:hover,.btn-primary:hover,.btn-generate:hover,.btn-action:hover{background:var(--ember);border-color:var(--ember);box-shadow:0 0 22px rgba(255,90,31,.35);}
.btn-outline,.btn-ghost,.btn-secondary{background:rgba(255,90,31,.1);border-color:var(--accent);color:var(--text);}
.btn-outline:hover,.btn-ghost:hover,.btn-secondary:hover{background:var(--accent);color:#fff;}
.btn-sm{padding:8px 16px;font-size:13px;}
/* Tables */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:32px;}
table{width:100%;border-collapse:collapse;}
thead{background:var(--surface-2);}
th{font-family:var(--font-disp);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);}
td{font-size:14px;color:var(--text-dim);padding:11px 16px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
/* Badges / tags */
.badge,.tag{display:inline-block;padding:3px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:600;background:rgba(255,90,31,.12);color:var(--accent);border:1px solid rgba(255,90,31,.25);}
.badge.green,.tag.green{background:rgba(74,222,128,.12);color:#4ade80;border-color:rgba(74,222,128,.25);}
.badge.red,.tag.red{background:rgba(248,113,113,.12);color:#f87171;border-color:rgba(248,113,113,.25);}
/* Sections */
.section{padding:40px 0 0;}
.section-title{font-family:var(--font-disp);font-size:20px;font-weight:700;margin-bottom:18px;color:var(--text);}
.section-title span,.acc{color:var(--accent);}
/* Output/preview areas */
.output-area,.preview,.result-card,.output-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;margin-top:24px;}
/* Dividers */
hr,.rule,.divider{border:none;border-top:1px solid var(--line);margin:32px 0;}
/* Checklist items */
.check-item{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
.check-item:last-child{border-bottom:none;}
.check-item input[type="checkbox"]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;}
/* Lists */
.list-item{padding:12px 0;border-bottom:1px solid var(--line);color:var(--text-dim);}
.list-item:last-child{border-bottom:none;}
/* Stats / KPI */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:28px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px 22px;}
.stat-label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin-bottom:8px;}
.stat-value{font-family:var(--font-disp);font-size:30px;font-weight:800;color:var(--text);}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:11px 22px;font-size:14px;color:var(--text);transition:transform .3s var(--ease),opacity .3s;opacity:0;z-index:999;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
/* Footer */
.footer{border-top:1px solid var(--line);padding:24px 0;text-align:center;font-size:13px;color:var(--steel);margin-top:64px;}
.footer a{color:var(--accent);}
/* Responsive */
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}.card,.panel,.form-card{padding:20px 16px;}.stat-grid{grid-template-columns:1fr 1fr;}}

/* ── FAQ Builder-specific ── */
.layout{display:grid;grid-template-columns:1fr 420px;gap:0;height:calc(100vh - 57px);}
.editor-panel{padding:24px;overflow-y:auto;border-right:1px solid var(--line);}
.preview-panel{background:var(--surface-2);overflow-y:auto;display:flex;flex-direction:column;}
.preview-header{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-between;}
.preview-header h3{font-size:13px;font-weight:600;color:var(--steel);text-transform:uppercase;letter-spacing:.5px;}
.preview-body{flex:1;padding:24px;}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--steel);margin-bottom:8px;}
.toolbar{display:flex;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
.field-group{display:flex;flex-direction:column;gap:6px;}
input[type="text"],select{padding:9px 12px;border:1.5px solid var(--line-2);border-radius:var(--r-sm);font-size:14px;background:var(--ink-2);color:var(--text);outline:none;transition:border-color .15s;min-width:180px;font-family:var(--font-body);}
input[type="text"]:focus,select:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(255,90,31,.12);}
.faq-list{display:flex;flex-direction:column;gap:12px;}
.faq-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;transition:box-shadow .15s,opacity .2s;position:relative;}
.faq-item.excluded{opacity:.45;}
.faq-item.dragging{box-shadow:0 4px 24px rgba(255,90,31,.18);border-color:var(--accent);}
.faq-item-header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);}
.drag-handle{color:var(--steel);cursor:grab;font-size:16px;line-height:1;user-select:none;padding:2px;}
.drag-handle:active{cursor:grabbing;}
.faq-num{font-size:11px;font-weight:700;color:var(--steel);min-width:20px;}
.faq-controls{display:flex;align-items:center;gap:4px;margin-left:auto;}
.toggle-include{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);cursor:pointer;user-select:none;}
.toggle-include input{display:none;}
.toggle-track{width:32px;height:18px;border-radius:9px;background:rgba(255,255,255,.12);position:relative;transition:background .2s;}
.toggle-include input:checked + .toggle-track{background:var(--accent);}
.toggle-track::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.toggle-include input:checked + .toggle-track::after{transform:translateX(14px);}
.faq-item-body{padding:12px;display:flex;flex-direction:column;gap:10px;}
.faq-field{display:flex;flex-direction:column;gap:4px;}
.faq-field-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);}
[contenteditable]{outline:none;padding:8px 10px;border:1px solid transparent;border-radius:6px;font-size:14px;line-height:1.5;background:var(--ink-2);color:var(--text);transition:border-color .15s,background .15s;min-height:36px;}
[contenteditable]:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(255,90,31,.08);}
[contenteditable].question{font-weight:600;font-size:14px;color:var(--text);}
[contenteditable].answer{font-size:13px;color:var(--text-dim);}
.add-faq-row{margin-top:4px;display:flex;justify-content:center;}
.stats-bar{display:flex;align-items:center;gap:16px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:16px;font-size:12px;color:var(--text-dim);}
.stats-bar strong{color:var(--text);}
.export-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
/* Preview accordion */
.preview-faq-wrapper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;font-family:var(--font-body);}
.preview-faq-title{padding:20px 24px 12px;font-size:18px;font-weight:700;color:var(--text);border-bottom:2px solid var(--accent);font-family:var(--font-disp);}
.preview-accordion-item{border-bottom:1px solid var(--line);}
.preview-accordion-item:last-child{border-bottom:none;}
.preview-accordion-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:none;border:none;cursor:pointer;text-align:left;font-size:15px;font-weight:600;color:var(--text);gap:12px;transition:background .15s;font-family:var(--font-body);}
.preview-accordion-trigger:hover{background:rgba(255,90,31,.06);}
.preview-accordion-trigger.open{color:var(--accent);}
.preview-chevron{font-size:12px;color:var(--accent);flex-shrink:0;transition:transform .25s;}
.preview-accordion-trigger.open .preview-chevron{transform:rotate(180deg);}
.preview-accordion-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.preview-accordion-body.open{max-height:400px;}
.preview-accordion-body-inner{padding:4px 24px 18px;font-size:14px;color:var(--text-dim);line-height:1.65;}
.empty-preview{text-align:center;padding:60px 20px;color:var(--steel);font-size:14px;}
.empty-preview svg{opacity:.25;margin-bottom:12px;}
.saved-badge{font-size:11px;color:#4ade80;font-weight:600;display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .3s;}
.saved-badge.visible{opacity:1;}
.client-row{display:flex;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.saved-clients{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.client-chip{padding:4px 10px;border-radius:var(--r-pill);font-size:12px;font-weight:600;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;transition:all .15s;color:var(--text-dim);}
.client-chip:hover,.client-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.header-spacer{flex:1;}
/* Danger btn */
.btn-danger{background:transparent;color:#f87171;border:1px solid rgba(248,113,113,.4);padding:4px 10px;font-size:12px;border-radius:var(--r-sm);cursor:pointer;font-family:var(--font-body);font-weight:600;transition:all .15s;}
.btn-danger:hover{background:rgba(248,113,113,.12);border-color:#f87171;}
/* Icon btn */
.btn-icon{width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--steel);cursor:pointer;font-size:14px;transition:all .15s;}
.btn-icon:hover{color:var(--text);border-color:var(--steel);background:var(--surface);}
.btn-icon:disabled{opacity:.3;cursor:not-allowed;}
/* Drop zone */
.drop-zone{height:4px;border-radius:2px;background:transparent;transition:background .15s,height .15s;margin:-6px 0;}
.drop-zone.active{height:12px;background:var(--accent);border-radius:4px;margin:0;}
@media(max-width:900px){.layout{grid-template-columns:1fr;height:auto;}.preview-panel{display:none;}}
</style>
</head>
<body>

<div class="bg-field" style="position:fixed;inset:0;z-index:-1;pointer-events:none;"><div style="position:absolute;inset:0;background:radial-gradient(720px 460px at 82% -6%,rgba(255,90,31,.09),transparent 60%),radial-gradient(620px 520px at 6% 8%,rgba(255,90,31,.04),transparent 60%);"></div></div>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="4" y="10" width="4" height="12" rx="2" fill="#FF5A1F"/><rect x="10" y="6" width="4" height="20" rx="2" fill="#FF5A1F" opacity=".85"/><rect x="16" y="2" width="4" height="28" rx="2" fill="#FF5A1F" opacity=".7"/><rect x="22" y="6" width="4" height="20" rx="2" fill="#FF5A1F" opacity=".55"/></svg>
      CWI <span class="dot">·</span> FAQ Builder
    </div>
    <a class="back-link" href="../index.html">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2L3 7l5 5"/><line x1="3" y1="7" x2="12" y2="7"/></svg>
      Back
    </a>
  </div>
</header>

<div class="layout">
  <div class="editor-panel">

    <div class="client-row">
      <div class="field-group">
        <label for="clientName">Client Name</label>
        <input type="text" id="clientName" placeholder="e.g. Smith Plumbing Co." style="min-width:220px;">
      </div>
      <div class="field-group">
        <label for="industrySelect">Industry Template</label>
        <select id="industrySelect">
          <option value="">— Select to load template —</option>
          <option value="plumbing">Plumbing</option>
          <option value="hvac">HVAC</option>
          <option value="accounting">Accounting</option>
        </select>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="loadTemplate()" title="Load selected template">Load Template</button>
      <button class="btn btn-secondary btn-sm" onclick="saveClient()">Save</button>
    </div>

    <div id="savedClients" class="saved-clients"></div>

    <div class="stats-bar">
      <span>FAQs: <strong id="statTotal">0</strong></span>
      <span>Included: <strong id="statIncluded">0</strong></span>
      <span>Excluded: <strong id="statExcluded">0</strong></span>
    </div>

    <div class="export-row">
      <button class="btn btn-primary btn-sm" onclick="copyHTML()">&#128203; Copy HTML</button>
      <button class="btn btn-secondary btn-sm" onclick="copyJSON()">&#123;&#125; Copy JSON</button>
      <button class="btn btn-secondary btn-sm" onclick="copyPlainText()">&#9776; Copy Plain Text</button>
    </div>

    <div class="faq-list" id="faqList"></div>

    <div class="add-faq-row" style="margin-top:16px;">
      <button class="btn btn-secondary" onclick="addFAQ()">+ Add Custom FAQ</button>
    </div>

  </div>

  <div class="preview-panel">
    <div class="preview-header">
      <h3>Live Preview</h3>
      <span style="font-size:12px;color:var(--steel);">accordion style</span>
    </div>
    <div class="preview-body">
      <div id="previewContainer"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── Data ────────────────────────────────────────────────────────────────────

const TEMPLATES = {
  plumbing: [
    { q: "How quickly can you respond to a plumbing emergency?", a: "We offer 24/7 emergency plumbing service and can typically have a licensed plumber at your door within 60–90 minutes of your call, any time of day or night." },
    { q: "Do you provide free estimates?", a: "Yes! We offer free on-site estimates for all non-emergency plumbing work. A technician will assess the job and provide a written quote before any work begins." },
    { q: "Are your plumbers licensed and insured?", a: "Absolutely. All of our plumbers are fully licensed by the state, carry liability insurance, and are background-checked for your peace of mind." },
    { q: "What are the most common signs I need a plumber?", a: "Warning signs include slow drains, low water pressure, discolored water, unusually high water bills, dripping faucets, running toilets, or water stains on ceilings and walls." },
    { q: "Do you handle both residential and commercial plumbing?", a: "Yes, we service both residential homes and commercial properties including offices, restaurants, and multi-unit buildings. We have the equipment and crew size for jobs of any scale." },
    { q: "Can you repair or replace a water heater?", a: "We install, repair, and replace all types of water heaters including traditional tank units, tankless on-demand systems, and hybrid heat pump water heaters." },
    { q: "How do I prevent clogged drains?", a: "Avoid putting grease, food scraps, coffee grounds, or fibrous materials down drains. Use drain strainers in showers, and schedule an annual drain cleaning service to keep pipes clear." },
    { q: "Do you offer a warranty on your work?", a: "Yes. All labor comes with a 1-year workmanship warranty. Parts and fixtures carry the manufacturer's warranty, which we help you register and honor." },
    { q: "What payment methods do you accept?", a: "We accept cash, all major credit cards, and financing options for larger projects. We also work with most home warranty providers." },
    { q: "How can I shut off water to my home in an emergency?", a: "Locate your main water shut-off valve — usually near the water meter, in the basement, or in a utility closet. Turn it clockwise to shut off all water to the house. We can show you its location during any service visit." }
  ],
  hvac: [
    { q: "How often should I have my HVAC system serviced?", a: "We recommend a tune-up twice a year — once in spring before cooling season and once in fall before heating season. Regular maintenance extends equipment life and improves efficiency." },
    { q: "What size HVAC unit do I need for my home?", a: "Sizing depends on square footage, ceiling height, insulation, window area, and local climate. We perform a Manual J load calculation to recommend the correctly sized system — oversized and undersized units both cause problems." },
    { q: "Why is my energy bill suddenly higher?", a: "A spike in energy bills often signals a dirty filter, refrigerant leak, failing components, duct leaks, or a system working harder due to age. A diagnostic inspection can pinpoint the cause quickly." },
    { q: "How long does an HVAC system typically last?", a: "With proper maintenance, air conditioners last 15–20 years and furnaces last 20–30 years. Heat pumps typically last 15–20 years. Systems in extreme climates may have shorter lifespans." },
    { q: "What should I do if my AC stops cooling?", a: "First check your thermostat settings and air filter. If those are fine, check the circuit breaker and outdoor unit for ice buildup. If issues persist, call us — common causes include low refrigerant, a failed capacitor, or a dirty coil." },
    { q: "Do you offer emergency HVAC service?", a: "Yes, we provide 24/7 emergency service because we know a broken furnace in winter or a failed AC in a heatwave can't wait. Emergency calls are answered live, not by voicemail." },
    { q: "Should I repair or replace my old HVAC system?", a: "A general rule: if the repair cost exceeds 50% of the replacement cost, or the system is over 12–15 years old, replacement is usually more cost-effective. We'll give you an honest recommendation either way." },
    { q: "How often should I change my air filter?", a: "Standard 1-inch filters should be replaced every 30–90 days. Thicker 4–5 inch media filters can last 6–12 months. Homes with pets or allergy sufferers benefit from more frequent changes." },
    { q: "Do you service all HVAC brands?", a: "Yes, our technicians are trained and certified to service all major brands including Carrier, Trane, Lennox, Rheem, Goodman, American Standard, Bryant, and more." },

  ],

    { q: "What accounting services do you offer?", a: "We provide a full range of services including bookkeeping, payroll processing, tax preparation and planning, financial statement preparation, CFO advisory, sales tax compliance, and IRS audit representation." },
    { q: "How much do your accounting services cost?", a: "Fees vary based on the complexity and volume of work. We offer fixed monthly packages for bookkeeping and payroll starting at competitive rates, and flat-fee pricing for tax returns. Contact us for a free consultation and custom quote." },

    { q: "Can you help me with tax planning, not just filing?", a: "Absolutely. Proactive tax planning throughout the year is far more valuable than just filing after the fact. We analyze your situation quarterly and recommend strategies to minimize your tax liability legally." },

    { q: "How do I get started with your firm?", a: "Simply schedule a free 30-minute consultation. We'll review your current situation, discuss your needs, and recommend the right service package. Onboarding typically takes just a few business days." }
  ]
};

// ─── State ───────────────────────────────────────────────────────────────────

let faqs = [];
let dragSrcIndex = null;

// ─── Init ────────────────────────────────────────────────────────────────────

function init() {
  renderSavedClients();
  const last = localStorage.getItem('cwi_faq_last_client');
  if (last) {
    const data = loadClientData(last);
    if (data) {
      document.getElementById('clientName').value = last;
      faqs = data;
      render();
      return;
    }
  }
  faqs = [];
  render();
}

// ─── FAQ CRUD ────────────────────────────────────────────────────────────────

function addFAQ(q = '', a = '', included = true) {
  faqs.push({ q, a, included, id: Date.now() + Math.random() });
  render();
  // Focus the new question
  setTimeout(() => {
    const items = document.querySelectorAll('.faq-question');
    if (items.length) items[items.length - 1].focus();
  }, 50);
}

function deleteFAQ(idx) {
  faqs.splice(idx, 1);
  render();
}

function moveFAQ(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= faqs.length) return;
  [faqs[idx], faqs[newIdx]] = [faqs[newIdx], faqs[idx]];
  render();
}

function syncFromDOM() {
  const items = document.querySelectorAll('.faq-item');
  items.forEach((item, i) => {
    const qEl = item.querySelector('.faq-question');
    const aEl = item.querySelector('.faq-answer');
    const chk = item.querySelector('.include-toggle');
    if (qEl) faqs[i].q = qEl.innerText.trim();
    if (aEl) faqs[i].a = aEl.innerText.trim();
    if (chk) faqs[i].included = chk.checked;
  });
}

// ─── Render ──────────────────────────────────────────────────────────────────

function render() {
  renderEditor();
  renderPreview();
  updateStats();
  autoSave();
}

function renderEditor() {
  const list = document.getElementById('faqList');
  list.innerHTML = '';
  faqs.forEach((faq, i) => {
    const item = document.createElement('div');
    item.className = 'faq-item' + (faq.included ? '' : ' excluded');
    item.dataset.index = i;
    item.draggable = true;
    item.innerHTML = `
      <div class="faq-item-header">
        <span class="drag-handle" title="Drag to reorder">&#8942;&#8942;</span>
        <span class="faq-num">#${i + 1}</span>
        <label class="toggle-include" title="Include in export">
          <input type="checkbox" class="include-toggle" ${faq.included ? 'checked' : ''} onchange="onToggle(${i}, this.checked)">
          <span class="toggle-track"></span>
          <span style="margin-left:4px;">${faq.included ? 'Included' : 'Excluded'}</span>
        </label>
        <div class="faq-controls">
          <button class="btn-icon" onclick="moveFAQ(${i}, -1)" ${i === 0 ? 'disabled' : ''} title="Move up">&#8593;</button>
          <button class="btn-icon" onclick="moveFAQ(${i}, 1)" ${i === faqs.length - 1 ? 'disabled' : ''} title="Move down">&#8595;</button>
          <button class="btn btn-danger btn-sm" onclick="deleteFAQ(${i})" title="Delete">&#128465;</button>
        </div>
      </div>
      <div class="faq-item-body">
        <div class="faq-field">
          <span class="faq-field-label">Question</span>
          <div class="faq-question question" contenteditable="true" data-idx="${i}" oninput="onEdit(${i}, 'q', this)">${escHTML(faq.q)}</div>
        </div>
        <div class="faq-field">
          <span class="faq-field-label">Answer</span>
          <div class="faq-answer answer" contenteditable="true" data-idx="${i}" oninput="onEdit(${i}, 'a', this)">${escHTML(faq.a)}</div>
        </div>
      </div>
    `;

    // Drag events
    item.addEventListener('dragstart', (e) => {
      dragSrcIndex = i;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => item.classList.add('dragging'), 0);
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      dragSrcIndex = null;
    });
    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    });
    item.addEventListener('drop', (e) => {
      e.preventDefault();
      if (dragSrcIndex === null || dragSrcIndex === i) return;
      const moved = faqs.splice(dragSrcIndex, 1)[0];
      faqs.splice(i, 0, moved);
      render();
    });

    list.appendChild(item);
  });
}

function onEdit(idx, field, el) {
  faqs[idx][field] = el.innerText.trim();
  renderPreview();
  updateStats();
  debouncedAutoSave();
}

function onToggle(idx, val) {
  faqs[idx].included = val;
  render();
}

let _saveTimer = null;
function debouncedAutoSave() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(autoSave, 800);
}

function renderPreview() {
  const container = document.getElementById('previewContainer');
  const included = faqs.filter(f => f.included);
  const clientName = document.getElementById('clientName').value.trim();

  if (included.length === 0) {
    container.innerHTML = `<div class="empty-preview">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/>
      </svg>
      <p>No included FAQs yet.<br>Add or load a template to preview.</p>
    </div>`;
    return;
  }

  const title = clientName ? `Frequently Asked Questions` : 'Frequently Asked Questions';
  let html = `<div class="preview-faq-wrapper">`;
  if (clientName) {
    html += `<div class="preview-faq-title">${escHTML(clientName)} — FAQ</div>`;
  } else {
    html += `<div class="preview-faq-title">Frequently Asked Questions</div>`;
  }

  included.forEach((faq, i) => {
    html += `
      <div class="preview-accordion-item">
        <button class="preview-accordion-trigger" onclick="toggleAccordion(this)">
          <span>${escHTML(faq.q)}</span>
          <span class="preview-chevron">&#9660;</span>
        </button>
        <div class="preview-accordion-body">
          <div class="preview-accordion-body-inner">${escHTML(faq.a)}</div>
        </div>
      </div>
    `;
  });

  html += `</div>`;
  container.innerHTML = html;
}

function toggleAccordion(btn) {
  const body = btn.nextElementSibling;
  const isOpen = body.classList.contains('open');
  // Close all
  document.querySelectorAll('.preview-accordion-body').forEach(b => b.classList.remove('open'));
  document.querySelectorAll('.preview-accordion-trigger').forEach(b => b.classList.remove('open'));
  if (!isOpen) {
    body.classList.add('open');
    btn.classList.add('open');
  }
}

function updateStats() {
  document.getElementById('statTotal').textContent = faqs.length;
  const inc = faqs.filter(f => f.included).length;
  document.getElementById('statIncluded').textContent = inc;
  document.getElementById('statExcluded').textContent = faqs.length - inc;
}

// ─── Template Loading ────────────────────────────────────────────────────────

function loadTemplate() {
  const sel = document.getElementById('industrySelect').value;
  if (!sel) { showToast('Select an industry first.', 'error'); return; }
  const tpl = TEMPLATES[sel];
  if (!tpl) return;
  if (faqs.length > 0 && !confirm('This will replace your current FAQs with the template. Continue?')) return;
  faqs = tpl.map((item, i) => ({ q: item.q, a: item.a, included: true, id: Date.now() + i }));
  render();
  showToast(`Loaded ${tpl.length} ${sel.charAt(0).toUpperCase() + sel.slice(1)} FAQs`, 'success');
}

// ─── Save / Load ─────────────────────────────────────────────────────────────

function autoSave() {
  const name = document.getElementById('clientName').value.trim();
  if (!name) return;
  saveClientData(name, faqs);
  const badge = document.getElementById('savedBadge');
  badge.classList.add('visible');
  setTimeout(() => badge.classList.remove('visible'), 2000);
}

function saveClient() {
  const name = document.getElementById('clientName').value.trim();
  if (!name) { showToast('Enter a client name first.', 'error'); return; }
  saveClientData(name, faqs);
  localStorage.setItem('cwi_faq_last_client', name);
  renderSavedClients();
  showToast(`Saved "${name}"`, 'success');
}

function saveClientData(name, data) {
  const key = 'cwi_faq_client_' + name.toLowerCase().replace(/\s+/g, '_');
  localStorage.setItem(key, JSON.stringify(data));
  // Track client list
  let clients = JSON.parse(localStorage.getItem('cwi_faq_clients') || '[]');
  if (!clients.includes(name)) { clients.push(name); localStorage.setItem('cwi_faq_clients', JSON.stringify(clients)); }
}

function loadClientData(name) {
  const key = 'cwi_faq_client_' + name.toLowerCase().replace(/\s+/g, '_');
  const raw = localStorage.getItem(key);
  return raw ? JSON.parse(raw) : null;
}

function renderSavedClients() {
  const clients = JSON.parse(localStorage.getItem('cwi_faq_clients') || '[]');
  const container = document.getElementById('savedClients');
  if (clients.length === 0) { container.innerHTML = ''; return; }
  const current = document.getElementById('clientName').value.trim();
  container.innerHTML = clients.map(c =>
    `<span class="client-chip${c === current ? ' active' : ''}" onclick="switchClient('${escAttr(c)}')">${escHTML(c)}</span>`
  ).join('');
}

function switchClient(name) {
  if (faqs.length > 0 && document.getElementById('clientName').value.trim() !== name) {
    if (!confirm(`Switch to "${name}"? Unsaved changes to current client will be lost.`)) return;
  }
  document.getElementById('clientName').value = name;
  const data = loadClientData(name);
  if (data) {
    faqs = data;
    render();
    localStorage.setItem('cwi_faq_last_client', name);
    renderSavedClients();
    showToast(`Loaded "${name}"`, 'success');
  }
}

// ─── Export ──────────────────────────────────────────────────────────────────

function copyHTML() {
  const included = faqs.filter(f => f.included);
  if (!included.length) { showToast('No included FAQs to export.', 'error'); return; }
  const clientName = document.getElementById('clientName').value.trim();
  const title = clientName ? `${escHTML(clientName)} — Frequently Asked Questions` : 'Frequently Asked Questions';

  const items = included.map((faq, i) => `
    <div class="cwi-faq-item">
      <button class="cwi-faq-trigger" onclick="cwiToggle(this)" aria-expanded="false">
        <span>${escHTML(faq.q)}</span>
        <span class="cwi-faq-chevron" aria-hidden="true">&#9660;</span>
      </button>
      <div class="cwi-faq-body" role="region">
        <div class="cwi-faq-body-inner">${escHTML(faq.a)}</div>
      </div>
    </div>`).join('\n');

  const snippet = `<!-- CWI AI FAQ Section -->
<style>
.cwi-faq-wrap{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:800px;margin:0 auto;}
.cwi-faq-title{font-size:24px;font-weight:700;color:#1a1a1a;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid #FF5A1F;}
.cwi-faq-item{border-bottom:1px solid #ebebeb;}
.cwi-faq-item:last-child{border-bottom:none;}
.cwi-faq-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px 0;background:none;border:none;cursor:pointer;text-align:left;font-size:16px;font-weight:600;color:#1a1a1a;gap:12px;transition:color 0.15s;}
.cwi-faq-trigger:hover{color:#FF5A1F;}
.cwi-faq-trigger[aria-expanded="true"]{color:#FF5A1F;}
.cwi-faq-chevron{font-size:12px;color:#FF5A1F;flex-shrink:0;transition:transform 0.25s;}
.cwi-faq-trigger[aria-expanded="true"] .cwi-faq-chevron{transform:rotate(180deg);}
.cwi-faq-body{max-height:0;overflow:hidden;transition:max-height 0.3s ease;}
.cwi-faq-body-inner{padding:0 0 16px;font-size:15px;color:#555;line-height:1.65;}
</style>
<div class="cwi-faq-wrap">
  <h2 class="cwi-faq-title">${title}</h2>
${items}
</div>
<script>
function cwiToggle(btn){
  var body=btn.nextElementSibling;
  var isOpen=btn.getAttribute('aria-expanded')==='true';
  document.querySelectorAll('.cwi-faq-trigger').forEach(function(b){b.setAttribute('aria-expanded','false');});
  document.querySelectorAll('.cwi-faq-body').forEach(function(b){b.style.maxHeight='';});
  if(!isOpen){btn.setAttribute('aria-expanded','true');body.style.maxHeight=body.scrollHeight+'px';}
}
<\/script>`;

  copyToClipboard(snippet, 'HTML snippet copied!');
}

function copyJSON() {
  const included = faqs.filter(f => f.included);
  if (!included.length) { showToast('No included FAQs to export.', 'error'); return; }
  const clientName = document.getElementById('clientName').value.trim();
  const data = included.map((faq, i) => ({
    id: i + 1,
    question: faq.q,
    answer: faq.a,
    ...(clientName ? { client: clientName } : {})
  }));
  copyToClipboard(JSON.stringify(data, null, 2), 'JSON copied (Freshchat-compatible)!');
}

function copyPlainText() {
  const included = faqs.filter(f => f.included);
  if (!included.length) { showToast('No included FAQs to export.', 'error'); return; }
  const clientName = document.getElementById('clientName').value.trim();
  let text = clientName ? `${clientName} — Frequently Asked Questions\n${'='.repeat(60)}\n\n` : 'Frequently Asked Questions\n' + '='.repeat(40) + '\n\n';
  included.forEach((faq, i) => {
    text += `${i + 1}. ${faq.q}\n${faq.a}\n\n`;
  });
  copyToClipboard(text.trim(), 'Plain text copied (Google Business ready)!');
}

// ─── Utilities ───────────────────────────────────────────────────────────────

function copyToClipboard(text, successMsg) {
  navigator.clipboard.writeText(text).then(() => {
    showToast(successMsg, 'success');
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(successMsg, 'success');
  });
}

function escHTML(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function escAttr(str) {
  return (str || '').replace(/'/g, "\\'");
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  void t.offsetWidth;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ─── Event Listeners ─────────────────────────────────────────────────────────

document.getElementById('clientName').addEventListener('input', function() {
  renderSavedClients();
  renderPreview();
  debouncedAutoSave();
});

document.getElementById('industrySelect').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') loadTemplate();
});

// ─── Boot ────────────────────────────────────────────────────────────────────

init();
</script>
