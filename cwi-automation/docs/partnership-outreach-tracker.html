<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partnership &amp; Referral Outreach Tracker — CWI</title>
<meta name="description" content="Track and manage B2B partner and referral source outreach, pipeline stages, follow-up schedules, and partnership pitch snippets for CWI AI.">
<link rel="icon" type="image/png" href="../assets/cwi-favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0A0C;--ink-2:#0E0E11;--surface:#141418;--surface-2:#191920;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.14);--accent:#FF5A1F;--ember:#FF8A3D;--steel:#85858E;--text:#F4F4F6;--text-dim:#C2C2C8;--font-disp:'Sora',sans-serif;--font-body:'Instrument Sans',sans-serif;--r-sm:12px;--r-md:18px;--r-pill:999px;--ease:cubic-bezier(.22,.61,.36,1);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--ink);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh;padding:0 0 64px;}
h1,h2,h3,h4,h5,h6{font-family:var(--font-disp);letter-spacing:-.03em;line-height:1.15;font-weight:800;color:var(--text);}
a{color:var(--accent);text-decoration:none;}
p{color:var(--text-dim);line-height:1.65;}
ul,ol{color:var(--text-dim);padding-left:1.4em;}
li{margin-bottom:6px;}
/* Layout */
.wrap{max-width:960px;margin:0 auto;padding:0 24px;}
.container{max-width:900px;margin:0 auto;padding:0 24px;}
/* Topbar */
.topbar{border-bottom:1px solid var(--line);background:rgba(10,10,12,.9);backdrop-filter:blur(14px);position:sticky;top:0;z-index:100;padding:14px 0;}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:960px;margin:0 auto;padding:0 24px;}
.logo{font-family:var(--font-disp);font-weight:800;font-size:17px;letter-spacing:-.04em;display:flex;align-items:center;gap:8px;color:var(--text);}
.logo .dot{color:var(--accent);}
.back-link{font-size:13px;color:var(--steel);display:flex;align-items:center;gap:5px;transition:color .2s;}
.back-link:hover{color:var(--text);}
/* Hero */
.page-header,.hero{padding:52px 0 32px;text-align:center;}
.page-header .logo-block,.hero .logo-block{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-disp);font-size:20px;font-weight:800;margin-bottom:10px;color:var(--accent);}
.kicker,.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--steel);margin-bottom:16px;}
.pip{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.hero h1,.page-title{font-size:clamp(26px,3.5vw,44px);margin-bottom:12px;}
.hero p,.page-subtitle{font-size:clamp(14px,1.5vw,16px);color:var(--text-dim);max-width:52ch;margin:0 auto;}
/* Cards & panels */
.card,.panel,.form-card,.section-card,.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;margin-bottom:24px;}
.card:hover,.panel:hover{border-color:var(--line-2);}
/* Form elements */
label,.form-label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);display:block;margin-bottom:6px;}
input,select,textarea,.form-control{width:100%;background:var(--ink-2);border:1.5px solid var(--line-2);border-radius:var(--r-sm);padding:10px 14px;font-size:14px;font-family:var(--font-body);color:var(--text);outline:none;transition:border-color .2s;box-sizing:border-box;}
input:focus,select:focus,textarea:focus,.form-control:focus{border-color:var(--accent);background:var(--surface);}
textarea{resize:vertical;min-height:96px;}
select option{background:var(--surface);color:var(--text);}
/* Form layout */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.form-group,.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.form-group.full,.field.full{grid-column:1/-1;}
/* Buttons */
.btn,.btn-primary,.btn-generate,.btn-action{font-family:var(--font-body);font-size:14px;font-weight:600;padding:11px 24px;border-radius:var(--r-pill);border:1.5px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:all .22s var(--ease);display:inline-flex;align-items:center;gap:8px;text-decoration:none;}
.btn:hover,.btn-primary:hover,.btn-generate:hover,.btn-action:hover{background:var(--ember);border-color:var(--ember);box-shadow:0 0 22px rgba(255,90,31,.35);}
.btn-outline,.btn-ghost,.btn-secondary{background:rgba(255,90,31,.1);border-color:var(--accent);color:var(--text);}
.btn-outline:hover,.btn-ghost:hover,.btn-secondary:hover{background:var(--accent);color:#fff;}
.btn-sm{padding:8px 16px;font-size:13px;}
/* Tables */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:32px;}
table{width:100%;border-collapse:collapse;}
thead{background:var(--surface-2);}
th{font-family:var(--font-disp);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);}
td{font-size:14px;color:var(--text-dim);padding:11px 16px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
/* Badges / tags */
.badge,.tag{display:inline-block;padding:3px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:600;background:rgba(255,90,31,.12);color:var(--accent);border:1px solid rgba(255,90,31,.25);}
.badge.green,.tag.green{background:rgba(74,222,128,.12);color:#4ade80;border-color:rgba(74,222,128,.25);}
.badge.red,.tag.red{background:rgba(248,113,113,.12);color:#f87171;border-color:rgba(248,113,113,.25);}
/* Sections */
.section{padding:40px 0 0;}
.section-title{font-family:var(--font-disp);font-size:20px;font-weight:700;margin-bottom:18px;color:var(--text);}
.section-title span,.acc{color:var(--accent);}
/* Output/preview areas */
.output-area,.preview,.result-card,.output-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;margin-top:24px;}
/* Dividers */
hr,.rule,.divider{border:none;border-top:1px solid var(--line);margin:32px 0;}
/* Checklist items */
.check-item{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
.check-item:last-child{border-bottom:none;}
.check-item input[type="checkbox"]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;}
/* Lists */
.list-item{padding:12px 0;border-bottom:1px solid var(--line);color:var(--text-dim);}
.list-item:last-child{border-bottom:none;}
/* Stats / KPI */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:28px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px 22px;}
.stat-label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin-bottom:8px;}
.stat-value{font-family:var(--font-disp);font-size:30px;font-weight:800;color:var(--text);}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:11px 22px;font-size:14px;color:var(--text);transition:transform .3s var(--ease),opacity .3s;opacity:0;z-index:999;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
/* Footer */
.footer{border-top:1px solid var(--line);padding:24px 0;text-align:center;font-size:13px;color:var(--steel);margin-top:64px;}
.footer a{color:var(--accent);}
/* Responsive */
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}.card,.panel,.form-card{padding:20px 16px;}.stat-grid{grid-template-columns:1fr 1fr;}}

/* ── PIPELINE ── */
.pipeline{display:flex;gap:12px;padding:16px 24px;overflow-x:auto;background:var(--surface-2);border-bottom:1px solid var(--line);}
.pipeline-stage{flex:1;min-width:130px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;text-align:center;}
.pipeline-stage .stage-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--steel);margin-bottom:4px;}
.pipeline-stage .stage-count{font-size:26px;font-weight:800;color:var(--accent);line-height:1;font-family:var(--font-disp);}
.pipeline-stage .stage-mrr{font-size:11px;color:var(--steel);margin-top:3px;}
.pipeline-stage.active{border-color:rgba(255,90,31,.4);background:rgba(255,90,31,.07);}
.pipeline-stage.active .stage-label{color:var(--ember);}

/* ── TOOLBAR ── */
.toolbar{display:flex;gap:10px;align-items:center;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;}
.toolbar select,.toolbar input[type="text"]{padding:7px 12px;border:1.5px solid var(--line-2);border-radius:var(--r-sm);font-size:13px;background:var(--ink-2);color:var(--text);outline:none;width:auto;}
.toolbar select:focus,.toolbar input:focus{border-color:var(--accent);}
.toolbar-spacer{flex:1;}
.btn-add{background:var(--accent);color:#fff;border:none;padding:8px 18px;border-radius:var(--r-pill);font-size:13px;font-weight:600;cursor:pointer;transition:background 0.2s;white-space:nowrap;font-family:var(--font-body);}
.btn-add:hover{background:var(--ember);}
.overdue-banner{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);border-radius:var(--r-sm);padding:6px 12px;font-size:12px;color:#f87171;font-weight:600;display:none;}
.overdue-banner.visible{display:block;}

/* ── TABLE overrides ── */
.table-wrap{overflow-x:auto;padding:0 24px 24px;background:transparent;border:none;border-radius:0;}
table{width:100%;border-collapse:collapse;margin-top:14px;background:var(--surface);border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);}
thead tr{background:var(--surface-2);}
thead th{padding:11px 12px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;color:var(--steel);border-bottom:1px solid var(--line);}
tbody tr{border-bottom:1px solid var(--line);transition:background 0.15s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:rgba(255,255,255,.025);}
tbody tr.overdue-row{background:rgba(248,113,113,.06);}
tbody tr.overdue-row:hover{background:rgba(248,113,113,.09);}
td{padding:10px 12px;vertical-align:top;font-size:13px;color:var(--text-dim);border-bottom:1px solid var(--line);}
td.name-cell{font-weight:600;min-width:130px;color:var(--text);}
td.biz-cell{color:var(--steel);min-width:130px;}
td.notes-cell{max-width:180px;color:var(--steel);font-size:12px;word-break:break-word;}

/* ── TYPE BADGES ── */
.type-badge{display:inline-block;padding:2px 8px;border-radius:var(--r-pill);font-size:11px;font-weight:600;}
.type-web-designer{background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.25);}
.type-digital-marketing-agency{background:rgba(74,222,128,.12);color:#4ade80;border:1px solid rgba(74,222,128,.25);}
.type-business-coach{background:rgba(167,139,250,.12);color:#a78bfa;border:1px solid rgba(167,139,250,.25);}
.type-accountant{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.25);}
.type-insurance-agent{background:rgba(248,113,113,.12);color:#f87171;border:1px solid rgba(248,113,113,.25);}

/* ── STATUS BADGES ── */
.status-badge{display:inline-block;padding:3px 9px;border-radius:var(--r-pill);font-size:11px;font-weight:700;}
.status-prospect{background:rgba(133,133,142,.12);color:var(--steel);border:1px solid rgba(133,133,142,.25);}
.status-contacted{background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.25);}
.status-in-conversation{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.25);}
.status-partnership-active{background:rgba(74,222,128,.12);color:#4ade80;border:1px solid rgba(74,222,128,.25);}
.status-declined{background:rgba(248,113,113,.12);color:#f87171;border:1px solid rgba(248,113,113,.25);}

.overdue-tag{display:inline-block;background:rgba(248,113,113,.2);color:#f87171;font-size:10px;font-weight:700;padding:1px 6px;border-radius:var(--r-pill);margin-left:4px;vertical-align:middle;border:1px solid rgba(248,113,113,.3);}

.referrals-num{display:inline-block;background:rgba(255,90,31,.12);color:var(--accent);font-weight:700;padding:2px 8px;border-radius:var(--r-pill);font-size:12px;border:1px solid rgba(255,90,31,.25);}
.referrals-num.zero{background:rgba(133,133,142,.1);color:var(--steel);border-color:rgba(133,133,142,.2);}

.action-btn{background:none;border:none;cursor:pointer;padding:4px 7px;border-radius:var(--r-sm);font-size:13px;transition:background 0.15s;}
.action-btn.edit{color:#60a5fa;}
.action-btn.edit:hover{background:rgba(59,130,246,.12);}
.action-btn.delete{color:#f87171;}
.action-btn.delete:hover{background:rgba(248,113,113,.12);}
.action-btn.pitch{color:var(--accent);}
.action-btn.pitch:hover{background:rgba(255,90,31,.12);}

.linkedin-link{color:#60a5fa;text-decoration:none;font-size:12px;}
.linkedin-link:hover{text-decoration:underline;}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-md);padding:28px 28px 22px;width:660px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.modal-header{display:flex;align-items:center;margin-bottom:20px;}
.modal-title{font-size:17px;font-weight:700;color:var(--text);font-family:var(--font-disp);}
.modal-close{margin-left:auto;background:none;border:none;font-size:20px;cursor:pointer;color:var(--steel);line-height:1;}
.modal-close:hover{color:#f87171;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;}
.btn-cancel{padding:9px 20px;border:1.5px solid var(--line-2);background:var(--ink-2);border-radius:var(--r-pill);font-size:13px;cursor:pointer;font-weight:600;color:var(--steel);font-family:var(--font-body);}
.btn-cancel:hover{border-color:var(--steel);color:var(--text);}
.btn-save{padding:9px 22px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-pill);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font-body);}
.btn-save:hover{background:var(--ember);}
.btn-export{background:var(--accent);color:#fff;border:none;padding:8px 18px;border-radius:var(--r-pill);font-size:13px;font-weight:600;cursor:pointer;transition:background 0.2s;font-family:var(--font-body);}
.btn-export:hover{background:var(--ember);}

/* ── PITCH MODAL ── */
.pitch-modal{width:520px;}
.pitch-type-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--accent);margin-bottom:6px;}
.pitch-text{background:var(--ink-2);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:14px 16px;font-size:13.5px;line-height:1.7;color:var(--text-dim);margin-bottom:14px;}
.btn-copy{background:var(--surface-2);color:var(--text);border:1.5px solid var(--line-2);padding:8px 18px;border-radius:var(--r-pill);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-body);}
.btn-copy:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
.copy-confirm{display:inline-block;margin-left:10px;color:#4ade80;font-size:12px;font-weight:600;opacity:0;transition:opacity 0.3s;}
.copy-confirm.show{opacity:1;}

/* ── DELETE CONFIRM ── */
.delete-modal{width:380px;text-align:center;}
.delete-icon{font-size:36px;margin-bottom:10px;}
.delete-msg{font-size:15px;color:var(--text);margin-bottom:6px;font-weight:600;font-family:var(--font-disp);}
.delete-sub{font-size:13px;color:var(--steel);margin-bottom:20px;}
.btn-delete-confirm{padding:9px 22px;background:#ef4444;color:#fff;border:none;border-radius:var(--r-pill);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font-body);}
.btn-delete-confirm:hover{background:#dc2626;}

/* ── PITCH CARDS ── */
.all-pitches-section{padding:0 24px 24px;}
.all-pitches{display:grid;margin-top:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.pitch-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;}
.pitch-card:hover{border-color:var(--line-2);}
.pitch-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.pitch-card-type{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--accent);}
.pitch-card-copy{background:none;border:1.5px solid var(--line-2);padding:4px 10px;border-radius:var(--r-sm);font-size:11px;cursor:pointer;color:var(--steel);font-weight:600;font-family:var(--font-body);}
.pitch-card-copy:hover{border-color:var(--accent);color:var(--accent);}
.pitch-card-text{font-size:12.5px;line-height:1.65;color:var(--steel);}

.empty-state{text-align:center;padding:48px 20px;color:var(--steel);}
.empty-state .empty-icon{font-size:40px;margin-bottom:10px;}

@media(max-width:600px){
  .pipeline{gap:8px;}
  .form-grid{grid-template-columns:1fr;}
  .toolbar{gap:8px;}
  .table-wrap{padding:0 10px 16px;}
}
</style>
</head>
<body>

<div class="bg-field" style="position:fixed;inset:0;z-index:-1;pointer-events:none;"><div style="position:absolute;inset:0;background:radial-gradient(720px 460px at 82% -6%,rgba(255,90,31,.09),transparent 60%),radial-gradient(620px 520px at 6% 8%,rgba(255,90,31,.04),transparent 60%);"></div></div>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="4" y="10" width="4" height="12" rx="2" fill="#FF5A1F"/><rect x="10" y="6" width="4" height="20" rx="2" fill="#FF5A1F" opacity=".85"/><rect x="16" y="2" width="4" height="28" rx="2" fill="#FF5A1F" opacity=".7"/><rect x="22" y="6" width="4" height="20" rx="2" fill="#FF5A1F" opacity=".55"/></svg>
      CWI <span class="dot">·</span> Partnership &amp; Referral Outreach Tracker
    </div>
    <a class="back-link" href="../index.html">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2L3 7l5 5"/><line x1="3" y1="7" x2="12" y2="7"/></svg>
      Back
    </a>
  </div>
</header>

<!-- PIPELINE -->
<div class="pipeline" id="pipeline"></div>

<!-- TOOLBAR -->
<div class="toolbar">
  <input type="text" id="searchInput" placeholder="Search name, business, notes..." style="min-width:200px;" oninput="renderTable()">
  <select id="filterType" onchange="renderTable()">
    <option value="">All Types</option>
    <option value="Web Designer">Web Designer</option>
    <option value="Digital Marketing Agency">Digital Marketing Agency</option>
    <option value="Business Coach">Business Coach</option>
    <option value="Accountant">Accountant</option>
    <option value="Insurance Agent">Insurance Agent</option>
  </select>
  <select id="filterStatus" onchange="renderTable()">
    <option value="">All Statuses</option>
    <option value="Prospect">Prospect</option>
    <option value="Contacted">Contacted</option>
    <option value="In Conversation">In Conversation</option>
    <option value="Partnership Active">Partnership Active</option>
    <option value="Declined">Declined</option>
  </select>
  <div class="toolbar-spacer"></div>
  <div class="overdue-banner" id="overdueBanner"></div>
  <button class="btn-add" onclick="openAddModal()">+ Add Partner</button>
  <button class="btn-export" onclick="exportCSV()">Export CSV</button>
</div>

<!-- TABLE -->
<div class="table-wrap">
  <table id="partnersTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Business</th>
        <th>Type</th>
        <th>Contact</th>
        <th>Location</th>
        <th>Status</th>
        <th>First Contact</th>
        <th>Last F/U</th>
        <th>Next F/U</th>
        <th>Method</th>
        <th>Referrals</th>
        <th>Notes</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-icon">🤝</div>
    <div>No partners match your filters.</div>
  </div>
</div>

<!-- PITCH SNIPPETS -->
<div class="all-pitches-section">
  <div style="font-size:13px;font-weight:700;color:var(--steel);text-transform:uppercase;letter-spacing:0.5px;margin-top:4px;">Partnership Pitch Snippets</div>
  <div class="all-pitches" id="allPitches"></div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="formModalTitle">Add Partner</div>
      <button class="modal-close" onclick="closeModal('formModal')">&times;</button>
    </div>
    <form id="partnerForm" onsubmit="savePartner(event)">
      <div class="form-grid">
        <div class="form-group">
          <label for="f_name">Name *</label>
          <input type="text" id="f_name" required placeholder="First Last">
        </div>
        <div class="form-group">
          <label for="f_biz">Business Name</label>
          <input type="text" id="f_biz" placeholder="Company / Studio">
        </div>
        <div class="form-group">
          <label for="f_type">Partner Type *</label>
          <select id="f_type" required>
            <option value="">Select type...</option>
            <option>Web Designer</option>
            <option>Digital Marketing Agency</option>
            <option>Business Coach</option>
            <option>Accountant</option>
            <option>Insurance Agent</option>
          </select>
        </div>
        <div class="form-group">
          <label for="f_status">Status *</label>
          <select id="f_status" required>
            <option value="">Select status...</option>
            <option>Prospect</option>
            <option>Contacted</option>
            <option>In Conversation</option>
            <option>Partnership Active</option>
            <option>Declined</option>
          </select>
        </div>
        <div class="form-group">
          <label for="f_email">Email</label>
          <input type="email" id="f_email" placeholder="email@example.com">
        </div>
        <div class="form-group">
          <label for="f_phone">Phone</label>
          <input type="tel" id="f_phone" placeholder="(555) 000-0000">
        </div>
        <div class="form-group full">
          <label for="f_linkedin">LinkedIn URL</label>
          <input type="url" id="f_linkedin" placeholder="https://linkedin.com/in/...">
        </div>
        <div class="form-group">
          <label for="f_location">Location</label>
          <input type="text" id="f_location" placeholder="City, State">
        </div>
        <div class="form-group">
          <label for="f_method">Contact Method</label>
          <select id="f_method">
            <option value="">Select...</option>
            <option>LinkedIn DM</option>
            <option>Email</option>
            <option>Phone</option>
            <option>Referral</option>
          </select>
        </div>
        <div class="form-group">
          <label for="f_first_contact">Date First Contact</label>
          <input type="date" id="f_first_contact">
        </div>
        <div class="form-group">
          <label for="f_last_followup">Last Follow-up Date</label>
          <input type="date" id="f_last_followup">
        </div>
        <div class="form-group">
          <label for="f_next_followup">Next Follow-up Date</label>
          <input type="date" id="f_next_followup">
        </div>
        <div class="form-group">
          <label for="f_referrals">Referrals Received (#)</label>
          <input type="number" id="f_referrals" min="0" value="0">
        </div>
        <div class="form-group full">
          <label for="f_notes">Notes</label>
          <textarea id="f_notes" placeholder="Conversation notes, interests, context..."></textarea>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeModal('formModal')">Cancel</button>
        <button type="submit" class="btn-save">Save Partner</button>
      </div>
    </form>
  </div>
</div>

<!-- PITCH MODAL -->
<div class="modal-overlay" id="pitchModal">
  <div class="modal pitch-modal">
    <div class="modal-header">
      <div class="modal-title">Partnership Pitch</div>
      <button class="modal-close" onclick="closeModal('pitchModal')">&times;</button>
    </div>
    <div class="pitch-type-label" id="pitchTypeLabel"></div>
    <div class="pitch-text" id="pitchTextDisplay"></div>
    <div>
      <button class="btn-copy" onclick="copyPitch()">Copy to Clipboard</button>
      <span class="copy-confirm" id="copyConfirm">Copied!</span>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM MODAL -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal delete-modal">
    <div class="delete-icon">&#9888;&#65039;</div>
    <div class="delete-msg">Delete this partner?</div>
    <div class="delete-sub" id="deleteModalSub"></div>
    <div class="modal-actions" style="justify-content:center;">
      <button class="btn-cancel" onclick="closeModal('deleteModal')">Cancel</button>
      <button class="btn-delete-confirm" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script>
// ── DATA ────────────────────────────────────────────────────────────────────

const STORAGE_KEY = 'cwi_partners_v1';

const PITCHES = {
  'Web Designer': `Hi [Name] — I help small businesses get real ROI from AI, and your clients are exactly who needs it. Many web designers find that referring clients to CWI AI adds a tangible value-add that keeps those clients happy and loyal to them. I'd love to set up a simple referral arrangement where you earn a commission for every client you send our way who signs on — no extra work on your end, just a natural extension of what you already do for them.`,
  'Digital Marketing Agency': `Hey [Name] — CWI AI works alongside agencies like yours to automate the time-consuming back-end work your clients hate: lead follow-up, appointment setting, review requests, and reporting. Rather than competing, we make your campaigns stickier by handling the conversion layer so your clients see better results and credit you for it. A referral partnership means you earn recurring commissions while we handle everything AI-related — so you can focus on what you do best.`,
  'Business Coach': `[Name], your clients trust you with their biggest growth decisions, and AI automation is the #1 lever they're not yet using. CWI AI helps small business owners cut admin time by 10+ hours a week and close more leads with less effort — exactly the outcome your clients are paying you to deliver. Let's talk about a referral arrangement that puts money in your pocket every time a client you refer gets started with us.`,
  'Accountant': `Hi [Name] — your small business clients are leaving efficiency on the table, and AI automation is the fix most of them don't know exists yet. CWI AI helps them automate invoicing follow-ups, client onboarding, and repetitive admin tasks — which also makes your job easier when their books are cleaner and more consistent. A referral partnership is simple: when a client you mention us to signs on, you earn a commission with zero ongoing work required from you.`,
  'Insurance Agent': `[Name], you're already a trusted advisor to your small business clients, and adding CWI AI to that conversation is a natural fit — it helps them protect their time the same way insurance protects their assets. We automate lead follow-up, scheduling, and client communication so they can grow without adding headcount. Our referral program pays you a commission for every client introduction that converts, with no extra work on your end.`
};

const MRR_BY_TYPE = {
  'Web Designer': 500,
  'Digital Marketing Agency': 800,
  'Business Coach': 600,
  'Accountant': 500,
  'Insurance Agent': 500
};

const STATUSES = ['Prospect', 'Contacted', 'In Conversation', 'Partnership Active', 'Declined'];

// Default sample data
const SAMPLE_DATA = [
  {
    id: uid(),
    name: 'Sarah Mitchell',
    biz: 'Bright Pixel Studio',
    type: 'Web Designer',
    email: 'sarah@brightpixel.co',
    phone: '(512) 555-0147',
    linkedin: 'https://linkedin.com/in/sarahmitchell-design',
    location: 'Austin, TX',
    first_contact: '2026-05-14',
    method: 'LinkedIn DM',
    last_followup: '2026-05-28',
    next_followup: '2026-06-10',
    status: 'In Conversation',
    notes: 'Very interested. Has 12 small biz clients. Wants to see our pricing deck before committing.',
    referrals: 0
  },
  {
    id: uid(),
    name: 'Derek Okafor',
    biz: 'Okafor Growth Advisory',
    type: 'Business Coach',
    email: 'derek@okaforadvisory.com',
    phone: '(646) 555-0382',
    linkedin: 'https://linkedin.com/in/derekokafor',
    location: 'New York, NY',
    first_contact: '2026-04-02',
    method: 'Referral',
    last_followup: '2026-05-19',
    next_followup: '2026-05-30',
    status: 'Partnership Active',
    notes: 'Signed referral agreement 5/19. Sent 2 warm intros already. Monthly check-in scheduled.',
    referrals: 2
  },
  {
    id: uid(),
    name: 'Linda Tran',
    biz: 'Peak Digital Marketing',
    type: 'Digital Marketing Agency',
    email: 'linda@peakdigital.io',
    phone: '(303) 555-0219',
    linkedin: 'https://linkedin.com/in/lindatranmarketing',
    location: 'Denver, CO',
    first_contact: '2026-06-01',
    method: 'Email',
    last_followup: '',
    next_followup: '2026-06-15',
    status: 'Contacted',
    notes: 'Cold email sent 6/1. Manages 20+ SMB clients. Follow up with case study.',
    referrals: 0
  }
];

function uid() {
  return 'p_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let partners = loadData() || JSON.parse(JSON.stringify(SAMPLE_DATA));
if (!loadData()) saveData(partners);

let editingId = null;
let deletingId = null;

// ── PIPELINE ────────────────────────────────────────────────────────────────

function renderPipeline() {
  const el = document.getElementById('pipeline');
  el.innerHTML = '';
  STATUSES.forEach(status => {
    const group = partners.filter(p => p.status === status);
    const mrr = group.reduce((sum, p) => sum + (MRR_BY_TYPE[p.type] || 500), 0);
    const div = document.createElement('div');
    div.className = 'pipeline-stage' + (group.length > 0 ? ' active' : '');
    const activeCount = partners.filter(p => p.status === 'Partnership Active').length;
    const isActive = status === 'Partnership Active';
    div.innerHTML = `
      <div class="stage-label">${status}</div>
      <div class="stage-count">${group.length}</div>
      <div class="stage-mrr">${isActive ? '$' + mrr.toLocaleString() + '/mo MRR' : '~$' + mrr.toLocaleString() + ' potential'}</div>
    `;
    el.appendChild(div);
  });
}

// ── TABLE ───────────────────────────────────────────────────────────────────

function typeClass(type) {
  return 'type-' + type.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
}
function statusClass(status) {
  return 'status-' + status.toLowerCase().replace(/\s+/g, '-');
}

function today() {
  return new Date().toISOString().split('T')[0];
}

function isOverdue(dateStr) {
  if (!dateStr) return false;
  return dateStr < today();
}

function fmt(dateStr) {
  if (!dateStr) return '—';
  const [y, m, d] = dateStr.split('-');
  return `${m}/${d}/${y.slice(2)}`;
}

function renderTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filterType = document.getElementById('filterType').value;
  const filterStatus = document.getElementById('filterStatus').value;

  let filtered = partners.filter(p => {
    const matchSearch = !search || [p.name, p.biz, p.notes, p.location, p.email].join(' ').toLowerCase().includes(search);
    const matchType = !filterType || p.type === filterType;
    const matchStatus = !filterStatus || p.status === filterStatus;
    return matchSearch && matchType && matchStatus;
  });

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  const overdueCount = partners.filter(p => isOverdue(p.next_followup) && p.status !== 'Partnership Active' && p.status !== 'Declined').length;
  const banner = document.getElementById('overdueBanner');
  if (overdueCount > 0) {
    banner.textContent = overdueCount + ' overdue follow-up' + (overdueCount > 1 ? 's' : '');
    banner.classList.add('visible');
  } else {
    banner.classList.remove('visible');
  }

  if (filtered.length === 0) {
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('partnersTable').style.display = 'none';
    return;
  }
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('partnersTable').style.display = '';

  // Sort: overdue first, then by next followup
  filtered.sort((a, b) => {
    const aOver = isOverdue(a.next_followup) ? 0 : 1;
    const bOver = isOverdue(b.next_followup) ? 0 : 1;
    if (aOver !== bOver) return aOver - bOver;
    return (a.next_followup || '9999') < (b.next_followup || '9999') ? -1 : 1;
  });

  filtered.forEach(p => {
    const overdue = isOverdue(p.next_followup) && p.status !== 'Partnership Active' && p.status !== 'Declined';
    const tr = document.createElement('tr');
    if (overdue) tr.className = 'overdue-row';

    const emailHtml = p.email ? `<a href="mailto:${p.email}" style="color:#60a5fa;font-size:12px;display:block;">${p.email}</a>` : '';
    const phoneHtml = p.phone ? `<span style="font-size:12px;color:var(--steel);display:block;">${p.phone}</span>` : '';
    const linkedinHtml = p.linkedin ? `<a href="${p.linkedin}" target="_blank" class="linkedin-link">LinkedIn</a>` : '';

    const nextHtml = p.next_followup
      ? `${fmt(p.next_followup)}${overdue ? '<span class="overdue-tag">OVERDUE</span>' : ''}`
      : '—';

    const refHtml = `<span class="referrals-num${p.referrals == 0 ? ' zero' : ''}">${p.referrals || 0}</span>`;

    tr.innerHTML = `
      <td class="name-cell">${escHtml(p.name)}</td>
      <td class="biz-cell">${escHtml(p.biz || '—')}</td>
      <td><span class="type-badge ${typeClass(p.type)}">${escHtml(p.type)}</span></td>
      <td>${emailHtml}${phoneHtml}${linkedinHtml}</td>
      <td>${escHtml(p.location || '—')}</td>
      <td><span class="status-badge ${statusClass(p.status)}">${escHtml(p.status)}</span></td>
      <td>${fmt(p.first_contact)}</td>
      <td>${fmt(p.last_followup)}</td>
      <td>${nextHtml}</td>
      <td>${escHtml(p.method || '—')}</td>
      <td>${refHtml}</td>
      <td class="notes-cell">${escHtml(p.notes || '—')}</td>
      <td style="white-space:nowrap;">
        <button class="action-btn pitch" title="View Pitch" onclick="openPitchModal('${p.id}')">&#128172;</button>
        <button class="action-btn edit" title="Edit" onclick="openEditModal('${p.id}')">&#9998;</button>
        <button class="action-btn delete" title="Delete" onclick="openDeleteModal('${p.id}')">&#128465;</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── MODALS ──────────────────────────────────────────────────────────────────

function openModal(id) {
  document.getElementById(id).classList.add('open');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

function openAddModal() {
  editingId = null;
  document.getElementById('formModalTitle').textContent = 'Add Partner';
  document.getElementById('partnerForm').reset();
  document.getElementById('f_referrals').value = '0';
  openModal('formModal');
}

function openEditModal(id) {
  const p = partners.find(x => x.id === id);
  if (!p) return;
  editingId = id;
  document.getElementById('formModalTitle').textContent = 'Edit Partner';
  document.getElementById('f_name').value = p.name || '';
  document.getElementById('f_biz').value = p.biz || '';
  document.getElementById('f_type').value = p.type || '';
  document.getElementById('f_status').value = p.status || '';
  document.getElementById('f_email').value = p.email || '';
  document.getElementById('f_phone').value = p.phone || '';
  document.getElementById('f_linkedin').value = p.linkedin || '';
  document.getElementById('f_location').value = p.location || '';
  document.getElementById('f_method').value = p.method || '';
  document.getElementById('f_first_contact').value = p.first_contact || '';
  document.getElementById('f_last_followup').value = p.last_followup || '';
  document.getElementById('f_next_followup').value = p.next_followup || '';
  document.getElementById('f_referrals').value = p.referrals || 0;
  document.getElementById('f_notes').value = p.notes || '';
  openModal('formModal');
}

function savePartner(e) {
  e.preventDefault();
  const p = {
    id: editingId || uid(),
    name: document.getElementById('f_name').value.trim(),
    biz: document.getElementById('f_biz').value.trim(),
    type: document.getElementById('f_type').value,
    status: document.getElementById('f_status').value,
    email: document.getElementById('f_email').value.trim(),
    phone: document.getElementById('f_phone').value.trim(),
    linkedin: document.getElementById('f_linkedin').value.trim(),
    location: document.getElementById('f_location').value.trim(),
    method: document.getElementById('f_method').value,
    first_contact: document.getElementById('f_first_contact').value,
    last_followup: document.getElementById('f_last_followup').value,
    next_followup: document.getElementById('f_next_followup').value,
    referrals: parseInt(document.getElementById('f_referrals').value) || 0,
    notes: document.getElementById('f_notes').value.trim()
  };
  if (editingId) {
    const idx = partners.findIndex(x => x.id === editingId);
    if (idx >= 0) partners[idx] = p;
  } else {
    partners.push(p);
  }
  saveData(partners);
  closeModal('formModal');
  renderPipeline();
  renderTable();
}

function openDeleteModal(id) {
  deletingId = id;
  const p = partners.find(x => x.id === id);
  document.getElementById('deleteModalSub').textContent = p ? `${p.name} — ${p.biz || p.type}` : '';
  openModal('deleteModal');
}

function confirmDelete() {
  partners = partners.filter(x => x.id !== deletingId);
  saveData(partners);
  closeModal('deleteModal');
  renderPipeline();
  renderTable();
}

// ── PITCH MODAL ──────────────────────────────────────────────────────────────

function openPitchModal(id) {
  const p = partners.find(x => x.id === id);
  if (!p) return;
  const pitchText = PITCHES[p.type] || 'Pitch not available for this partner type.';
  const personalized = pitchText.replace(/\[Name\]/g, p.name.split(' ')[0]);
  document.getElementById('pitchTypeLabel').textContent = p.type;
  document.getElementById('pitchTextDisplay').textContent = personalized;
  document.getElementById('copyConfirm').classList.remove('show');
  openModal('pitchModal');
}

function copyPitch() {
  const text = document.getElementById('pitchTextDisplay').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const el = document.getElementById('copyConfirm');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
  });
}

// ── ALL PITCH CARDS ──────────────────────────────────────────────────────────

function renderPitchCards() {
  const container = document.getElementById('allPitches');
  container.innerHTML = '';
  Object.entries(PITCHES).forEach(([type, text]) => {
    const card = document.createElement('div');
    card.className = 'pitch-card';
    card.innerHTML = `
      <div class="pitch-card-header">
        <div class="pitch-card-type">${escHtml(type)}</div>
        <button class="pitch-card-copy" onclick="copyText(this, \`${text.replace(/`/g,'\\`')}\`)">Copy</button>
      </div>
      <div class="pitch-card-text">${escHtml(text)}</div>
    `;
    container.appendChild(card);
  });
}

function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied!';
    btn.style.color = '#4ade80';
    btn.style.borderColor = '#4ade80';
    setTimeout(() => {
      btn.textContent = 'Copy';
      btn.style.color = '';
      btn.style.borderColor = '';
    }, 2000);
  });
}

// ── CSV EXPORT ───────────────────────────────────────────────────────────────

function exportCSV() {
  const headers = ['Name','Business','Type','Email','Phone','LinkedIn','Location','Status','First Contact','Contact Method','Last Followup','Next Followup','Referrals Received','Notes'];
  const rows = partners.map(p => [
    p.name, p.biz, p.type, p.email, p.phone, p.linkedin, p.location,
    p.status, p.first_contact, p.method, p.last_followup, p.next_followup,
    p.referrals, p.notes
  ].map(v => `"${String(v || '').replace(/"/g, '""')}"`));

  const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cwi-ai-partner-outreach-' + today() + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// ── CLOSE ON BACKDROP ────────────────────────────────────────────────────────

document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

// ── INIT ─────────────────────────────────────────────────────────────────────

renderPipeline();
renderTable();
renderPitchCards();
</script>
