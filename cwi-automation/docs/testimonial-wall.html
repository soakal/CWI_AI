<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testimonial Wall — CWI</title>
<meta name="description" content="Curated client testimonials for CWI — filter, copy, and publish client wins across email, social, and website formats.">
<link rel="icon" type="image/png" href="../assets/cwi-favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0A0C;--ink-2:#0E0E11;--surface:#141418;--surface-2:#191920;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.14);--accent:#FF5A1F;--ember:#FF8A3D;--steel:#85858E;--text:#F4F4F6;--text-dim:#C2C2C8;--font-disp:'Sora',sans-serif;--font-body:'Instrument Sans',sans-serif;--r-sm:12px;--r-md:18px;--r-pill:999px;--ease:cubic-bezier(.22,.61,.36,1);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--ink);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh;padding:0 0 64px;}
h1,h2,h3,h4,h5,h6{font-family:var(--font-disp);letter-spacing:-.03em;line-height:1.15;font-weight:800;color:var(--text);}
a{color:var(--accent);text-decoration:none;}
p{color:var(--text-dim);line-height:1.65;}
ul,ol{color:var(--text-dim);padding-left:1.4em;}
li{margin-bottom:6px;}
/* Layout */
.wrap{max-width:960px;margin:0 auto;padding:0 24px;}
.container{max-width:900px;margin:0 auto;padding:0 24px;}
/* Topbar */
.topbar{border-bottom:1px solid var(--line);background:rgba(10,10,12,.9);backdrop-filter:blur(14px);position:sticky;top:0;z-index:100;padding:14px 0;}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:960px;margin:0 auto;padding:0 24px;}
.logo{font-family:var(--font-disp);font-weight:800;font-size:17px;letter-spacing:-.04em;display:flex;align-items:center;gap:8px;color:var(--text);}
.logo .dot{color:var(--accent);}
.back-link{font-size:13px;color:var(--steel);display:flex;align-items:center;gap:5px;transition:color .2s;}
.back-link:hover{color:var(--text);}
/* Hero */
.page-header,.hero{padding:52px 0 32px;text-align:center;}
.page-header .logo-block,.hero .logo-block{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-disp);font-size:20px;font-weight:800;margin-bottom:10px;color:var(--accent);}
.kicker,.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--steel);margin-bottom:16px;}
.pip{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.hero h1,.page-title{font-size:clamp(26px,3.5vw,44px);margin-bottom:12px;}
.hero p,.page-subtitle{font-size:clamp(14px,1.5vw,16px);color:var(--text-dim);max-width:52ch;margin:0 auto;}
/* Cards & panels */
.card,.panel,.form-card,.section-card,.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;margin-bottom:24px;}
.card:hover,.panel:hover{border-color:var(--line-2);}
/* Form elements */
label,.form-label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);display:block;margin-bottom:6px;}
input,select,textarea,.form-control{width:100%;background:var(--ink-2);border:1.5px solid var(--line-2);border-radius:var(--r-sm);padding:10px 14px;font-size:14px;font-family:var(--font-body);color:var(--text);outline:none;transition:border-color .2s;box-sizing:border-box;}
input:focus,select:focus,textarea:focus,.form-control:focus{border-color:var(--accent);background:var(--surface);}
textarea{resize:vertical;min-height:96px;}
select option{background:var(--surface);color:var(--text);}
/* Form layout */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.form-group,.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.form-group.full,.field.full{grid-column:1/-1;}
/* Buttons */
.btn,.btn-primary,.btn-generate,.btn-action{font-family:var(--font-body);font-size:14px;font-weight:600;padding:11px 24px;border-radius:var(--r-pill);border:1.5px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:all .22s var(--ease);display:inline-flex;align-items:center;gap:8px;text-decoration:none;}
.btn:hover,.btn-primary:hover,.btn-generate:hover,.btn-action:hover{background:var(--ember);border-color:var(--ember);box-shadow:0 0 22px rgba(255,90,31,.35);}
.btn-outline,.btn-ghost,.btn-secondary{background:rgba(255,90,31,.1);border-color:var(--accent);color:var(--text);}
.btn-outline:hover,.btn-ghost:hover,.btn-secondary:hover{background:var(--accent);color:#fff;}
.btn-sm{padding:8px 16px;font-size:13px;}
/* Tables */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:32px;}
table{width:100%;border-collapse:collapse;}
thead{background:var(--surface-2);}
th{font-family:var(--font-disp);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);}
td{font-size:14px;color:var(--text-dim);padding:11px 16px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
/* Badges / tags */
.badge,.tag{display:inline-block;padding:3px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:600;background:rgba(255,90,31,.12);color:var(--accent);border:1px solid rgba(255,90,31,.25);}
.badge.green,.tag.green{background:rgba(74,222,128,.12);color:#4ade80;border-color:rgba(74,222,128,.25);}
.badge.red,.tag.red{background:rgba(248,113,113,.12);color:#f87171;border-color:rgba(248,113,113,.25);}
/* Sections */
.section{padding:40px 0 0;}
.section-title{font-family:var(--font-disp);font-size:20px;font-weight:700;margin-bottom:18px;color:var(--text);}
.section-title span,.acc{color:var(--accent);}
/* Output/preview areas */
.output-area,.preview,.result-card,.output-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;margin-top:24px;}
/* Dividers */
hr,.rule,.divider{border:none;border-top:1px solid var(--line);margin:32px 0;}
/* Checklist items */
.check-item{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
.check-item:last-child{border-bottom:none;}
.check-item input[type="checkbox"]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;}
/* Lists */
.list-item{padding:12px 0;border-bottom:1px solid var(--line);color:var(--text-dim);}
.list-item:last-child{border-bottom:none;}
/* Stats / KPI */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:28px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px 22px;}
.stat-label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin-bottom:8px;}
.stat-value{font-family:var(--font-disp);font-size:30px;font-weight:800;color:var(--text);}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:11px 22px;font-size:14px;color:var(--text);transition:transform .3s var(--ease),opacity .3s;opacity:0;z-index:999;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
/* Footer */
.footer{border-top:1px solid var(--line);padding:24px 0;text-align:center;font-size:13px;color:var(--steel);margin-top:64px;}
.footer a{color:var(--accent);}
/* Responsive */
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}.card,.panel,.form-card{padding:20px 16px;}.stat-grid{grid-template-columns:1fr 1fr;}}

/* ── Testimonial Wall specific ── */
/* Toolbar */
.toolbar{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 32px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.filter-label{font-size:11px;font-weight:600;color:var(--steel);text-transform:uppercase;letter-spacing:.1em;}
.filter-btn{padding:6px 14px;border-radius:var(--r-pill);border:1.5px solid var(--line-2);background:transparent;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--steel);font-family:var(--font-body);}
.filter-btn:hover{border-color:var(--accent);color:var(--accent);}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.toolbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.search-box{padding:8px 14px;border:1.5px solid var(--line-2);border-radius:var(--r-sm);font-size:14px;outline:none;transition:border-color .15s;width:220px;background:var(--ink-2);color:var(--text);font-family:var(--font-body);}
.search-box:focus{border-color:var(--accent);background:var(--surface);}
/* Stats bar */
.stats-bar{padding:16px 32px;display:flex;gap:16px;flex-wrap:wrap;}
.stat-chip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 18px;display:flex;align-items:center;gap:10px;}
.stat-chip .stat-val{font-size:1.4rem;font-weight:800;color:var(--accent);font-family:var(--font-disp);}
.stat-chip .stat-lbl{font-size:12px;color:var(--steel);line-height:1.3;}
/* Testimonial grid */
.grid{padding:0 32px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;}
/* Testimonial card overrides (card base is set above) */
.card{padding:0;display:flex;flex-direction:column;position:relative;overflow:hidden;transition:box-shadow .2s,transform .2s,border-color .2s;}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(255,90,31,.13);}
.card.published{border-color:rgba(74,222,128,.3);}
.card.published::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:#4ade80;}
.card-header{padding:18px 20px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.stars{color:#f59e0b;font-size:1rem;letter-spacing:1px;}
.published-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#4ade80;background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.25);padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap;text-transform:none;letter-spacing:0;}
.card-body{padding:0 20px 16px;flex:1;}
.quote-mark{font-size:3rem;line-height:0.7;color:var(--accent);opacity:.25;font-family:Georgia,serif;margin-bottom:-6px;display:block;}
.quote-text{font-size:0.95rem;line-height:1.65;color:var(--text-dim);font-style:italic;margin-top:4px;}
.card-meta{padding:12px 20px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:0.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.meta-info{flex:1;min-width:0;}
.meta-name{font-weight:700;font-size:0.9rem;color:var(--text);}
.meta-loc{font-size:12px;color:var(--steel);}
.industry-badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:var(--r-sm);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
.badge-plumbing{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.25);}
.badge-hvac{background:rgba(236,72,153,.12);color:#f472b6;border:1px solid rgba(236,72,153,.25);}
.badge-accounting{background:rgba(74,222,128,.12);color:#4ade80;border:1px solid rgba(74,222,128,.25);}
/* Action buttons */
.card-actions{padding:10px 20px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.action-btn{padding:6px 11px;border-radius:var(--r-sm);border:1.5px solid var(--line-2);background:transparent;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--steel);display:flex;align-items:center;gap:5px;font-family:var(--font-body);}
.action-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(255,90,31,.08);}
.action-btn.copied{border-color:#4ade80;color:#4ade80;background:rgba(74,222,128,.1);}
.publish-toggle{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--steel);cursor:pointer;user-select:none;}
.toggle-switch{width:34px;height:20px;border-radius:10px;background:rgba(255,255,255,.12);position:relative;transition:background .2s;flex-shrink:0;border:none;cursor:pointer;padding:0;}
.toggle-switch::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.4);}
.toggle-switch.on{background:#4ade80;}
.toggle-switch.on::after{transform:translateX(14px);}
.delete-btn{background:none;border:none;cursor:pointer;color:var(--steel);font-size:1rem;padding:4px;border-radius:4px;transition:color .15s;line-height:1;}
.delete-btn:hover{color:#f87171;}
/* Empty state */
.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--steel);}
.empty-state .empty-icon{font-size:3rem;margin-bottom:12px;}
.empty-state h3{font-size:1.1rem;margin-bottom:6px;color:var(--text);}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-md);width:100%;max-width:540px;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:translateY(20px);transition:transform .2s;}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-header{padding:22px 24px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.modal-header h2{font-size:1.1rem;font-weight:700;color:var(--text);}
.close-btn{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--steel);line-height:1;padding:4px;border-radius:4px;transition:color .15s;}
.close-btn:hover{color:var(--text);}
.modal-body{padding:20px 24px;display:flex;flex-direction:column;gap:14px;}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-label{font-size:11px;font-weight:700;color:var(--steel);text-transform:uppercase;letter-spacing:.08em;}
.form-input,.form-select,.form-textarea{padding:10px 13px;border:1.5px solid var(--line-2);border-radius:var(--r-sm);font-size:14px;outline:none;transition:border-color .15s;font-family:var(--font-body);color:var(--text);background:var(--ink-2);}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);background:var(--surface);}
.form-textarea{resize:vertical;min-height:90px;}
.form-select option{background:var(--surface);color:var(--text);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.star-picker{display:flex;gap:6px;}
.star-pick{font-size:1.5rem;cursor:pointer;color:rgba(255,255,255,.2);transition:color .12s;border:none;background:none;padding:2px;line-height:1;}
.star-pick.lit{color:#f59e0b;}
.star-pick:hover{color:#f59e0b;}
.modal-footer{padding:16px 24px 22px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);}
.btn-cancel{background:rgba(255,255,255,.07);color:var(--text-dim);padding:10px 18px;border-radius:var(--r-pill);border:1.5px solid var(--line-2);font-weight:600;cursor:pointer;font-size:14px;font-family:var(--font-body);transition:all .15s;}
.btn-cancel:hover{background:rgba(255,255,255,.12);color:var(--text);}
@media(max-width:600px){.toolbar,.stats-bar,.grid{padding-left:16px;padding-right:16px;}.grid{grid-template-columns:1fr;}.form-row{grid-template-columns:1fr;}.search-box{width:160px;}}
</style>
</head>
<body>

<div class="bg-field" style="position:fixed;inset:0;z-index:-1;pointer-events:none;"><div style="position:absolute;inset:0;background:radial-gradient(720px 460px at 82% -6%,rgba(255,90,31,.09),transparent 60%),radial-gradient(620px 520px at 6% 8%,rgba(255,90,31,.04),transparent 60%);"></div></div>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="4" y="10" width="4" height="12" rx="2" fill="#FF5A1F"/><rect x="10" y="6" width="4" height="20" rx="2" fill="#FF5A1F" opacity=".85"/><rect x="16" y="2" width="4" height="28" rx="2" fill="#FF5A1F" opacity=".7"/><rect x="22" y="6" width="4" height="20" rx="2" fill="#FF5A1F" opacity=".55"/></svg>
      CWI <span class="dot">·</span> Testimonial Wall
    </div>
    <a class="back-link" href="../index.html">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2L3 7l5 5"/><line x1="3" y1="7" x2="12" y2="7"/></svg>
      Back
    </a>
  </div>
</header>

<!-- TOOLBAR -->
<div class="toolbar">
  <span class="filter-label">Filter:</span>
  <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
  <button class="filter-btn" data-filter="Plumbing" onclick="setFilter('Plumbing', this)">Plumbing</button>
  <button class="filter-btn" data-filter="HVAC" onclick="setFilter('HVAC', this)">HVAC</button>
  <button class="filter-btn" data-filter="Accounting" onclick="setFilter('Accounting', this)">Accounting</button>
  <button class="filter-btn" data-filter="published" onclick="setFilter('published', this)">Published to Website</button>
  <div class="toolbar-right">
    <input class="search-box" type="text" placeholder="Search testimonials..." oninput="renderGrid()" id="searchInput">
    <button class="btn btn-sm" onclick="openModal()">&#43; Add Testimonial</button>
  </div>
</div>

<!-- STATS BAR -->
<div class="stats-bar" id="statsBar"></div>

<!-- GRID -->
<div class="grid" id="testimonialGrid"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Add Testimonial</h2>
      <button class="close-btn" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label" for="starPicker">Star Rating</label>
        <div class="star-picker" id="starPicker">
          <button class="star-pick lit" data-val="1" onclick="setStars(1)">&#9733;</button>
          <button class="star-pick lit" data-val="2" onclick="setStars(2)">&#9733;</button>
          <button class="star-pick lit" data-val="3" onclick="setStars(3)">&#9733;</button>
          <button class="star-pick lit" data-val="4" onclick="setStars(4)">&#9733;</button>
          <button class="star-pick lit" data-val="5" onclick="setStars(5)">&#9733;</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="formQuote">Quote</label>
        <textarea class="form-textarea" id="formQuote" placeholder="What did the client say?"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="formName">Client Name</label>
          <input class="form-input" id="formName" type="text" placeholder="e.g. Mike T.">
        </div>
        <div class="form-group">
          <label class="form-label" for="formIndustry">Industry</label>
          <select class="form-select" id="formIndustry">
            <option value="Plumbing">Plumbing</option>
            <option value="HVAC">HVAC</option>
            <option value="Accounting">Accounting</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="formLocation">Location</label>
        <input class="form-input" id="formLocation" type="text" placeholder="e.g. Dearborn, MI">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTestimonial()">Save Testimonial</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ─── DATA SEED ───────────────────────────────────────────────────────────────
const SEED = [
  {
    id: 1,
    stars: 5,
    quote: "Before CWI AI, I was losing 3-4 jobs a week to voicemail. Now my bot answers at 2am and books the job. Best investment I made.",
    name: "Mike T.",
    industry: "Plumbing",
    location: "Dearborn, MI",
    published: false
  },
  {
    id: 2,
    stars: 5,
    quote: "The monthly report alone is worth it. I finally know which leads come from Google vs referrals.",
    name: "Sarah L.",
    industry: "HVAC",
    location: "Westland, MI",
    published: false
  },
  {
    id: 3,
    stars: 5,
    quote: "Setup took 5 days. First week, the bot booked 2 jobs I would have missed. Already paid for itself.",
    name: "Dave K.",
    industry: "Plumbing",
    location: "Trenton, MI",
    published: false
  },
  {
    id: 4,
    stars: 5,
    quote: "My phone used to go to voicemail after 6pm. Now I get bookings while I sleep.",
    name: "Tony R.",
    industry: "HVAC",
    location: "Riverview, MI",
    published: false
  },
  {
    id: 5,
    stars: 5,
    quote: "I was skeptical about AI for accounting. But the appointment booking alone saves me 2 hours a week.",
    name: "Jennifer M.",
    industry: "Accounting",
    location: "Southgate, MI",
    published: false
  },
  {
    id: 6,
    stars: 5,
    quote: "The follow-up sequence recovered 2 leads that ghosted me. Pure profit.",
    name: "Carlos P.",
    industry: "Plumbing",
    location: "Taylor, MI",
    published: false
  },
  {
    id: 7,
    stars: 5,
    quote: "30-day guarantee made it easy to try. Never looked back.",
    name: "Lisa W.",
    industry: "Accounting",
    location: "Downriver, MI",
    published: false
  },
  {
    id: 8,
    stars: 5,
    quote: "Brian set everything up in a week. No tech skills needed on my end.",
    name: "Frank B.",
    industry: "HVAC",
    location: "Wyandotte, MI",
    published: false
  }
];

// ─── STATE ────────────────────────────────────────────────────────────────────
let testimonials = [];
let activeFilter = 'all';
let editingId = null;
let formStars = 5;

const STORAGE_KEY = 'cwi_testimonials_v1';

function load() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    testimonials = JSON.parse(raw);
  } else {
    testimonials = JSON.parse(JSON.stringify(SEED));
    save();
  }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(testimonials));
}

function nextId() {
  return testimonials.length > 0 ? Math.max(...testimonials.map(t => t.id)) + 1 : 1;
}

// ─── FILTER ───────────────────────────────────────────────────────────────────
function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderGrid();
}

function getFiltered() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  return testimonials.filter(t => {
    const matchFilter = activeFilter === 'all'
      ? true
      : activeFilter === 'published'
      ? t.published
      : t.industry === activeFilter;
    const matchSearch = !q || t.quote.toLowerCase().includes(q)
      || t.name.toLowerCase().includes(q)
      || t.location.toLowerCase().includes(q)
      || t.industry.toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });
}

// ─── STATS ────────────────────────────────────────────────────────────────────
function renderStats() {
  const total = testimonials.length;
  const pub = testimonials.filter(t => t.published).length;
  const plumb = testimonials.filter(t => t.industry === 'Plumbing').length;
  const hvac = testimonials.filter(t => t.industry === 'HVAC').length;
  const acct = testimonials.filter(t => t.industry === 'Accounting').length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-chip"><span class="stat-val">${total}</span><span class="stat-lbl">Total<br>Testimonials</span></div>
    <div class="stat-chip"><span class="stat-val">${pub}</span><span class="stat-lbl">Published to<br>Website</span></div>
    <div class="stat-chip"><span class="stat-val">${plumb}</span><span class="stat-lbl">Plumbing<br>Clients</span></div>
    <div class="stat-chip"><span class="stat-val">${hvac}</span><span class="stat-lbl">HVAC<br>Clients</span></div>
    <div class="stat-chip"><span class="stat-val">${acct}</span><span class="stat-lbl">Accounting<br>Clients</span></div>
  `;
}

// ─── BADGE ────────────────────────────────────────────────────────────────────
function badgeClass(industry) {
  if (industry === 'Plumbing') return 'badge-plumbing';
  if (industry === 'HVAC') return 'badge-hvac';
  if (industry === 'Accounting') return 'badge-accounting';
  return 'badge-plumbing';
}

function initials(name) {
  return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
}

function starsHTML(n) {
  return '&#9733;'.repeat(n) + (n < 5 ? '<span style="color:#e5e7eb">' + '&#9733;'.repeat(5-n) + '</span>' : '');
}

// ─── GRID ─────────────────────────────────────────────────────────────────────
function renderGrid() {
  const filtered = getFiltered();
  const grid = document.getElementById('testimonialGrid');
  renderStats();

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-icon">&#128172;</div>
      <h3>No testimonials found</h3>
      <p>Try a different filter or add a new testimonial.</p>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(t => `
    <div class="card${t.published ? ' published' : ''}" id="card-${t.id}">
      <div class="card-header">
        <div class="stars">${starsHTML(t.stars)}</div>
        <div style="display:flex;align-items:center;gap:8px;">
          ${t.published ? '<span class="published-badge">&#10003; On Website</span>' : ''}
          <button class="delete-btn" onclick="deleteTestimonial(${t.id})" title="Delete">&#128465;</button>
        </div>
      </div>
      <div class="card-body">
        <span class="quote-mark">"</span>
        <p class="quote-text">${escapeHTML(t.quote)}"</p>
      </div>
      <div class="card-meta">
        <div class="avatar">${initials(t.name)}</div>
        <div class="meta-info">
          <div class="meta-name">${escapeHTML(t.name)}</div>
          <div class="meta-loc">&#128205; ${escapeHTML(t.location)}</div>
        </div>
        <span class="industry-badge ${badgeClass(t.industry)}">${escapeHTML(t.industry)}</span>
      </div>
      <div class="card-actions">
        <button class="action-btn" onclick="copyFormat(${t.id},'email',this)" title="Copy formatted for email">
          &#128140; Email Quote
        </button>
        <button class="action-btn" onclick="copyFormat(${t.id},'social',this)" title="Copy formatted for social">
          &#128248; Social Post
        </button>
        <button class="action-btn" onclick="copyFormat(${t.id},'website',this)" title="Copy formatted for website">
          &#127760; Website
        </button>
        <label class="publish-toggle" title="Toggle website published status">
          <button class="toggle-switch${t.published ? ' on' : ''}" onclick="togglePublished(${t.id})" type="button"></button>
          <span>${t.published ? 'Published' : 'Draft'}</span>
        </label>
      </div>
    </div>
  `).join('');
}

// ─── COPY FORMATS ─────────────────────────────────────────────────────────────
function copyFormat(id, format, btn) {
  const t = testimonials.find(x => x.id === id);
  if (!t) return;

  let text = '';
  const stars = '★'.repeat(t.stars);

  if (format === 'email') {
    text = `"${t.quote}"\n\n— ${t.name}, ${t.industry}, ${t.location}`;
  } else if (format === 'social') {
    text = `${stars}\n\n"${t.quote}"\n\n— ${t.name}, ${t.industry} contractor, ${t.location}\n\n#CWI_AI #AI #${t.industry} #SmallBusiness #AutomateYourBusiness`;
  } else if (format === 'website') {
    text = `<blockquote>\n  <p>"${t.quote}"</p>\n  <cite>— ${t.name}, ${t.industry}, ${t.location}</cite>\n</blockquote>`;
  }

  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.innerHTML;
    btn.classList.add('copied');
    btn.innerHTML = '&#10003; Copied!';
    showToast('Copied to clipboard');
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = orig;
    }, 2000);
  }).catch(() => {
    // fallback
    const el = document.createElement('textarea');
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    showToast('Copied to clipboard');
  });
}

// ─── PUBLISH TOGGLE ───────────────────────────────────────────────────────────
function togglePublished(id) {
  const t = testimonials.find(x => x.id === id);
  if (!t) return;
  t.published = !t.published;
  save();
  renderGrid();
  showToast(t.published ? 'Marked as published to website' : 'Removed from website');
}

// ─── DELETE ───────────────────────────────────────────────────────────────────
function deleteTestimonial(id) {
  if (!confirm('Delete this testimonial? This cannot be undone.')) return;
  testimonials = testimonials.filter(t => t.id !== id);
  save();
  renderGrid();
  showToast('Testimonial deleted');
}

// ─── MODAL ────────────────────────────────────────────────────────────────────
function openModal(id) {
  editingId = id || null;
  formStars = 5;

  if (id) {
    const t = testimonials.find(x => x.id === id);
    document.getElementById('modalTitle').textContent = 'Edit Testimonial';
    document.getElementById('formQuote').value = t.quote;
    document.getElementById('formName').value = t.name;
    document.getElementById('formIndustry').value = t.industry;
    document.getElementById('formLocation').value = t.location;
    formStars = t.stars;
  } else {
    document.getElementById('modalTitle').textContent = 'Add Testimonial';
    document.getElementById('formQuote').value = '';
    document.getElementById('formName').value = '';
    document.getElementById('formIndustry').value = 'Plumbing';
    document.getElementById('formLocation').value = '';
    formStars = 5;
  }

  setStars(formStars);
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('formQuote').focus(), 200);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function setStars(n) {
  formStars = n;
  document.querySelectorAll('.star-pick').forEach(s => {
    const v = parseInt(s.getAttribute('data-val'));
    s.classList.toggle('lit', v <= n);
  });
}

function saveTestimonial() {
  const quote = document.getElementById('formQuote').value.trim();
  const name = document.getElementById('formName').value.trim();
  const industry = document.getElementById('formIndustry').value;
  const location = document.getElementById('formLocation').value.trim();

  if (!quote) { alert('Please enter a quote.'); document.getElementById('formQuote').focus(); return; }
  if (!name) { alert('Please enter a client name.'); document.getElementById('formName').focus(); return; }
  if (!location) { alert('Please enter a location.'); document.getElementById('formLocation').focus(); return; }

  if (editingId) {
    const t = testimonials.find(x => x.id === editingId);
    t.quote = quote; t.name = name; t.industry = industry;
    t.location = location; t.stars = formStars;
    showToast('Testimonial updated');
  } else {
    testimonials.push({ id: nextId(), stars: formStars, quote, name, industry, location, published: false });
    showToast('Testimonial added');
  }

  save();
  closeModal();
  renderGrid();
}

// ─── UTIL ─────────────────────────────────────────────────────────────────────
function escapeHTML(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// Close modal on backdrop click
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Keyboard close
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
load();
renderGrid();
</script>
