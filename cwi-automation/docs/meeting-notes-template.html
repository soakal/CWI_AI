<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Notes — CWI</title>
<meta name="description" content="Internal meeting notes tool for capturing agendas, discussion points, decisions, action items, and generating follow-up email drafts.">
<link rel="icon" type="image/png" href="../assets/cwi-favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0A0C;--ink-2:#0E0E11;--surface:#141418;--surface-2:#191920;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.14);--accent:#FF5A1F;--ember:#FF8A3D;--steel:#85858E;--text:#F4F4F6;--text-dim:#C2C2C8;--font-disp:'Sora',sans-serif;--font-body:'Instrument Sans',sans-serif;--r-sm:12px;--r-md:18px;--r-pill:999px;--ease:cubic-bezier(.22,.61,.36,1);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--ink);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh;padding:0 0 64px;}
h1,h2,h3,h4,h5,h6{font-family:var(--font-disp);letter-spacing:-.03em;line-height:1.15;font-weight:800;color:var(--text);}
a{color:var(--accent);text-decoration:none;}
p{color:var(--text-dim);line-height:1.65;}
ul,ol{color:var(--text-dim);padding-left:1.4em;}
li{margin-bottom:6px;}
/* Layout */
.wrap{max-width:960px;margin:0 auto;padding:0 24px;}
.container{max-width:900px;margin:0 auto;padding:0 24px;}
/* Topbar */
.topbar{border-bottom:1px solid var(--line);background:rgba(10,10,12,.9);backdrop-filter:blur(14px);position:sticky;top:0;z-index:100;padding:14px 0;}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:960px;margin:0 auto;padding:0 24px;}
.logo{font-family:var(--font-disp);font-weight:800;font-size:17px;letter-spacing:-.04em;display:flex;align-items:center;gap:8px;color:var(--text);}
.logo .dot{color:var(--accent);}
.back-link{font-size:13px;color:var(--steel);display:flex;align-items:center;gap:5px;transition:color .2s;}
.back-link:hover{color:var(--text);}
/* Hero */
.page-header,.hero{padding:52px 0 32px;text-align:center;}
.page-header .logo-block,.hero .logo-block{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-disp);font-size:20px;font-weight:800;margin-bottom:10px;color:var(--accent);}
.kicker,.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--steel);margin-bottom:16px;}
.pip{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.hero h1,.page-title{font-size:clamp(26px,3.5vw,44px);margin-bottom:12px;}
.hero p,.page-subtitle{font-size:clamp(14px,1.5vw,16px);color:var(--text-dim);max-width:52ch;margin:0 auto;}
/* Cards & panels */
.card,.panel,.form-card,.section-card,.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;margin-bottom:24px;}
.card:hover,.panel:hover{border-color:var(--line-2);}
/* Form elements */
label,.form-label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);display:block;margin-bottom:6px;}
input,select,textarea,.form-control{width:100%;background:var(--ink-2);border:1.5px solid var(--line-2);border-radius:var(--r-sm);padding:10px 14px;font-size:14px;font-family:var(--font-body);color:var(--text);outline:none;transition:border-color .2s;box-sizing:border-box;}
input:focus,select:focus,textarea:focus,.form-control:focus{border-color:var(--accent);background:var(--surface);}
textarea{resize:vertical;min-height:96px;}
select option{background:var(--surface);color:var(--text);}
/* Form layout */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.form-group,.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.form-group.full,.field.full{grid-column:1/-1;}
/* Buttons */
.btn,.btn-primary,.btn-generate,.btn-action{font-family:var(--font-body);font-size:14px;font-weight:600;padding:11px 24px;border-radius:var(--r-pill);border:1.5px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:all .22s var(--ease);display:inline-flex;align-items:center;gap:8px;text-decoration:none;}
.btn:hover,.btn-primary:hover,.btn-generate:hover,.btn-action:hover{background:var(--ember);border-color:var(--ember);box-shadow:0 0 22px rgba(255,90,31,.35);}
.btn-outline,.btn-ghost,.btn-secondary{background:rgba(255,90,31,.1);border-color:var(--accent);color:var(--text);}
.btn-outline:hover,.btn-ghost:hover,.btn-secondary:hover{background:var(--accent);color:#fff;}
.btn-sm{padding:8px 16px;font-size:13px;}
/* Tables */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:32px;}
table{width:100%;border-collapse:collapse;}
thead{background:var(--surface-2);}
th{font-family:var(--font-disp);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);}
td{font-size:14px;color:var(--text-dim);padding:11px 16px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
/* Badges / tags */
.badge,.tag{display:inline-block;padding:3px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:600;background:rgba(255,90,31,.12);color:var(--accent);border:1px solid rgba(255,90,31,.25);}
.badge.green,.tag.green{background:rgba(74,222,128,.12);color:#4ade80;border-color:rgba(74,222,128,.25);}
.badge.red,.tag.red{background:rgba(248,113,113,.12);color:#f87171;border-color:rgba(248,113,113,.25);}
/* Sections */
.section{padding:40px 0 0;}
.section-title{font-family:var(--font-disp);font-size:20px;font-weight:700;margin-bottom:18px;color:var(--text);}
.section-title span,.acc{color:var(--accent);}
/* Output/preview areas */
.output-area,.preview,.result-card,.output-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;margin-top:24px;}
/* Dividers */
hr,.rule,.divider{border:none;border-top:1px solid var(--line);margin:32px 0;}
/* Checklist items */
.check-item{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
.check-item:last-child{border-bottom:none;}
.check-item input[type="checkbox"]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;}
/* Lists */
.list-item{padding:12px 0;border-bottom:1px solid var(--line);color:var(--text-dim);}
.list-item:last-child{border-bottom:none;}
/* Stats / KPI */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:28px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px 22px;}
.stat-label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin-bottom:8px;}
.stat-value{font-family:var(--font-disp);font-size:30px;font-weight:800;color:var(--text);}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:11px 22px;font-size:14px;color:var(--text);transition:transform .3s var(--ease),opacity .3s;opacity:0;z-index:999;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
/* Footer */
.footer{border-top:1px solid var(--line);padding:24px 0;text-align:center;font-size:13px;color:var(--steel);margin-top:64px;}
.footer a{color:var(--accent);}
/* Responsive */
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}.card,.panel,.form-card{padding:20px 16px;}.stat-grid{grid-template-columns:1fr 1fr;}}

/* ── Tool-specific: card header ── */
.card{padding:0;overflow:hidden;}
.card-header{background:var(--surface-2);border-bottom:1px solid var(--line);border-left:3px solid var(--accent);padding:12px 20px;display:flex;align-items:center;gap:10px;}
.card-header h2{font-size:0.97rem;font-weight:700;color:var(--text-dim);letter-spacing:normal;}
.card-body{padding:20px;}
.section-num{background:var(--accent);color:#fff;font-size:0.75rem;font-weight:700;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ── Meta grid ── */
.meta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:0;}
.field label{font-size:0.78rem;font-weight:600;color:var(--steel);text-transform:uppercase;letter-spacing:0.05em;}

/* ── Action items table ── */
.ai-table{width:100%;border-collapse:collapse;}
.ai-table th{text-align:left;font-size:0.75rem;font-weight:700;color:var(--steel);text-transform:uppercase;letter-spacing:0.05em;padding:8px 10px;border-bottom:2px solid var(--line);background:var(--surface-2);}
.ai-table td{padding:7px 8px;vertical-align:middle;border-bottom:1px solid var(--line);}
.ai-table tbody tr:last-child td{border-bottom:none;}
.ai-table tbody tr:nth-child(even) td{background:rgba(255,255,255,.02);}
.ai-table input,.ai-table select{padding:5px 8px;font-size:0.85rem;}

/* Status select colours */
.status-open{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.35);color:#fbbf24;}
.status-done{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.35);color:#34d399;}
.status-inprogress{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.35);color:#60a5fa;}

.ai-actions{margin-top:12px;display:flex;gap:8px;}

/* ── Email output ── */
#email-output{min-height:180px;background:var(--ink-2);border:1.5px solid var(--line-2);border-radius:var(--r-sm);padding:14px;font-size:0.88rem;line-height:1.7;white-space:pre-wrap;color:var(--text-dim);}
.email-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}

/* ── Next meeting grid ── */
.next-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;}

/* ── Header actions area ── */
#header-actions{display:flex;align-items:center;gap:12px;}

/* ── Save indicator ── */
.save-indicator{width:10px;height:10px;border-radius:50%;background:#fbbf24;transition:background 0.4s;flex-shrink:0;}
.save-indicator.saved{background:#34d399;}

/* ── Recent select in topbar ── */
#recent-select{font-size:0.82rem;padding:5px 10px;border-radius:var(--r-sm);border:1.5px solid var(--line-2);background:var(--surface-2);color:var(--text-dim);cursor:pointer;max-width:200px;}
#recent-select option{background:var(--surface);color:var(--text);}

/* ── Btn variants used in this file ── */
.btn-white{background:rgba(255,90,31,.15);border-color:var(--accent);color:var(--text);}
.btn-white:hover{background:var(--accent);color:#fff;}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-accent:hover{background:var(--ember);border-color:var(--ember);box-shadow:0 0 22px rgba(255,90,31,.35);}
.btn-danger{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.3);color:#f87171;}
.btn-danger:hover{background:rgba(248,113,113,.22);border-color:#f87171;}

/* ── Main layout ── */
#main{max-width:900px;margin:32px auto;padding:0 16px 64px;display:flex;flex-direction:column;gap:20px;}

/* ── Print ── */
@media print{
  .topbar,.btn,.ai-actions,.email-actions,#recent-select,.save-indicator,#delete-btn,#print-btn{display:none !important;}
  body{background:#fff;color:#000;}
  #main{margin:0;padding:0;max-width:100%;}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;}
  #email-output{border:1px solid #ccc;}
}

/* ── Responsive ── */
@media(max-width:600px){
  #main{margin:16px auto;}
  .meta-grid{grid-template-columns:1fr;}
  .ai-table{font-size:0.8rem;}
  .ai-table th:nth-child(3),.ai-table td:nth-child(3){display:none;}
}
</style>
</head>
<body>

<div class="bg-field" style="position:fixed;inset:0;z-index:-1;pointer-events:none;"><div style="position:absolute;inset:0;background:radial-gradient(720px 460px at 82% -6%,rgba(255,90,31,.09),transparent 60%),radial-gradient(620px 520px at 6% 8%,rgba(255,90,31,.04),transparent 60%);"></div></div>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="4" y="10" width="4" height="12" rx="2" fill="#FF5A1F"/><rect x="10" y="6" width="4" height="20" rx="2" fill="#FF5A1F" opacity=".85"/><rect x="16" y="2" width="4" height="28" rx="2" fill="#FF5A1F" opacity=".7"/><rect x="22" y="6" width="4" height="20" rx="2" fill="#FF5A1F" opacity=".55"/></svg>
      CWI <span class="dot">·</span> Meeting Notes
    </div>
    <div id="header-actions">
      <span class="save-indicator" id="save-dot" title="Unsaved changes"></span>
      <select id="recent-select" title="Load a recent meeting">
        <option value="">— Recent Meetings —</option>
      </select>
      <button class="btn btn-ghost btn-sm" id="delete-btn" title="Delete loaded meeting" style="display:none">Delete</button>
      <button class="btn btn-white btn-sm" id="print-btn" onclick="window.print()">Print</button>
    </div>
    <a class="back-link" href="../index.html">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2L3 7l5 5"/><line x1="3" y1="7" x2="12" y2="7"/></svg>
      Back
    </a>
  </div>
</header>

<!-- ════════════════════════════ MAIN ════════════════════════════ -->
<main id="main">

  <!-- Meta -->
  <div class="card">
    <div class="card-header">
      <h2>Meeting Details</h2>
    </div>
    <div class="card-body">
      <div class="meta-grid">
        <div class="field">
          <label for="meeting-type">Meeting Type</label>
          <select id="meeting-type">
            <option value="">— Select type —</option>
            <option value="discovery">Discovery Call</option>
            <option value="onboarding">Onboarding</option>
            <option value="monthly">Monthly Review</option>
            <option value="checkin">Check-in</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="client-name">Client Name</label>
          <input id="client-name" type="text" placeholder="Company / Contact">
        </div>
        <div class="field">
          <label for="meeting-datetime">Date &amp; Time</label>
          <input id="meeting-datetime" type="datetime-local">
        </div>
        <div class="field" style="grid-column: span 1;">
          <label for="attendees">Attendees</label>
          <input id="attendees" type="text" placeholder="Brian, Jane Smith, …">
        </div>
      </div>
    </div>
  </div>

  <!-- Section 1: Agenda -->
  <div class="card">
    <div class="card-header">
      <span class="section-num">1</span>
      <h2>Agenda</h2>
    </div>
    <div class="card-body">
      <textarea id="agenda" placeholder="Select a meeting type above to pre-fill the agenda, or type here…"></textarea>
    </div>
  </div>

  <!-- Section 2: Key Discussion Points -->
  <div class="card">
    <div class="card-header">
      <span class="section-num">2</span>
      <h2>Key Discussion Points</h2>
    </div>
    <div class="card-body">
      <textarea id="discussion" placeholder="• Topic or point discussed&#10;• Another key point&#10;• Client concern or question raised"></textarea>
    </div>
  </div>

  <!-- Section 3: Decisions Made -->
  <div class="card">
    <div class="card-header">
      <span class="section-num">3</span>
      <h2>Decisions Made</h2>
    </div>
    <div class="card-body">
      <textarea id="decisions" placeholder="• Agreement or commitment reached&#10;• Scope confirmed&#10;• Pricing / timeline agreed"></textarea>
    </div>
  </div>

  <!-- Section 4: Action Items -->
  <div class="card">
    <div class="card-header">
      <span class="section-num">4</span>
      <h2>Action Items</h2>
    </div>
    <div class="card-body">
      <table class="ai-table" id="ai-table">
        <thead>
          <tr>
            <th style="width:44%">Action Item</th>
            <th style="width:17%">Owner</th>
            <th style="width:18%">Due Date</th>
            <th style="width:15%">Status</th>
            <th style="width:6%"></th>
          </tr>
        </thead>
        <tbody id="ai-body">
          <!-- rows inserted by JS -->
        </tbody>
      </table>
      <div class="ai-actions">
        <button class="btn btn-accent btn-sm" id="add-row-btn">+ Add Row</button>
      </div>
    </div>
  </div>

  <!-- Section 5: Follow-up Email -->
  <div class="card">
    <div class="card-header">
      <span class="section-num">5</span>
      <h2>Follow-up Email Draft</h2>
    </div>
    <div class="card-body">
      <div id="email-output">Click "Generate Email" to assemble a follow-up draft from the fields above.</div>
      <div class="email-actions">
        <button class="btn btn-accent" id="gen-email-btn">Generate Email</button>
        <button class="btn btn-ghost btn-sm" id="copy-email-btn" disabled>Copy Email</button>
      </div>
    </div>
  </div>

  <!-- Section 6: Next Meeting -->
  <div class="card">
    <div class="card-header">
      <span class="section-num">6</span>
      <h2>Next Meeting</h2>
    </div>
    <div class="card-body">
      <div class="next-grid">
        <div class="field">
          <label for="next-datetime">Date &amp; Time</label>
          <input id="next-datetime" type="datetime-local">
        </div>
        <div class="field">
          <label for="next-type">Meeting Type</label>
          <select id="next-type">
            <option value="">— Select —</option>
            <option value="discovery">Discovery Call</option>
            <option value="onboarding">Onboarding</option>
            <option value="monthly">Monthly Review</option>
            <option value="checkin">Check-in</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field" style="grid-column: 1 / -1;">
          <label for="prep-notes">Prep Notes</label>
          <textarea id="prep-notes" style="min-height:80px" placeholder="Items to prepare before the next meeting…"></textarea>
        </div>
      </div>
    </div>
  </div>

</main>

<script>
// ════════════════════════════════════════════════
// AGENDA TEMPLATES
// ════════════════════════════════════════════════
const AGENDAS = {
  discovery: `1. Introductions and background
2. Current challenges and pain points
3. Existing tools, workflows, and tech stack
4. Goals and desired outcomes
5. Timeline and urgency
6. Budget and pricing discussion
7. Next steps and expectations`,

  onboarding: `1. Welcome and introductions
2. Project overview and goals recap
3. Access provisioning and tool setup
4. Timeline, milestones, and deliverables
5. Communication cadence and points of contact
6. Roles and responsibilities
7. Open questions and next steps`,

  monthly: `1. Review of prior month's metrics and KPIs
2. Progress on open action items
3. Wins and highlights
4. Challenges and blockers
5. Roadmap updates and upcoming priorities
6. Budget / resource check-in
7. Action items and next meeting`,

  checkin: `1. Status update on active projects
2. Blockers or issues to address
3. Quick wins since last meeting
4. Upcoming deadlines
5. Any questions or support needed`,

  other: `1. Welcome / introductions
2. Agenda review
3. Main discussion topics
4. Decisions and action items
5. Next steps`
};

// ════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════
function now8601() {
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('en-US', { weekday:'short', month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
}

function fmtDateOnly(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

// ════════════════════════════════════════════════
// ACTION ITEMS
// ════════════════════════════════════════════════
let rowCount = 0;

function createRow(data = {}) {
  rowCount++;
  const id = rowCount;
  const tr = document.createElement('tr');
  tr.dataset.rowId = id;

  const statusClass = {
    'Open': 'status-open',
    'In Progress': 'status-inprogress',
    'Done': 'status-done'
  };

  const statusVal = data.status || 'Open';
  const statusCls = statusClass[statusVal] || 'status-open';

  tr.innerHTML = `
    <td><input type="text" class="ai-item" placeholder="Describe the action…" value="${escHtml(data.item||'')}"></td>
    <td>
      <select class="ai-owner">
        <option value="Brian" ${data.owner==='Brian'?'selected':''}>Brian</option>
        <option value="Client" ${data.owner==='Client'?'selected':''}>Client</option>
        <option value="Both" ${data.owner==='Both'?'selected':''}>Both</option>
      </select>
    </td>
    <td><input type="date" class="ai-due" value="${data.due||''}"></td>
    <td>
      <select class="ai-status ${statusCls}">
        <option value="Open" ${statusVal==='Open'?'selected':''}>Open</option>
        <option value="In Progress" ${statusVal==='In Progress'?'selected':''}>In Progress</option>
        <option value="Done" ${statusVal==='Done'?'selected':''}>Done</option>
      </select>
    </td>
    <td><button class="btn btn-danger btn-sm remove-row-btn" title="Remove row">✕</button></td>
  `;

  const statusSel = tr.querySelector('.ai-status');
  statusSel.addEventListener('change', function() {
    this.className = 'ai-status ' + (statusClass[this.value] || '');
    scheduleSave();
  });

  tr.querySelector('.ai-item').addEventListener('input', scheduleSave);
  tr.querySelector('.ai-owner').addEventListener('change', scheduleSave);
  tr.querySelector('.ai-due').addEventListener('change', scheduleSave);
  tr.querySelector('.remove-row-btn').addEventListener('click', function() {
    tr.remove();
    scheduleSave();
  });

  return tr;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getActionItems() {
  const rows = [];
  document.querySelectorAll('#ai-body tr').forEach(tr => {
    rows.push({
      item: tr.querySelector('.ai-item').value,
      owner: tr.querySelector('.ai-owner').value,
      due: tr.querySelector('.ai-due').value,
      status: tr.querySelector('.ai-status').value
    });
  });
  return rows;
}

function renderActionItems(items) {
  const tbody = document.getElementById('ai-body');
  tbody.innerHTML = '';
  if (!items || items.length === 0) {
    tbody.appendChild(createRow());
  } else {
    items.forEach(item => tbody.appendChild(createRow(item)));
  }
}

// ════════════════════════════════════════════════
// EMAIL GENERATION
// ════════════════════════════════════════════════
function generateEmail() {
  const client   = document.getElementById('client-name').value.trim() || 'there';
  const attendees = document.getElementById('attendees').value.split(',').map(s=>s.trim()).filter(Boolean);
  const greeting  = attendees.find(a => a.toLowerCase() !== 'brian') || client;
  const dateStr   = fmtDate(document.getElementById('meeting-datetime').value);
  const discussion = document.getElementById('discussion').value.trim();
  const decisions  = document.getElementById('decisions').value.trim();
  const nextDt     = document.getElementById('next-datetime').value;
  const actionItems = getActionItems().filter(r => r.item.trim());

  let email = `Hi ${greeting},\n\nThank you for taking the time to connect${dateStr ? ' on ' + dateStr : ''}.`;

  if (discussion) {
    const topics = discussion.split('\n').map(l=>l.replace(/^[•\-*]\s*/,'')).filter(Boolean);
    if (topics.length === 1) {
      email += ` We discussed ${topics[0].toLowerCase()}.`;
    } else if (topics.length > 1) {
      const last = topics[topics.length - 1];
      const rest = topics.slice(0, -1).map(t => t.toLowerCase());
      email += ` During our conversation we covered: ${rest.join(', ')}, and ${last.toLowerCase()}.`;
    }
  }

  if (decisions) {
    const dec = decisions.split('\n').map(l=>l.replace(/^[•\-*]\s*/,'')).filter(Boolean);
    if (dec.length) {
      email += `\n\nKey decisions and agreements from the call:\n`;
      dec.forEach(d => { email += `  • ${d}\n`; });
    }
  }

  const openItems = actionItems.filter(r => r.status !== 'Done');
  if (openItems.length) {
    email += `\nAs a reminder, here are the open action items:\n`;
    openItems.forEach(r => {
      const due = r.due ? ` (due ${fmtDateOnly(r.due)})` : '';
      email += `  • ${r.item} — ${r.owner}${due}\n`;
    });
  }

  if (nextDt) {
    email += `\nOur next meeting is scheduled for ${fmtDate(nextDt)}. I look forward to connecting then.`;
  }

  email += `\n\nPlease don't hesitate to reach out if you have any questions in the meantime.\n\nBest regards,\nBrian\nCWI`;

  const out = document.getElementById('email-output');
  out.textContent = email;
  document.getElementById('copy-email-btn').disabled = false;
  document.getElementById('gen-email-btn').textContent = 'Regenerate';
}

// ════════════════════════════════════════════════
// SAVE / LOAD  (localStorage)
// ════════════════════════════════════════════════
const LS_PREFIX = 'cwi_meeting_';
let saveTimer = null;
let currentKey = null;

function getFormData() {
  return {
    meetingType: document.getElementById('meeting-type').value,
    clientName:  document.getElementById('client-name').value,
    datetime:    document.getElementById('meeting-datetime').value,
    attendees:   document.getElementById('attendees').value,
    agenda:      document.getElementById('agenda').value,
    discussion:  document.getElementById('discussion').value,
    decisions:   document.getElementById('decisions').value,
    actionItems: getActionItems(),
    nextDatetime: document.getElementById('next-datetime').value,
    nextType:    document.getElementById('next-type').value,
    prepNotes:   document.getElementById('prep-notes').value,
    savedAt:     new Date().toISOString()
  };
}

function makeKey(data) {
  const client = (data.clientName || 'unknown').replace(/[^a-z0-9]/gi,'_').slice(0,30);
  const dt     = (data.datetime || new Date().toISOString()).slice(0,16).replace(/[T:]/g,'-');
  return LS_PREFIX + client + '__' + dt;
}

function saveMeeting() {
  const data = getFormData();
  if (!currentKey) currentKey = makeKey(data);
  try {
    localStorage.setItem(currentKey, JSON.stringify(data));
    // Keep index
    let idx = getIndex();
    if (!idx.includes(currentKey)) {
      idx.unshift(currentKey);
      if (idx.length > 50) idx = idx.slice(0, 50);
      localStorage.setItem(LS_PREFIX + 'index', JSON.stringify(idx));
    }
    setSaved(true);
    populateRecentSelect();
  } catch(e) { console.warn('Save failed', e); }
}

function setSaved(saved) {
  document.getElementById('save-dot').classList.toggle('saved', saved);
}

function scheduleSave() {
  setSaved(false);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveMeeting, 3000);
}

function getIndex() {
  try { return JSON.parse(localStorage.getItem(LS_PREFIX + 'index') || '[]'); }
  catch(e) { return []; }
}

function populateRecentSelect() {
  const sel = document.getElementById('recent-select');
  const idx = getIndex();
  sel.innerHTML = '<option value="">— Recent Meetings —</option>';
  idx.forEach(key => {
    try {
      const d = JSON.parse(localStorage.getItem(key) || '{}');
      const label = `${d.clientName || '?'} · ${(d.datetime||'').slice(0,10)||'no date'}`;
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = label;
      if (key === currentKey) opt.selected = true;
      sel.appendChild(opt);
    } catch(e) {}
  });
}

function loadMeeting(key) {
  if (!key) return;
  try {
    const data = JSON.parse(localStorage.getItem(key) || '{}');
    document.getElementById('meeting-type').value    = data.meetingType || '';
    document.getElementById('client-name').value     = data.clientName  || '';
    document.getElementById('meeting-datetime').value = data.datetime   || '';
    document.getElementById('attendees').value        = data.attendees  || '';
    document.getElementById('agenda').value           = data.agenda     || '';
    document.getElementById('discussion').value       = data.discussion || '';
    document.getElementById('decisions').value        = data.decisions  || '';
    renderActionItems(data.actionItems);
    document.getElementById('next-datetime').value   = data.nextDatetime || '';
    document.getElementById('next-type').value        = data.nextType   || '';
    document.getElementById('prep-notes').value       = data.prepNotes  || '';
    currentKey = key;
    setSaved(true);
    document.getElementById('delete-btn').style.display = '';
    document.getElementById('email-output').textContent = 'Click "Generate Email" to assemble a follow-up draft from the fields above.';
    document.getElementById('copy-email-btn').disabled = true;
    document.getElementById('gen-email-btn').textContent = 'Generate Email';
  } catch(e) { console.warn('Load failed', e); }
}

function deleteMeeting(key) {
  if (!key) return;
  if (!confirm('Delete this saved meeting? This cannot be undone.')) return;
  localStorage.removeItem(key);
  let idx = getIndex().filter(k => k !== key);
  localStorage.setItem(LS_PREFIX + 'index', JSON.stringify(idx));
  currentKey = null;
  document.getElementById('delete-btn').style.display = 'none';
  populateRecentSelect();
  setSaved(false);
}

// ════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', function () {

  // Default datetime to now
  document.getElementById('meeting-datetime').value = now8601();

  // Initial empty action item row
  renderActionItems([]);

  // Meeting type → pre-fill agenda
  document.getElementById('meeting-type').addEventListener('change', function() {
    const template = AGENDAS[this.value];
    if (template) {
      const current = document.getElementById('agenda').value.trim();
      if (!current || Object.values(AGENDAS).includes(current)) {
        document.getElementById('agenda').value = template;
      }
    }
    scheduleSave();
  });

  // Add row
  document.getElementById('add-row-btn').addEventListener('click', function() {
    document.getElementById('ai-body').appendChild(createRow());
    scheduleSave();
  });

  // Generate email
  document.getElementById('gen-email-btn').addEventListener('click', generateEmail);

  // Copy email
  document.getElementById('copy-email-btn').addEventListener('click', function() {
    const text = document.getElementById('email-output').textContent;
    navigator.clipboard.writeText(text).then(() => {
      this.textContent = 'Copied!';
      setTimeout(() => { this.textContent = 'Copy Email'; }, 2000);
    }).catch(() => {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      this.textContent = 'Copied!';
      setTimeout(() => { this.textContent = 'Copy Email'; }, 2000);
    });
  });

  // Recent select
  document.getElementById('recent-select').addEventListener('change', function() {
    if (this.value) loadMeeting(this.value);
  });

  // Delete button
  document.getElementById('delete-btn').addEventListener('click', function() {
    deleteMeeting(currentKey);
  });

  // Auto-save on all text inputs/textareas/selects (except recent-select)
  const watchIds = ['client-name','meeting-datetime','attendees','agenda','discussion','decisions','next-datetime','next-type','prep-notes'];
  watchIds.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', scheduleSave);
    if (el) el.addEventListener('change', scheduleSave);
  });

  // Populate recent meetings
  populateRecentSelect();
});
</script>
