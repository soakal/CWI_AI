<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competitor Research Tracker — CWI</title>
<meta name="description" content="Track and compare CWI AI competitors side-by-side with feature matrices, pricing notes, and competitive advantage summaries.">
<link rel="icon" type="image/png" href="../assets/cwi-favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0A0C;--ink-2:#0E0E11;--surface:#141418;--surface-2:#191920;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.14);--accent:#FF5A1F;--ember:#FF8A3D;--steel:#85858E;--text:#F4F4F6;--text-dim:#C2C2C8;--font-disp:'Sora',sans-serif;--font-body:'Instrument Sans',sans-serif;--r-sm:12px;--r-md:18px;--r-pill:999px;--ease:cubic-bezier(.22,.61,.36,1);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--ink);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh;padding:0 0 64px;}
h1,h2,h3,h4,h5,h6{font-family:var(--font-disp);letter-spacing:-.03em;line-height:1.15;font-weight:800;color:var(--text);}
a{color:var(--accent);text-decoration:none;}
p{color:var(--text-dim);line-height:1.65;}
ul,ol{color:var(--text-dim);padding-left:1.4em;}
li{margin-bottom:6px;}
/* Layout */
.wrap{max-width:960px;margin:0 auto;padding:0 24px;}
.container{max-width:900px;margin:0 auto;padding:0 24px;}
/* Topbar */
.topbar{border-bottom:1px solid var(--line);background:rgba(10,10,12,.9);backdrop-filter:blur(14px);position:sticky;top:0;z-index:100;padding:14px 0;}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:960px;margin:0 auto;padding:0 24px;}
.logo{font-family:var(--font-disp);font-weight:800;font-size:17px;letter-spacing:-.04em;display:flex;align-items:center;gap:8px;color:var(--text);}
.logo .dot{color:var(--accent);}
.back-link{font-size:13px;color:var(--steel);display:flex;align-items:center;gap:5px;transition:color .2s;}
.back-link:hover{color:var(--text);}
/* Hero */
.page-header,.hero{padding:52px 0 32px;text-align:center;}
.page-header .logo-block,.hero .logo-block{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-disp);font-size:20px;font-weight:800;margin-bottom:10px;color:var(--accent);}
.kicker,.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--steel);margin-bottom:16px;}
.pip{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.hero h1,.page-title{font-size:clamp(26px,3.5vw,44px);margin-bottom:12px;}
.hero p,.page-subtitle{font-size:clamp(14px,1.5vw,16px);color:var(--text-dim);max-width:52ch;margin:0 auto;}
/* Cards & panels */
.card,.panel,.form-card,.section-card,.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;margin-bottom:24px;}
.card:hover,.panel:hover{border-color:var(--line-2);}
/* Form elements */
label,.form-label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);display:block;margin-bottom:6px;}
input,select,textarea,.form-control{width:100%;background:var(--ink-2);border:1.5px solid var(--line-2);border-radius:var(--r-sm);padding:10px 14px;font-size:14px;font-family:var(--font-body);color:var(--text);outline:none;transition:border-color .2s;box-sizing:border-box;}
input:focus,select:focus,textarea:focus,.form-control:focus{border-color:var(--accent);background:var(--surface);}
textarea{resize:vertical;min-height:96px;}
select option{background:var(--surface);color:var(--text);}
/* Form layout */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.form-group,.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.form-group.full,.field.full{grid-column:1/-1;}
/* Buttons */
.btn,.btn-primary,.btn-generate,.btn-action{font-family:var(--font-body);font-size:14px;font-weight:600;padding:11px 24px;border-radius:var(--r-pill);border:1.5px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:all .22s var(--ease);display:inline-flex;align-items:center;gap:8px;text-decoration:none;}
.btn:hover,.btn-primary:hover,.btn-generate:hover,.btn-action:hover{background:var(--ember);border-color:var(--ember);box-shadow:0 0 22px rgba(255,90,31,.35);}
.btn-outline,.btn-ghost,.btn-secondary{background:rgba(255,90,31,.1);border-color:var(--accent);color:var(--text);}
.btn-outline:hover,.btn-ghost:hover,.btn-secondary:hover{background:var(--accent);color:#fff;}
.btn-sm{padding:8px 16px;font-size:13px;}
/* Tables */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:32px;}
table{width:100%;border-collapse:collapse;}
thead{background:var(--surface-2);}
th{font-family:var(--font-disp);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);}
td{font-size:14px;color:var(--text-dim);padding:11px 16px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
/* Badges / tags */
.badge,.tag{display:inline-block;padding:3px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:600;background:rgba(255,90,31,.12);color:var(--accent);border:1px solid rgba(255,90,31,.25);}
.badge.green,.tag.green{background:rgba(74,222,128,.12);color:#4ade80;border-color:rgba(74,222,128,.25);}
.badge.red,.tag.red{background:rgba(248,113,113,.12);color:#f87171;border-color:rgba(248,113,113,.25);}
/* Sections */
.section{padding:40px 0 0;}
.section-title{font-family:var(--font-disp);font-size:20px;font-weight:700;margin-bottom:18px;color:var(--text);}
.section-title span,.acc{color:var(--accent);}
/* Output/preview areas */
.output-area,.preview,.result-card,.output-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;margin-top:24px;}
/* Dividers */
hr,.rule,.divider{border:none;border-top:1px solid var(--line);margin:32px 0;}
/* Checklist items */
.check-item{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
.check-item:last-child{border-bottom:none;}
.check-item input[type="checkbox"]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;}
/* Lists */
.list-item{padding:12px 0;border-bottom:1px solid var(--line);color:var(--text-dim);}
.list-item:last-child{border-bottom:none;}
/* Stats / KPI */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:28px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px 22px;}
.stat-label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin-bottom:8px;}
.stat-value{font-family:var(--font-disp);font-size:30px;font-weight:800;color:var(--text);}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:11px 22px;font-size:14px;color:var(--text);transition:transform .3s var(--ease),opacity .3s;opacity:0;z-index:999;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
/* Footer */
.footer{border-top:1px solid var(--line);padding:24px 0;text-align:center;font-size:13px;color:var(--steel);margin-top:64px;}
.footer a{color:var(--accent);}
/* Responsive */
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}.card,.panel,.form-card{padding:20px 16px;}.stat-grid{grid-template-columns:1fr 1fr;}}

/* ── Tool-specific styles ── */

/* Main layout */
.main{max-width:1400px;margin:0 auto;padding:28px 24px 0;}

/* Win Banner */
.win-banner{background:linear-gradient(135deg,var(--accent) 0%,#ff7849 100%);border-radius:var(--r-md);padding:28px 32px;color:#fff;margin-bottom:28px;position:relative;overflow:hidden;}
.win-banner::before{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:rgba(255,255,255,.07);border-radius:50%;}
.win-banner::after{content:'';position:absolute;right:60px;bottom:-60px;width:140px;height:140px;background:rgba(255,255,255,.05);border-radius:50%;}
.win-banner-inner{position:relative;z-index:1;}
.win-banner h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;opacity:.85;margin-bottom:10px;color:#fff;}
.win-banner p{font-size:19px;font-weight:600;line-height:1.45;max-width:780px;color:#fff;}
.win-banner p strong{font-weight:800;}
.win-banner-edit{position:absolute;top:18px;right:18px;z-index:2;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;}
.win-banner-edit:hover{background:rgba(255,255,255,.3);}
.win-banner-textarea{width:100%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);border-radius:8px;color:#fff;font-size:17px;font-weight:600;padding:12px 14px;resize:vertical;min-height:80px;font-family:inherit;outline:none;margin-top:8px;}
.win-banner-textarea::placeholder{color:rgba(255,255,255,.6);}

/* Toolbar */
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px;flex-wrap:wrap;}
.toolbar-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.toolbar-right{display:flex;align-items:center;gap:10px;}
.view-toggle{display:flex;background:var(--surface);border:1.5px solid var(--line-2);border-radius:8px;overflow:hidden;}
.view-btn{padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--steel);transition:all .15s;display:flex;align-items:center;gap:5px;}
.view-btn.active{background:var(--accent);color:#fff;}
.view-btn:not(.active):hover{background:rgba(255,90,31,.12);color:var(--accent);}
.comp-count{background:rgba(255,90,31,.12);color:var(--accent);font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;}

/* Card View */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px;}
.comp-card{background:var(--surface);border-radius:var(--r-md);border:1.5px solid var(--line);overflow:hidden;transition:box-shadow .2s,transform .2s;}
.comp-card:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.4);}
.card-header{background:var(--surface-2);padding:18px 20px;display:flex;align-items:center;justify-content:space-between;}
.card-title-wrap{display:flex;align-items:center;gap:12px;}
.comp-avatar{width:42px;height:42px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0;}
.comp-name-input{background:transparent;border:none;color:var(--text);font-size:18px;font-weight:700;width:100%;outline:none;font-family:var(--font-disp);}
.comp-name-input::placeholder{color:var(--steel);}
.card-actions{display:flex;gap:6px;}
.card-delete-btn{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.25);color:#f87171;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:14px;transition:all .15s;}
.card-delete-btn:hover{background:rgba(248,113,113,.3);color:#fff;}
.card-body{padding:20px;}
.field-group{margin-bottom:16px;}
.field-label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--steel);margin-bottom:6px;}
.field-label .label-icon{font-size:13px;}
.field-input{width:100%;border:1.5px solid var(--line-2);border-radius:7px;padding:9px 12px;font-size:14px;font-family:var(--font-body);color:var(--text);background:var(--ink-2);transition:border-color .15s,box-shadow .15s;outline:none;}
.field-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,90,31,.12);background:var(--surface);}
textarea.field-input{resize:vertical;min-height:80px;line-height:1.5;}
textarea.field-input.advantage{min-height:80px;border-color:rgba(255,90,31,.3);background:rgba(255,90,31,.06);}
textarea.field-input.advantage:focus{border-color:var(--accent);}
.card-footer{padding:14px 20px;background:var(--ink-2);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.last-updated{font-size:12px;color:var(--steel);display:flex;align-items:center;gap:5px;}
.last-updated-date{font-weight:600;color:var(--text-dim);}
.auto-save-indicator{font-size:12px;color:#4ade80;display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .3s;}
.auto-save-indicator.show{opacity:1;}

/* Table View */
.table-view{display:none;}
.table-view.active{display:block;}
.cards-view.hidden{display:none;}
.comp-table-wrap{background:var(--surface);border-radius:var(--r-md);border:1.5px solid var(--line);overflow:hidden;}
.comp-table-scroll{overflow-x:auto;}
.comp-table{width:100%;border-collapse:collapse;min-width:900px;}
.comp-table thead{background:var(--surface-2);}
.comp-table thead th{padding:16px 18px;text-align:left;color:var(--text);font-size:13px;font-weight:700;white-space:nowrap;border-right:1px solid var(--line);}
.comp-table thead th:first-child{width:220px;}
.comp-table thead th.cwi-col{background:var(--accent);color:#fff;}
.comp-table thead th .th-inner{display:flex;flex-direction:column;gap:2px;}
.comp-table thead th .th-sub{font-size:11px;font-weight:400;opacity:.7;}
.comp-table tbody tr{border-bottom:1px solid var(--line);transition:background .12s;}
.comp-table tbody tr:hover td{background:rgba(255,255,255,.03);}
.comp-table tbody tr:last-child{border-bottom:none;}
.comp-table tbody td{padding:14px 18px;font-size:14px;color:var(--text-dim);border-right:1px solid var(--line);vertical-align:middle;}
.comp-table tbody td:first-child{font-weight:700;color:var(--text);background:var(--ink-2);}
.comp-table tbody td.cwi-cell{background:rgba(255,90,31,.08);font-weight:700;}
.feature-row td:first-child{font-weight:600;color:var(--text);font-size:13px;display:flex;align-items:center;gap:8px;}
.check{color:#4ade80;font-size:18px;font-weight:700;}
.cross{color:var(--steel);font-size:18px;}
.partial{color:#fbbf24;font-size:16px;}
.table-section-header td{background:rgba(255,90,31,.1);color:var(--accent);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;padding:10px 18px;border-right:none !important;}

/* Modals */
.modal-overlay,.banner-modal-overlay,.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open,.banner-modal-overlay.open,.confirm-overlay.open{display:flex;}
.confirm-overlay{z-index:1100;}
.modal,.banner-modal,.confirm-box{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-md);box-shadow:0 24px 64px rgba(0,0,0,.6);}
.modal{width:100%;max-width:480px;padding:32px;}
.banner-modal{width:100%;max-width:640px;padding:32px;}
.confirm-box{padding:28px 32px;max-width:400px;width:100%;text-align:center;}
.modal h3,.banner-modal h3{font-size:20px;font-weight:700;margin-bottom:20px;color:var(--text);}
.banner-modal p{font-size:13px;color:var(--steel);margin-bottom:20px;}
.modal-field,.banner-modal .field{margin-bottom:16px;}
.modal-field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--steel);text-transform:none;letter-spacing:0;}
.modal-field input,.banner-modal textarea{width:100%;border:1.5px solid var(--line-2);border-radius:7px;padding:10px 14px;font-size:15px;font-family:var(--font-body);background:var(--ink-2);color:var(--text);outline:none;transition:border-color .15s;}
.modal-field input:focus,.banner-modal textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,90,31,.1);}
.banner-modal textarea{min-height:100px;resize:vertical;line-height:1.6;}
.modal-actions,.banner-modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;}
.confirm-box .confirm-icon{font-size:40px;margin-bottom:12px;}
.confirm-box h4{font-size:18px;font-weight:700;margin-bottom:8px;color:var(--text);}
.confirm-box p{font-size:14px;color:var(--steel);margin-bottom:24px;line-height:1.5;}
.confirm-actions{display:flex;gap:10px;justify-content:center;}

/* Danger button */
.btn-danger{background:rgba(248,113,113,.15);border-color:#f87171;color:#f87171;}
.btn-danger:hover{background:#f87171;color:#fff;border-color:#f87171;}

/* Empty state */
.empty-state{text-align:center;padding:60px 20px;color:var(--steel);}
.empty-state .empty-icon{font-size:48px;margin-bottom:16px;opacity:.5;}
.empty-state h3{font-size:18px;font-weight:600;margin-bottom:8px;color:var(--text-dim);}
.empty-state p{font-size:14px;color:var(--steel);}

/* Toast overrides for dark theme */
.toast.success{background:var(--surface-2);border-left:4px solid #4ade80;}
.toast.error{background:var(--surface-2);border-left:4px solid #f87171;}
.toast.info{background:var(--surface-2);border-left:4px solid var(--accent);}

/* Responsive */
@media(max-width:768px){
  .main{padding:16px 12px 0;}
  .cards-grid{grid-template-columns:1fr;}
  .win-banner{padding:20px 18px;}
  .win-banner p{font-size:16px;}
  .topbar-inner .header-actions .btn span{display:none;}
}
</style>
</head>
<body>

<div class="bg-field" style="position:fixed;inset:0;z-index:-1;pointer-events:none;"><div style="position:absolute;inset:0;background:radial-gradient(720px 460px at 82% -6%,rgba(255,90,31,.09),transparent 60%),radial-gradient(620px 520px at 6% 8%,rgba(255,90,31,.04),transparent 60%);"></div></div>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="4" y="10" width="4" height="12" rx="2" fill="#FF5A1F"/><rect x="10" y="6" width="4" height="20" rx="2" fill="#FF5A1F" opacity=".85"/><rect x="16" y="2" width="4" height="28" rx="2" fill="#FF5A1F" opacity=".7"/><rect x="22" y="6" width="4" height="20" rx="2" fill="#FF5A1F" opacity=".55"/></svg>
      CWI <span class="dot">·</span> Competitor Research Tracker
    </div>
    <a class="back-link" href="../index.html">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2L3 7l5 5"/><line x1="3" y1="7" x2="12" y2="7"/></svg>
      Back
    </a>
  </div>
</header>

<!-- Header Actions row (Export + Add) -->
<div style="max-width:1400px;margin:0 auto;padding:20px 24px 0;display:flex;justify-content:flex-end;gap:10px;">
  <button class="btn btn-secondary btn-sm" onclick="exportCSV()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    <span>Export CSV</span>
  </button>
  <button class="btn btn-primary btn-sm" onclick="openAddModal()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    <span>Add Competitor</span>
  </button>
</div>

<main class="main">

  <!-- How We Win Banner -->
  <div class="win-banner" id="winBanner">
    <button class="win-banner-edit" onclick="openBannerModal()">Edit</button>
    <div class="win-banner-inner">
      <h2>How We Win</h2>
      <p id="winText"></p>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="view-toggle">
        <button class="view-btn active" id="cardViewBtn" onclick="setView('cards')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Card View
        </button>
        <button class="view-btn" id="tableViewBtn" onclick="setView('table')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
          Comparison Table
        </button>
      </div>
      <span class="comp-count" id="compCount">0 competitors</span>
    </div>
    <div class="toolbar-right">
      <button class="btn btn-secondary btn-sm" onclick="saveAll()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Save All
      </button>
    </div>
  </div>

  <!-- Card View -->
  <div class="cards-view" id="cardsView">
    <div class="cards-grid" id="cardsGrid"></div>
  </div>

  <!-- Table View -->
  <div class="table-view" id="tableView">
    <div class="comp-table-wrap">
      <div class="comp-table-scroll">
        <table class="comp-table" id="compTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

</main>

<!-- Add Competitor Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3>Add Competitor</h3>
    <div class="modal-field">
      <label for="newCompName">Competitor Name *</label>
      <input type="text" id="newCompName" placeholder="e.g. Podium, Birdeye..." autofocus>
    </div>
    <div class="modal-field">
      <label for="newCompPricing">Pricing (optional)</label>
      <input type="text" id="newCompPricing" placeholder="e.g. $249–$599/mo">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeAddModal()">Cancel</button>
      <button class="btn btn-primary" onclick="addCompetitor()">Add Competitor</button>
    </div>
  </div>
</div>

<!-- Edit Banner Modal -->
<div class="banner-modal-overlay" id="bannerModal">
  <div class="banner-modal">
    <h3>Edit "How We Win" Summary</h3>
    <p>This statement appears at the top of the tracker and defines your core competitive advantage.</p>
    <textarea id="bannerTextarea" placeholder="Enter your competitive positioning statement..."></textarea>
    <div class="banner-modal-actions">
      <button class="btn btn-secondary" onclick="closeBannerModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveBanner()">Save</button>
    </div>
  </div>
</div>

<!-- Confirm Delete Modal -->
<div class="confirm-overlay" id="confirmModal">
  <div class="confirm-box">
    <div class="confirm-icon">&#128465;</div>
    <h4 id="confirmTitle">Delete Competitor?</h4>
    <p id="confirmMsg">This action cannot be undone.</p>
    <div class="confirm-actions">
      <button class="btn btn-secondary" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger" id="confirmOkBtn">Delete</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── Constants ───────────────────────────────────────────────────────────────

const STORAGE_KEY = 'cwi_competitors_v2';
const BANNER_KEY  = 'cwi_win_banner_v2';

const DEFAULT_BANNER = 'CWI AI is the only solution that combines 24/7 AI booking + automated follow-up + white-label delivery at under $400/mo for local service businesses.';

const FEATURES = [
  { key: 'avail247',     label: '24/7 Availability',      icon: '🕐' },
  { key: 'aiResponses',  label: 'AI Responses',            icon: '🤖' },
  { key: 'bookingAuto',  label: 'Booking Automation',      icon: '📅' },
  { key: 'payFollowUp',  label: 'Payment Follow-Up',       icon: '💳' },
  { key: 'whiteLabel',   label: 'White-Label',             icon: '🏷️' },
  { key: 'perClient',    label: 'Per-Client Pricing',      icon: '💲' },
  { key: 'noContract',   label: 'No Long-Term Contract',   icon: '✂️' },
  { key: 'localFocus',   label: 'Local Business Focus',    icon: '📍' },
];

const DEFAULT_COMPETITORS = [
  {
    id: uid(),
    name: 'Podium',
    pricing: '$289–$649/mo',
    features: 'Review management, messaging platform, webchat, payment collection, team inbox, automated texts.',
    weaknesses: 'Expensive for small businesses. Requires long-term contracts. Not AI-native — relies heavily on human staff to respond. No true booking automation.',
    advantage: 'CWI AI automates responses 24/7 without requiring a human monitor. We deliver at a fraction of the price with no annual contract lock-in.',
    lastUpdated: today(),
    featureMatrix: { avail247: false, aiResponses: true, bookingAuto: false, payFollowUp: true, whiteLabel: false, perClient: false, noContract: false, localFocus: true },
  },
  {
    id: uid(),
    name: 'Birdeye',
    pricing: '$299–$599/mo',
    features: 'Reputation management, review requests, webchat, listings, social management, surveys, referrals.',
    weaknesses: 'Enterprise-focused pricing. Overwhelming feature set for small local businesses. AI features are add-ons, not core. White-label only at agency tier.',
    advantage: 'CWI AI is purpose-built for local service businesses — no bloated features, just the tools that drive revenue: booking, follow-up, and AI responses.',
    lastUpdated: today(),
    featureMatrix: { avail247: false, aiResponses: true, bookingAuto: true, payFollowUp: false, whiteLabel: true, perClient: false, noContract: false, localFocus: false },
  },
  {
    id: uid(),
    name: 'Numa',
    pricing: '$199–$399/mo',
    features: 'AI-powered texting for missed calls, auto-replies, appointment booking via text, review requests.',
    weaknesses: 'Limited to text/SMS channel only. No payment follow-up. No white-label option for agencies. Narrow use case focused on missed calls.',
    advantage: 'CWI AI covers the full customer journey — intake, booking, follow-up, and payments — not just missed call recovery. Full white-label available for agencies.',
    lastUpdated: today(),
    featureMatrix: { avail247: true, aiResponses: true, bookingAuto: true, payFollowUp: false, whiteLabel: false, perClient: false, noContract: true, localFocus: true },
  },
  {
    id: uid(),
    name: 'Broadly',
    pricing: '$199–$349/mo',
    features: 'Review management, webchat, two-way texting, simple payment collection, email campaigns.',
    weaknesses: 'Limited AI capabilities — mostly template-based responses. No booking automation. Weak analytics. Product has seen slow development.',
    advantage: 'CWI AI uses true AI for dynamic, context-aware responses — not canned templates. We include booking automation and payment follow-up that Broadly lacks entirely.',
    lastUpdated: today(),
    featureMatrix: { avail247: false, aiResponses: false, bookingAuto: false, payFollowUp: true, whiteLabel: false, perClient: false, noContract: true, localFocus: true },
  },
  {
    id: uid(),
    name: 'AnswerConnect',
    pricing: '$325–$795/mo (pay per minute)',
    features: 'Live human answering service, 24/7 call coverage, appointment scheduling, lead intake, bilingual agents.',
    weaknesses: 'Human-staffed — costs scale with call volume. Expensive per-minute billing. No AI automation. No text/chat channel. Inconsistent agent quality.',
    advantage: 'CWI AI delivers 24/7 coverage at a flat predictable rate — no per-minute charges, no human error, instant responses across every channel including text and web chat.',
    lastUpdated: today(),
    featureMatrix: { avail247: true, aiResponses: false, bookingAuto: true, payFollowUp: false, whiteLabel: false, perClient: false, noContract: false, localFocus: true },
  },
];

// CWI AI feature matrix (always shown in table)
const CWI_MATRIX = {
  avail247: true, aiResponses: true, bookingAuto: true,
  payFollowUp: true, whiteLabel: true, perClient: true,
  noContract: true, localFocus: true,
};

// ─── State ────────────────────────────────────────────────────────────────────

let competitors = [];
let currentView = 'cards';
let confirmCallback = null;
let autoSaveTimers = {};

// ─── Init ─────────────────────────────────────────────────────────────────────

function uid() {
  return 'c_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

function today() {
  return new Date().toISOString().split('T')[0];
}

function init() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try { competitors = JSON.parse(stored); }
    catch(e) { competitors = [...DEFAULT_COMPETITORS]; }
  } else {
    competitors = DEFAULT_COMPETITORS.map(c => ({ ...c, id: uid() }));
  }

  const storedBanner = localStorage.getItem(BANNER_KEY);
  document.getElementById('winText').textContent = storedBanner || DEFAULT_BANNER;

  render();
}

// ─── Persistence ──────────────────────────────────────────────────────────────

function saveAll() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(competitors));
  showToast('All data saved.', 'success');
}

function autoSave(id) {
  clearTimeout(autoSaveTimers[id]);
  autoSaveTimers[id] = setTimeout(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(competitors));
    const indicator = document.getElementById('save_' + id);
    if (indicator) {
      indicator.classList.add('show');
      setTimeout(() => indicator.classList.remove('show'), 1800);
    }
  }, 600);
}

// ─── Render ───────────────────────────────────────────────────────────────────

function render() {
  updateCount();
  if (currentView === 'cards') renderCards();
  else renderTable();
}

function updateCount() {
  const el = document.getElementById('compCount');
  const n = competitors.length;
  el.textContent = n + ' competitor' + (n !== 1 ? 's' : '');
}

// ─── Card View ────────────────────────────────────────────────────────────────

function renderCards() {
  const grid = document.getElementById('cardsGrid');
  if (competitors.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="empty-icon">&#128269;</div>
      <h3>No competitors yet</h3>
      <p>Click "Add Competitor" to get started.</p>
    </div>`;
    return;
  }
  grid.innerHTML = competitors.map(c => cardHTML(c)).join('');
}

function cardHTML(c) {
  const initials = (c.name || '?').charAt(0).toUpperCase();
  return `
  <div class="comp-card" id="card_${c.id}">
    <div class="card-header">
      <div class="card-title-wrap">
        <div class="comp-avatar" id="avatar_${c.id}">${initials}</div>
        <input class="comp-name-input" id="name_${c.id}" value="${esc(c.name)}" placeholder="Competitor name..."
          oninput="updateField('${c.id}','name',this.value)">
      </div>
      <div class="card-actions">
        <button class="card-delete-btn" title="Delete competitor" onclick="confirmDelete('${c.id}')">&#128465;</button>
      </div>
    </div>
    <div class="card-body">
      <div class="field-group">
        <div class="field-label"><span class="label-icon">💲</span> Pricing</div>
        <input class="field-input" id="pricing_${c.id}" type="text" value="${esc(c.pricing)}" placeholder="e.g. $299–$599/mo"
          oninput="updateField('${c.id}','pricing',this.value)">
      </div>
      <div class="field-group">
        <div class="field-label"><span class="label-icon">✅</span> Key Features</div>
        <textarea class="field-input" id="features_${c.id}" placeholder="What do they offer?"
          oninput="updateField('${c.id}','features',this.value)">${esc(c.features)}</textarea>
      </div>
      <div class="field-group">
        <div class="field-label"><span class="label-icon">⚠️</span> Weaknesses</div>
        <textarea class="field-input" id="weaknesses_${c.id}" placeholder="Where do they fall short?"
          oninput="updateField('${c.id}','weaknesses',this.value)">${esc(c.weaknesses)}</textarea>
      </div>
      <div class="field-group">
        <div class="field-label"><span class="label-icon" style="color:var(--accent)">🏆</span> <span style="color:var(--accent)">Our Advantage</span></div>
        <textarea class="field-input advantage" id="advantage_${c.id}" placeholder="Why do we win against them?"
          oninput="updateField('${c.id}','advantage',this.value)">${esc(c.advantage)}</textarea>
      </div>
    </div>
    <div class="card-footer">
      <span class="last-updated">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Updated: <span class="last-updated-date" id="updated_${c.id}">${formatDate(c.lastUpdated)}</span>
      </span>
      <span class="auto-save-indicator" id="save_${c.id}">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        Saved
      </span>
    </div>
  </div>`;
}

// ─── Table View ───────────────────────────────────────────────────────────────

function renderTable() {
  const thead = document.getElementById('tableHead');
  const tbody = document.getElementById('tableBody');

  // Header row
  let headHTML = '<tr><th><div class="th-inner"><span>Feature</span></div></th>';
  headHTML += `<th class="cwi-col"><div class="th-inner"><span>CWI AI</span><span class="th-sub">Our Product</span></div></th>`;
  competitors.forEach(c => {
    headHTML += `<th><div class="th-inner"><span>${esc(c.name || 'Unnamed')}</span><span class="th-sub">${esc(c.pricing || '—')}</span></div></th>`;
  });
  headHTML += '</tr>';
  thead.innerHTML = headHTML;

  // Feature rows
  let bodyHTML = `<tr class="table-section-header"><td colspan="${competitors.length + 2}">Feature Comparison</td></tr>`;

  FEATURES.forEach(feat => {
    bodyHTML += `<tr class="feature-row"><td>${feat.icon} ${feat.label}</td>`;
    // CWI AI
    const cwiVal = CWI_MATRIX[feat.key];
    bodyHTML += `<td class="cwi-cell" style="text-align:center">${checkmark(cwiVal)}</td>`;
    // Competitors
    competitors.forEach(c => {
      const matrix = c.featureMatrix || {};
      const val = matrix[feat.key];
      bodyHTML += `<td style="text-align:center">
        <label style="display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer">
          <input type="checkbox" ${val ? 'checked' : ''} onchange="updateMatrix('${c.id}','${feat.key}',this.checked)"
            style="width:16px;height:16px;accent-color:var(--accent);cursor:pointer">
        </label>
      </td>`;
    });
    bodyHTML += '</tr>';
  });

  // Pricing row
  bodyHTML += `<tr class="table-section-header"><td colspan="${competitors.length + 2}">Pricing & Notes</td></tr>`;
  bodyHTML += `<tr><td>Monthly Price</td><td class="cwi-cell" style="font-weight:700;color:var(--accent)">Under $400/mo</td>`;
  competitors.forEach(c => {
    bodyHTML += `<td>${esc(c.pricing || '—')}</td>`;
  });
  bodyHTML += '</tr>';

  // Advantage row
  bodyHTML += `<tr><td>Our Advantage</td><td class="cwi-cell"></td>`;
  competitors.forEach(c => {
    const adv = (c.advantage || '').length > 120 ? c.advantage.slice(0, 120) + '...' : c.advantage;
    bodyHTML += `<td style="font-size:12px;color:var(--muted);line-height:1.5">${esc(adv)}</td>`;
  });
  bodyHTML += '</tr>';

  tbody.innerHTML = bodyHTML;
}

function checkmark(val) {
  if (val === true)  return '<span class="check">&#10003;</span>';
  if (val === false) return '<span class="cross">&#10007;</span>';
  return '<span class="partial">&#126;</span>';
}

// ─── Field Updates ────────────────────────────────────────────────────────────

function updateField(id, field, value) {
  const comp = competitors.find(c => c.id === id);
  if (!comp) return;
  comp[field] = value;
  comp.lastUpdated = today();

  // Update avatar initial
  if (field === 'name') {
    const avatar = document.getElementById('avatar_' + id);
    if (avatar) avatar.textContent = (value || '?').charAt(0).toUpperCase();
    const updEl = document.getElementById('updated_' + id);
    if (updEl) updEl.textContent = formatDate(comp.lastUpdated);
  }

  autoSave(id);
}

function updateMatrix(id, featKey, checked) {
  const comp = competitors.find(c => c.id === id);
  if (!comp) return;
  if (!comp.featureMatrix) comp.featureMatrix = {};
  comp.featureMatrix[featKey] = checked;
  comp.lastUpdated = today();
  autoSave(id);
}

// ─── Add / Delete ─────────────────────────────────────────────────────────────

function openAddModal() {
  document.getElementById('newCompName').value = '';
  document.getElementById('newCompPricing').value = '';
  document.getElementById('addModal').classList.add('open');
  setTimeout(() => document.getElementById('newCompName').focus(), 80);
}

function closeAddModal() {
  document.getElementById('addModal').classList.remove('open');
}

function addCompetitor() {
  const name = document.getElementById('newCompName').value.trim();
  if (!name) { showToast('Please enter a competitor name.', 'error'); return; }
  const pricing = document.getElementById('newCompPricing').value.trim();

  const newComp = {
    id: uid(),
    name,
    pricing,
    features: '',
    weaknesses: '',
    advantage: '',
    lastUpdated: today(),
    featureMatrix: { avail247: false, aiResponses: false, bookingAuto: false, payFollowUp: false, whiteLabel: false, perClient: false, noContract: false, localFocus: false },
  };
  competitors.push(newComp);
  closeAddModal();
  render();
  saveAll();
  showToast('Competitor "' + name + '" added.', 'success');

  // Scroll to new card
  if (currentView === 'cards') {
    setTimeout(() => {
      const card = document.getElementById('card_' + newComp.id);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 100);
  }
}

function confirmDelete(id) {
  const comp = competitors.find(c => c.id === id);
  if (!comp) return;
  document.getElementById('confirmTitle').textContent = 'Delete "' + (comp.name || 'Unnamed') + '"?';
  document.getElementById('confirmMsg').textContent = 'This will permanently remove this competitor and all associated notes. This action cannot be undone.';
  const btn = document.getElementById('confirmOkBtn');
  btn.onclick = () => { deleteCompetitor(id); closeConfirm(); };
  document.getElementById('confirmModal').classList.add('open');
}

function closeConfirm() {
  document.getElementById('confirmModal').classList.remove('open');
}

function deleteCompetitor(id) {
  const comp = competitors.find(c => c.id === id);
  const name = comp ? comp.name : 'Competitor';
  competitors = competitors.filter(c => c.id !== id);
  render();
  saveAll();
  showToast('"' + name + '" deleted.', 'info');
}

// ─── View Toggle ──────────────────────────────────────────────────────────────

function setView(view) {
  currentView = view;
  const cardsView  = document.getElementById('cardsView');
  const tableView  = document.getElementById('tableView');
  const cardBtn    = document.getElementById('cardViewBtn');
  const tableBtn   = document.getElementById('tableViewBtn');

  if (view === 'cards') {
    cardsView.classList.remove('hidden');
    tableView.classList.remove('active');
    cardBtn.classList.add('active');
    tableBtn.classList.remove('active');
    renderCards();
  } else {
    cardsView.classList.add('hidden');
    tableView.classList.add('active');
    tableBtn.classList.add('active');
    cardBtn.classList.remove('active');
    renderTable();
  }
}

// ─── Banner ───────────────────────────────────────────────────────────────────

function openBannerModal() {
  const current = document.getElementById('winText').textContent;
  document.getElementById('bannerTextarea').value = current;
  document.getElementById('bannerModal').classList.add('open');
  setTimeout(() => document.getElementById('bannerTextarea').focus(), 80);
}

function closeBannerModal() {
  document.getElementById('bannerModal').classList.remove('open');
}

function saveBanner() {
  const val = document.getElementById('bannerTextarea').value.trim();
  if (!val) { showToast('Please enter a summary.', 'error'); return; }
  document.getElementById('winText').textContent = val;
  localStorage.setItem(BANNER_KEY, val);
  closeBannerModal();
  showToast('Summary updated.', 'success');
}

// ─── Export CSV ───────────────────────────────────────────────────────────────

function exportCSV() {
  if (competitors.length === 0) { showToast('No competitors to export.', 'error'); return; }

  const headers = ['Name', 'Pricing', 'Key Features', 'Weaknesses', 'Our Advantage', 'Last Updated',
    ...FEATURES.map(f => f.label)];

  const rows = competitors.map(c => {
    const matrix = c.featureMatrix || {};
    return [
      c.name || '',
      c.pricing || '',
      c.features || '',
      c.weaknesses || '',
      c.advantage || '',
      c.lastUpdated || '',
      ...FEATURES.map(f => matrix[f.key] ? 'Yes' : 'No'),
    ].map(v => '"' + String(v).replace(/"/g, '""') + '"');
  });

  const csv = [headers.map(h => '"' + h + '"').join(','), ...rows.map(r => r.join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cwi-ai-competitor-analysis-' + today() + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV exported successfully.', 'success');
}

// ─── Toast ────────────────────────────────────────────────────────────────────

let toastTimer = null;
function showToast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.className = 'toast ' + type;
  const icons = { success: '&#10003;', error: '&#9888;', info: '&#8505;' };
  el.innerHTML = `<span>${icons[type] || ''}</span> ${esc(msg)}`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ─── Helpers ──────────────────────────────────────────────────────────────────

function esc(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatDate(d) {
  if (!d) return 'Never';
  try {
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  } catch(e) { return d; }
}

// ─── Keyboard shortcuts ───────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveAll(); }
  if (e.key === 'Escape') {
    closeAddModal();
    closeBannerModal();
    closeConfirm();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e.preventDefault(); openAddModal(); }
});

// Close modals on overlay click
document.getElementById('addModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeAddModal();
});
document.getElementById('bannerModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeBannerModal();
});
document.getElementById('confirmModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeConfirm();
});

// Enter to submit add modal
document.getElementById('newCompName').addEventListener('keydown', e => {
  if (e.key === 'Enter') addCompetitor();
});

// ─── Boot ─────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
