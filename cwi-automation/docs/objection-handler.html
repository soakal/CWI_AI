<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Objection Handler</title>
<meta name="description" content="CWI internal tool: Objection Handler. Internal use only — CWI Compute With Imagination.">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #FF5A1F;
    --accent-dim: #cc4818;
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3148;
    --text: #e8eaf0;
    --text-muted: #8b8fa8;
    --green: #22c55e;
    --radius: 10px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Header */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: .02em;
  }
  header h1 span { color: var(--accent); }

  /* Tab switcher */
  .tabs {
    display: flex;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .tab-btn {
    padding: 8px 22px;
    font-size: .875rem;
    font-weight: 600;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #fff;
  }
  .tab-btn:not(.active):hover { background: var(--border); color: var(--text); }

  /* Main container */
  main { max-width: 820px; margin: 0 auto; padding: 28px 20px 60px; }

  /* QUICK REFERENCE */
  #view-reference { display: block; }
  #view-practice  { display: none; }

  .accordion { display: flex; flex-direction: column; gap: 10px; }

  .acc-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .acc-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    cursor: pointer;
    user-select: none;
    transition: background .15s;
  }
  .acc-header:hover { background: var(--surface2); }

  .acc-num {
    min-width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: .75rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  .acc-title {
    flex: 1;
    font-size: .95rem;
    font-weight: 600;
  }

  .acc-chevron {
    font-size: .75rem;
    color: var(--text-muted);
    transition: transform .3s;
  }
  .acc-item.open .acc-chevron { transform: rotate(180deg); }

  .acc-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height .35s ease;
  }
  .acc-item.open .acc-body { max-height: 600px; }

  .acc-response {
    margin: 0 18px 18px;
    border-left: 4px solid var(--accent);
    padding: 14px 16px;
    background: rgba(255,90,31,.07);
    border-radius: 0 var(--radius) var(--radius) 0;
    font-size: .9rem;
    line-height: 1.65;
    color: var(--text);
  }

  .acc-response .label {
    font-size: .7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .acc-response ol { padding-left: 18px; }
  .acc-response li { margin-bottom: 6px; }
  .acc-response li:last-child { margin-bottom: 0; }

  /* PRACTICE MODE */
  .practice-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .score-badge {
    font-size: .875rem;
    font-weight: 700;
    color: var(--text-muted);
  }
  .score-badge span { color: var(--accent); font-size: 1.05rem; }

  /* Progress bar */
  .progress-wrap {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width .4s ease;
  }

  /* Flashcard */
  .card-scene {
    perspective: 1000px;
    width: 100%;
    height: 280px;
    cursor: pointer;
    margin-bottom: 22px;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.4,0,.2,1);
  }
  .card-scene.flipped .card-inner { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 14px;
    padding: 30px 32px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .card-front {
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .card-back {
    background: var(--surface);
    border: 1px solid var(--accent);
    transform: rotateY(180deg);
  }

  .card-tag {
    font-size: .7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--accent);
    margin-bottom: 14px;
  }

  .card-front .card-num {
    position: absolute;
    top: 18px; right: 22px;
    font-size: .8rem;
    color: var(--text-muted);
  }

  .card-objection {
    font-size: 1.15rem;
    font-weight: 600;
    line-height: 1.5;
  }

  .card-hint {
    margin-top: 18px;
    font-size: .78rem;
    color: var(--text-muted);
  }

  .card-back .card-response {
    font-size: .875rem;
    line-height: 1.65;
    overflow-y: auto;
    max-height: 200px;
  }
  .card-back .card-response ol { padding-left: 18px; }
  .card-back .card-response li { margin-bottom: 5px; }

  /* Action row */
  .action-row {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 10px 24px;
    border-radius: var(--radius);
    font-size: .875rem;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: background .2s, opacity .2s;
  }
  .btn:disabled { opacity: .35; cursor: not-allowed; }

  .btn-accent   { background: var(--accent);  color: #fff; }
  .btn-accent:hover:not(:disabled) { background: var(--accent-dim); }

  .btn-outline {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .btn-outline:hover:not(:disabled) { background: var(--surface2); color: var(--text); }

  .btn-green  { background: var(--green); color: #fff; }
  .btn-green:hover:not(:disabled) { background: #16a34a; }

  /* Dot grid */
  .dot-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }

  .dot {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: .72rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s;
    border: 2px solid transparent;
  }
  .dot:hover { transform: scale(1.15); }
  .dot.mastered  { background: var(--green);    color: #fff;           border-color: var(--green); }
  .dot.current   { background: transparent;     color: var(--accent);  border-color: var(--accent); }
  .dot.pending   { background: var(--surface2); color: var(--text-muted); border-color: var(--border); }

  /* Completion banner */
  .completion {
    display: none;
    text-align: center;
    padding: 40px 24px;
    background: var(--surface);
    border: 1px solid var(--green);
    border-radius: 14px;
    margin-bottom: 24px;
  }
  .completion.show { display: block; }
  .completion h2 { font-size: 1.5rem; margin-bottom: 10px; }
  .completion p  { color: var(--text-muted); margin-bottom: 20px; }
  .completion .trophy { font-size: 3rem; margin-bottom: 14px; }
</style>
</head>
<body>

<header>
  <h1>Objection <span>Handler</span></h1>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchView('reference')">Quick Reference</button>
    <button class="tab-btn"        onclick="switchView('practice')">Practice Mode</button>
  </div>
</header>

<main>

  <!-- QUICK REFERENCE -->
  <div id="view-reference">
    <div class="accordion" id="accordion"></div>
  </div>

  <!-- PRACTICE MODE -->
  <div id="view-practice">
    <div class="practice-header">
      <div class="score-badge">Mastered: <span id="score">0</span> / 15</div>
      <button class="btn btn-outline" onclick="resetPractice()">Reset</button>
    </div>

    <div class="progress-wrap">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>

    <div class="completion" id="completion-banner">
      <div class="trophy">&#127942;</div>
      <h2>All 15 Objections Mastered!</h2>
      <p>You're ready to handle anything a prospect throws at you.</p>
      <button class="btn btn-accent" onclick="resetPractice()">Practice Again</button>
    </div>

    <div id="card-area">
      <div class="card-scene" id="card-scene" onclick="flipCard()">
        <div class="card-inner" id="card-inner">
          <div class="card-face card-front">
            <div class="card-num" id="card-num"></div>
            <div class="card-tag">Objection</div>
            <div class="card-objection" id="card-objection"></div>
            <div class="card-hint">Click to reveal response &#8594;</div>
          </div>
          <div class="card-face card-back">
            <div class="card-tag">Scripted Response</div>
            <div class="card-response" id="card-response"></div>
          </div>
        </div>
      </div>

      <div class="action-row">
        <button class="btn btn-green"   id="btn-master" onclick="markMastered()">Mark as Mastered</button>
        <button class="btn btn-outline" id="btn-skip"   onclick="skipCard()">Skip</button>
      </div>
    </div>

    <div class="dot-grid" id="dot-grid"></div>
  </div>

</main>

<script>
// DATA — 15 objections
var OBJECTIONS = [
  {
    title: "I need to think about it.",
    response: [
      "Absolutely — this is a big decision and you should feel confident.",
      "Can I ask: is there a specific concern or question holding you back? I'd rather address it now than leave you with a gap.",
      "Most people who say they need to think about it are really wondering about cost, results, or time. Which of those resonates most?",
      "I'm here to help you think through it — what would make you feel completely confident moving forward today?"
    ]
  },
  {
    title: "It's too expensive.",
    response: [
      "I completely understand — budget matters. Let me ask: too expensive compared to what?",
      "If we can show the ROI clearly, price becomes an investment rather than a cost. What return would you need to see to make this a no-brainer?",
      "We have flexible options. Would breaking this into smaller payments change the conversation?",
      "Consider the cost of NOT solving this — what is the problem costing you right now in time, revenue, or stress?"
    ]
  },
  {
    title: "I need to talk to my spouse / partner.",
    response: [
      "That makes total sense — big decisions are better made together.",
      "Would it help if we set up a quick call with both of you so I can answer any questions they might have directly?",
      "What do you think their main concern will be? Let me give you the best way to frame it for them.",
      "If your partner is on board after that conversation, is there anything else that would stop you from moving forward?"
    ]
  },
  {
    title: "I already have someone who does that.",
    response: [
      "Great — that tells me you already see the value in this area.",
      "Out of curiosity, are you 100% happy with the results you're getting, or is there room for improvement?",
      "We hear this often, and many of our best clients came to us after an existing relationship wasn't delivering.",
      "We're not asking you to replace anyone today — just let us show you what we do differently. Fair?"
    ]
  },
  {
    title: "Now isn't a good time.",
    response: [
      "Timing is everything — I respect that.",
      "Can I ask what's making now feel like the wrong time? Sometimes what feels like 'not now' is actually 'I'm not sure yet.'",
      "The challenge is that the problems we solve tend to compound. What would need to change for timing to feel right?",
      "What if we put a soft hold in place and revisit in a few weeks? I'd hate for availability or pricing to change on you."
    ]
  },
  {
    title: "I've had a bad experience with a similar company.",
    response: [
      "I'm sorry to hear that — that's genuinely frustrating, and I want to acknowledge it.",
      "Can you tell me what went wrong? Understanding that helps me show you exactly how we're different.",
      "One bad experience shouldn't close the door on a solution that could help you. Would you be open to seeing the contrast?",
      "We'd rather earn your trust slowly than rush you. What would we need to demonstrate first?"
    ]
  },
  {
    title: "I can do this myself.",
    response: [
      "You absolutely could — and I respect that confidence.",
      "The question is: is this the highest and best use of your time? What's your time worth per hour?",
      "Our clients usually try DIY first. The ones who come to us say the hidden costs — time, mistakes, missed opportunity — end up costing far more.",
      "What if we handled it so you could focus on what only you can do?"
    ]
  },
  {
    title: "I need to see results first.",
    response: [
      "That's a fair and reasonable position.",
      "Let me share some case studies from clients in a similar situation — real numbers, real timelines.",
      "We offer a pilot or trial specifically so you can validate results before a larger commitment.",
      "What specific result, within what timeframe, would convince you this is worth it?"
    ]
  },
  {
    title: "Your competitor offers it cheaper.",
    response: [
      "I appreciate you being upfront — let's talk about that.",
      "Price comparisons only make sense when you're comparing the same thing. Can we walk through what's actually included on both sides?",
      "Cheaper isn't always better — what matters is cost per result. What outcome are you ultimately paying for?",
      "If the price were identical, who would you choose and why? That tells us what really matters to you."
    ]
  },
  {
    title: "I don't see the value.",
    response: [
      "Thank you for being direct — that tells me I haven't connected this to what matters most to you yet.",
      "Help me understand: what outcome would make this feel completely worth it?",
      "Let me reframe it around your specific pain point. How much is that costing you today?",
      "Once I understand your priority, I can show you exactly how this delivers it. What's your number-one goal right now?"
    ]
  },
  {
    title: "I'm not the decision maker.",
    response: [
      "Totally understand — and I appreciate your honesty.",
      "What's the best way to get the right people on a call? I'm happy to present directly to whoever needs to approve this.",
      "What information would you need to take this to your decision maker confidently?",
      "If the decision were yours alone, do you think this would be a fit?"
    ]
  },
  {
    title: "I'm too busy right now.",
    response: [
      "I hear you — everyone's slammed.",
      "That's actually exactly why people come to us: to get time back. The irony is that being too busy is often the clearest sign you need this.",
      "This doesn't require much of your time — I can handle most of it. What's the minimum you'd need to invest to get started?",
      "What if busyness didn't get better on its own? How long have you felt this stretched?"
    ]
  },
  {
    title: "I don't trust this will work.",
    response: [
      "That's the most honest objection you can give me — and I respect it.",
      "What would it take for you to trust it? Let's design that together.",
      "I'd like to share a case study from someone who had the exact same doubt.",
      "What risk can we remove or reduce to make this feel safer for you?"
    ]
  },
  {
    title: "We don't have budget right now.",
    response: [
      "Budget constraints are real — let's work within them.",
      "Is there truly no budget, or is it a priority question? Sometimes budget appears when the ROI is clear enough.",
      "When does your next budget cycle open? Let's put a plan in place now so you're ready to move quickly.",
      "What if this pays for itself within a short timeframe? Would that change the conversation?"
    ]
  },
  {
    title: "Let me shop around first.",
    response: [
      "Absolutely — you should feel confident you're making the best choice.",
      "What are the two or three things you'll be comparing? I want to make sure you're evaluating apples to apples.",
      "Most people who shop around come back to us — I'd rather save you the time. Can I address the key comparison points right now?",
      "What would need to be true for you to feel like shopping around isn't necessary?"
    ]
  }
];

// QUICK REFERENCE — build accordion
function buildAccordion() {
  var container = document.getElementById('accordion');
  OBJECTIONS.forEach(function(obj, i) {
    var item = document.createElement('div');
    item.className = 'acc-item';
    var listItems = obj.response.map(function(r) { return '<li>' + r + '</li>'; }).join('');
    item.innerHTML =
      '<div class="acc-header" onclick="toggleAcc(this)">' +
        '<div class="acc-num">' + (i + 1) + '</div>' +
        '<div class="acc-title">' + obj.title + '</div>' +
        '<div class="acc-chevron">&#9660;</div>' +
      '</div>' +
      '<div class="acc-body">' +
        '<div class="acc-response">' +
          '<div class="label">Scripted Response</div>' +
          '<ol>' + listItems + '</ol>' +
        '</div>' +
      '</div>';
    container.appendChild(item);
  });
}

function toggleAcc(header) {
  var item = header.closest('.acc-item');
  var isOpen = item.classList.contains('open');
  document.querySelectorAll('.acc-item.open').forEach(function(el) { el.classList.remove('open'); });
  if (!isOpen) item.classList.add('open');
}

// PRACTICE MODE
var mastered = new Set();
var currentIdx = 0;
var isFlipped = false;

function buildDots() {
  var grid = document.getElementById('dot-grid');
  grid.innerHTML = '';
  OBJECTIONS.forEach(function(_, i) {
    var dot = document.createElement('div');
    var cls = mastered.has(i) ? 'mastered' : (i === currentIdx ? 'current' : 'pending');
    dot.className = 'dot ' + cls;
    dot.textContent = i + 1;
    (function(idx) { dot.onclick = function() { jumpTo(idx); }; })(i);
    grid.appendChild(dot);
  });
}

function loadCard(idx) {
  currentIdx = idx;
  isFlipped = false;
  document.getElementById('card-scene').classList.remove('flipped');
  var obj = OBJECTIONS[idx];
  document.getElementById('card-num').textContent = (idx + 1) + ' / 15';
  document.getElementById('card-objection').textContent = obj.title;
  var listItems = obj.response.map(function(r) { return '<li>' + r + '</li>'; }).join('');
  document.getElementById('card-response').innerHTML = '<ol>' + listItems + '</ol>';
  buildDots();
  updateProgress();
  var btnMaster = document.getElementById('btn-master');
  btnMaster.textContent = mastered.has(idx) ? 'Mastered ✓' : 'Mark as Mastered';
  btnMaster.disabled = mastered.has(idx);
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('card-scene').classList.toggle('flipped', isFlipped);
}

function markMastered() {
  mastered.add(currentIdx);
  document.getElementById('btn-master').textContent = 'Mastered ✓';
  document.getElementById('btn-master').disabled = true;
  document.getElementById('score').textContent = mastered.size;
  updateProgress();
  buildDots();
  if (mastered.size === OBJECTIONS.length) {
    showCompletion();
    return;
  }
  setTimeout(function() { advanceCard(); }, 600);
}

function skipCard() { advanceCard(); }

function jumpTo(idx) { loadCard(idx); }

function advanceCard() {
  var next = (currentIdx + 1) % OBJECTIONS.length;
  var tries = 0;
  while (mastered.has(next) && tries < OBJECTIONS.length) {
    next = (next + 1) % OBJECTIONS.length;
    tries++;
  }
  if (mastered.has(next)) { showCompletion(); return; }
  loadCard(next);
}

function updateProgress() {
  var pct = (mastered.size / OBJECTIONS.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function showCompletion() {
  document.getElementById('completion-banner').classList.add('show');
  document.getElementById('card-area').style.display = 'none';
}

function resetPractice() {
  mastered = new Set();
  currentIdx = 0;
  document.getElementById('score').textContent = 0;
  document.getElementById('completion-banner').classList.remove('show');
  document.getElementById('card-area').style.display = 'block';
  loadCard(0);
}

// VIEW SWITCHING
function switchView(view) {
  document.getElementById('view-reference').style.display = view === 'reference' ? 'block' : 'none';
  document.getElementById('view-practice').style.display  = view === 'practice'  ? 'block' : 'none';
  document.querySelectorAll('.tab-btn').forEach(function(btn, i) {
    btn.classList.toggle('active', (i === 0 && view === 'reference') || (i === 1 && view === 'practice'));
  });
}

// INIT
buildAccordion();
loadCard(0);
</script>
</body>
</html>
