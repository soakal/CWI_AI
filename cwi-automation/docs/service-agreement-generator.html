<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CWI AI LLC — Service Agreement Generator</title>
  <meta name="description" content="CWI internal tool: CWI AI LLC — Service Agreement Generator. Internal use only — CWI Compute With Imagination.">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================
       RESET & BASE
    ========================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0A0A0C;
      --surface:   #111114;
      --border:    #2a2a30;
      --orange:    #FF5A1F;
      --orange-dk: #cc4515;
      --text:      #e8e8ec;
      --muted:     #888898;
      --radius:    8px;
      --font-ui:   'Sora', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* =========================================================
       LAYOUT — SPLIT PANE
    ========================================================= */
    .shell {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* --- LEFT: FORM PANEL --- */
    .form-panel {
      width: 370px;
      min-width: 330px;
      max-width: 400px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .form-header {
      padding: 20px 22px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .form-header .logo-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      background: var(--orange);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    .form-header h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
    }

    .form-header p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .form-body {
      overflow-y: auto;
      flex: 1;
      padding: 18px 22px 24px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .form-body::-webkit-scrollbar { width: 5px; }
    .form-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* --- FORM SECTIONS --- */
    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--orange);
      margin: 20px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .section-label:first-child { margin-top: 0; }

    .field { margin-bottom: 12px; }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 4px;
      letter-spacing: 0.02em;
    }

    .field input,
    .field select {
      width: 100%;
      background: #18181e;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 13px;
      padding: 8px 11px;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--orange);
    }

    .field input[readonly] {
      color: var(--orange);
      background: #1a1208;
      border-color: #3a2810;
      cursor: default;
    }

    .field select option { background: #18181e; }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Tier badge row */
    .tier-info {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .tier-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      background: #1a1208;
      color: var(--orange);
      border: 1px solid #3a2810;
    }

    /* Generate button */
    .btn-generate {
      width: 100%;
      padding: 11px;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 22px;
      transition: background 0.15s;
      letter-spacing: 0.02em;
    }

    .btn-generate:hover { background: var(--orange-dk); }

    /* --- RIGHT: PREVIEW PANEL --- */
    .preview-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #1c1c22;
    }

    .preview-toolbar {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      flex-shrink: 0;
    }

    .preview-toolbar .toolbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .preview-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .agreement-num {
      font-size: 12px;
      color: var(--orange);
      font-weight: 600;
      background: #1a1208;
      border: 1px solid #3a2810;
      border-radius: 4px;
      padding: 2px 8px;
    }

    .btn-print {
      padding: 8px 18px;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-print:hover { background: var(--orange-dk); }

    .btn-print svg { width: 14px; height: 14px; fill: #fff; }

    .preview-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 32px 20px 60px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .preview-scroll::-webkit-scrollbar { width: 6px; }
    .preview-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      gap: 12px;
      text-align: center;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      opacity: 0.25;
    }

    .empty-state p {
      font-size: 13px;
      opacity: 0.6;
    }

    /* =========================================================
       AGREEMENT DOCUMENT STYLES
    ========================================================= */
    .agreement-doc {
      max-width: 780px;
      margin: 0 auto;
      background: #fff;
      color: #1a1a1a;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 4px 32px rgba(0,0,0,.5);
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 13.5px;
      line-height: 1.75;
    }

    /* Document header */
    .doc-header {
      background: #0A0A0C;
      padding: 32px 48px 28px;
      color: #fff;
    }

    .doc-header-inner {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .doc-logo-block .company-name {
      font-family: 'Sora', system-ui, sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #FF5A1F;
      letter-spacing: -0.5px;
    }

    .doc-logo-block .company-sub {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
      font-family: 'Sora', system-ui, sans-serif;
    }

    .doc-meta {
      text-align: right;
      font-family: 'Sora', system-ui, sans-serif;
    }

    .doc-meta .doc-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .doc-meta .doc-num {
      font-size: 11px;
      color: #FF5A1F;
      margin-top: 3px;
    }

    .doc-meta .doc-date {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    .doc-header-divider {
      height: 3px;
      background: linear-gradient(90deg, #FF5A1F 0%, #ff8c5a 50%, transparent 100%);
      margin-top: 24px;
    }

    /* Document body */
    .doc-body {
      padding: 36px 48px 48px;
    }

    /* Intro paragraph */
    .doc-intro {
      background: #fdf6f2;
      border-left: 4px solid #FF5A1F;
      padding: 14px 18px;
      border-radius: 0 4px 4px 0;
      margin-bottom: 28px;
      font-size: 13px;
      color: #333;
      line-height: 1.6;
    }

    /* Section headings */
    .doc-section {
      margin-bottom: 26px;
    }

    .doc-section-title {
      font-family: 'Sora', system-ui, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #FF5A1F;
      border-bottom: 1.5px solid #ffe5d8;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .doc-section-num {
      color: #bbb;
      margin-right: 6px;
    }

    .doc-section p {
      color: #2a2a2a;
      margin-bottom: 10px;
      font-size: 13.5px;
    }

    .doc-section p:last-child { margin-bottom: 0; }

    .doc-section ul {
      list-style: none;
      padding: 0;
      margin: 8px 0;
    }

    .doc-section ul li {
      padding: 4px 0 4px 18px;
      position: relative;
      color: #2a2a2a;
      font-size: 13.5px;
    }

    .doc-section ul li::before {
      content: '';
      position: absolute;
      left: 4px;
      top: 12px;
      width: 6px;
      height: 6px;
      background: #FF5A1F;
      border-radius: 50%;
    }

    /* Fee table */
    .fee-table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 13px;
    }

    .fee-table th {
      background: #f5f5f5;
      font-family: 'Sora', system-ui, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #666;
      padding: 8px 12px;
      text-align: left;
      border-bottom: 2px solid #ffe5d8;
    }

    .fee-table td {
      padding: 9px 12px;
      border-bottom: 1px solid #f0f0f0;
      color: #2a2a2a;
      vertical-align: top;
    }

    .fee-table tr:last-child td { border-bottom: none; }

    .fee-table .amount {
      font-weight: 600;
      color: #1a1a1a;
      font-family: 'Sora', system-ui, sans-serif;
    }

    /* Parties table */
    .parties-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 12px 0;
    }

    .party-card {
      background: #fafafa;
      border: 1px solid #eee;
      border-top: 3px solid #FF5A1F;
      border-radius: 4px;
      padding: 14px 16px;
    }

    .party-card .party-role {
      font-family: 'Sora', system-ui, sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #FF5A1F;
      margin-bottom: 8px;
    }

    .party-card .party-name {
      font-weight: 700;
      font-size: 14px;
      color: #1a1a1a;
      margin-bottom: 4px;
      font-family: 'Sora', system-ui, sans-serif;
    }

    .party-card .party-detail {
      font-size: 12px;
      color: #555;
      line-height: 1.6;
    }

    /* Signature block */
    .sig-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 16px;
    }

    .sig-block { }

    .sig-block .sig-party {
      font-family: 'Sora', system-ui, sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #FF5A1F;
      margin-bottom: 6px;
    }

    .sig-line {
      border-bottom: 1.5px solid #333;
      height: 38px;
      margin-bottom: 6px;
    }

    .sig-label {
      font-size: 11px;
      color: #666;
      display: flex;
      justify-content: space-between;
    }

    .sig-label span:first-child { font-weight: 600; color: #333; }

    .sig-date-line {
      border-bottom: 1px solid #aaa;
      height: 28px;
      margin: 16px 0 4px;
    }

    .sig-date-label {
      font-size: 11px;
      color: #666;
    }

    /* Footer */
    .doc-footer {
      background: #0A0A0C;
      padding: 16px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .doc-footer-left {
      font-family: 'Sora', system-ui, sans-serif;
      font-size: 10px;
      color: #555;
    }

    .doc-footer-right {
      font-family: 'Sora', system-ui, sans-serif;
      font-size: 10px;
      color: #FF5A1F;
    }

    /* =========================================================
       PRINT STYLES
    ========================================================= */
    @media print {
      html, body {
        overflow: visible;
        height: auto;
        background: #fff;
      }

      .form-panel,
      .preview-toolbar {
        display: none !important;
      }

      .shell {
        display: block;
        height: auto;
      }

      .preview-panel {
        display: block;
        overflow: visible;
      }

      .preview-scroll {
        overflow: visible;
        padding: 0;
      }

      .agreement-doc {
        box-shadow: none;
        max-width: 100%;
        margin: 0;
        border-radius: 0;
      }

      .doc-header {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .doc-footer {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .party-card {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        break-inside: avoid;
      }

      .doc-section { break-inside: avoid; }

      .sig-grid { break-inside: avoid; }

      .doc-section-title {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .doc-intro {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>

<div class="shell">

  <!-- =====================================================
       LEFT: INPUT FORM
  ===================================================== -->
  <aside class="form-panel">
    <div class="form-header">
      <div class="logo-line">
        <div class="logo-mark">CWI</div>
        <div>
          <h1>Service Agreement Generator</h1>
          <p>CWI AI LLC — Client Contracts</p>
        </div>
      </div>
    </div>

    <div class="form-body">

      <!-- CLIENT INFO -->
      <div class="section-label">Client Information</div>

      <div class="field">
        <label for="clientBiz">Client Legal Business Name</label>
        <input type="text" id="clientBiz" placeholder="Acme Corp LLC" />
      </div>

      <div class="field">
        <label for="clientOwner">Client Owner / Authorized Signatory</label>
        <input type="text" id="clientOwner" placeholder="Jane Smith" />
      </div>

      <div class="field">
        <label for="clientEmail">Client Email Address</label>
        <input type="email" id="clientEmail" placeholder="jane@acmecorp.com" />
      </div>

      <div class="field">
        <label for="clientAddr">Client Mailing Address</label>
        <input type="text" id="clientAddr" placeholder="123 Main St, City, State 00000" />
      </div>

      <!-- SERVICE -->
      <div class="section-label">Service Details</div>

      <div class="field">
        <label for="tier">Service Tier</label>
        <select id="tier" onchange="fillTierData()">
          <option value="">— Select Tier —</option>
          <option value="starter">Starter</option>
          <option value="growth">Growth</option>
          <option value="pro">Pro</option>
        </select>
        <div class="tier-info" id="tierInfo" style="display:none;">
          <span class="tier-pill" id="tierPill"></span>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="monthlyFee">Monthly Fee</label>
          <input type="text" id="monthlyFee" readonly placeholder="Auto-filled" />
        </div>
        <div class="field">
          <label for="setupFee">Setup Fee</label>
          <input type="text" id="setupFee" readonly placeholder="Auto-filled" />
        </div>
      </div>

      <!-- TERM -->
      <div class="section-label">Contract Term</div>

      <div class="field">
        <label for="startDate">Start Date</label>
        <input type="date" id="startDate" />
      </div>

      <div class="field">
        <label for="contractTerm">Contract Term</label>
        <select id="contractTerm">
          <option value="month">Month-to-Month</option>
          <option value="6month">6 Months</option>
          <option value="annual">Annual (12 Months)</option>
        </select>
      </div>

      <button class="btn-generate" onclick="generateAgreement()">Generate Service Agreement</button>

    </div>
  </aside>

  <!-- =====================================================
       RIGHT: PREVIEW PANEL
  ===================================================== -->
  <main class="preview-panel">
    <div class="preview-toolbar">
      <div class="toolbar-left">
        <span class="preview-label">Agreement Preview</span>
        <span class="agreement-num" id="agreementNumBadge">—</span>
      </div>
      <button class="btn-print" onclick="window.print()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
        </svg>
        Print / Save as PDF
      </button>
    </div>

    <div class="preview-scroll" id="previewScroll">
      <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 2H6C4.9 2 4 2.9 4 4v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" fill="currentColor"/>
        </svg>
        <p>Fill in the form and click<br><strong>Generate Service Agreement</strong></p>
      </div>
      <div id="agreementContainer" style="display:none;"></div>
    </div>
  </main>

</div>

<!-- =====================================================
     JAVASCRIPT
===================================================== -->
<script>
  // ── Tier data ──────────────────────────────────────────
  const TIERS = {
    starter: {
      label: 'Starter',
      monthly: 497,
      setup: 997,
      description: 'AI Automation Starter Package — includes up to 3 Make.com automation scenarios, Freshchat AI chat bot configuration, basic email automation sequences, monthly performance reporting, and standard support (business hours, 48-hr response SLA).',
      scenarios: 3,
      included: [
        'Up to 3 Make.com automation scenarios',
        'Freshchat AI chat bot setup and configuration',
        'Basic email automation sequences (up to 3 flows)',
        'Monthly performance report',
        'Standard support — business hours, 48-hr SLA'
      ]
    },
    growth: {
      label: 'Growth',
      monthly: 997,
      setup: 1497,
      description: 'AI Automation Growth Package — includes up to 8 Make.com automation scenarios, advanced Freshchat AI chat bot with custom intents and escalation routing, full email automation suite, CRM integration, bi-weekly performance reporting, and priority support (priority queue, 24-hr SLA).',
      scenarios: 8,
      included: [
        'Up to 8 Make.com automation scenarios',
        'Advanced Freshchat AI bot with custom intents and escalation routing',
        'Full email automation suite (unlimited flows)',
        'CRM integration (HubSpot, Salesforce, or equivalent)',
        'Bi-weekly performance reporting',
        'Priority support — priority queue, 24-hr SLA'
      ]
    },
    pro: {
      label: 'Pro',
      monthly: 1997,
      setup: 2497,
      description: 'AI Automation Pro Package — includes unlimited Make.com automation scenarios, fully custom AI chat bot with multi-channel deployment, complete email and SMS automation platform, advanced CRM and third-party integrations, weekly strategy sessions, dedicated account manager, and enterprise support (dedicated channel, 4-hr SLA).',
      scenarios: 'Unlimited',
      included: [
        'Unlimited Make.com automation scenarios',
        'Fully custom AI chat bot with multi-channel deployment',
        'Complete email and SMS automation platform',
        'Advanced CRM and third-party integrations',
        'Weekly strategy sessions and quarterly business reviews',
        'Dedicated account manager',
        'Enterprise support — dedicated channel, 4-hr SLA'
      ]
    }
  };

  // ── Agreement number (auto from localStorage) ──────────
  function getNextAgreementNum() {
    const key = 'cwi_agreement_counter';
    const current = parseInt(localStorage.getItem(key) || '1000', 10);
    const next = current + 1;
    localStorage.setItem(key, next);
    return 'CWI-SA-' + next;
  }

  // ── Fill tier auto-data ─────────────────────────────────
  function fillTierData() {
    const tier = document.getElementById('tier').value;
    const info = TIERS[tier];
    const feeEl = document.getElementById('monthlyFee');
    const setupEl = document.getElementById('setupFee');
    const tierInfoEl = document.getElementById('tierInfo');
    const tierPillEl = document.getElementById('tierPill');

    if (!info) {
      feeEl.value = '';
      setupEl.value = '';
      tierInfoEl.style.display = 'none';
      return;
    }

    feeEl.value = '$' + info.monthly.toLocaleString() + '/mo';
    setupEl.value = '$' + info.setup.toLocaleString();
    tierPillEl.textContent = info.label + ' Tier';
    tierInfoEl.style.display = 'flex';
  }

  // ── Format currency ─────────────────────────────────────
  function fmt(n) {
    return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // ── Format date ─────────────────────────────────────────
  function fmtDate(dateStr) {
    if (!dateStr) return '_______________';
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  // ── Term label ──────────────────────────────────────────
  function termLabel(val) {
