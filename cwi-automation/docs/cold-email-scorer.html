<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cold Email Scorer — CWI</title>
<meta name="description" content="Score your cold email copy across 8 outreach criteria and get instant, specific improvement suggestions.">
<link rel="icon" type="image/png" href="../assets/cwi-favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0A0C;--ink-2:#0E0E11;--surface:#141418;--surface-2:#191920;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.14);--accent:#FF5A1F;--ember:#FF8A3D;--steel:#85858E;--text:#F4F4F6;--text-dim:#C2C2C8;--font-disp:'Sora',sans-serif;--font-body:'Instrument Sans',sans-serif;--r-sm:12px;--r-md:18px;--r-pill:999px;--ease:cubic-bezier(.22,.61,.36,1);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--ink);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh;padding:0 0 64px;}
h1,h2,h3,h4,h5,h6{font-family:var(--font-disp);letter-spacing:-.03em;line-height:1.15;font-weight:800;color:var(--text);}
a{color:var(--accent);text-decoration:none;}
p{color:var(--text-dim);line-height:1.65;}
ul,ol{color:var(--text-dim);padding-left:1.4em;}
li{margin-bottom:6px;}
/* Layout */
.wrap{max-width:960px;margin:0 auto;padding:0 24px;}
.container{max-width:900px;margin:0 auto;padding:0 24px;}
/* Topbar */
.topbar{border-bottom:1px solid var(--line);background:rgba(10,10,12,.9);backdrop-filter:blur(14px);position:sticky;top:0;z-index:100;padding:14px 0;}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:960px;margin:0 auto;padding:0 24px;}
.logo{font-family:var(--font-disp);font-weight:800;font-size:17px;letter-spacing:-.04em;display:flex;align-items:center;gap:8px;color:var(--text);}
.logo .dot{color:var(--accent);}
.back-link{font-size:13px;color:var(--steel);display:flex;align-items:center;gap:5px;transition:color .2s;}
.back-link:hover{color:var(--text);}
/* Hero */
.page-header,.hero{padding:52px 0 32px;text-align:center;}
.page-header .logo-block,.hero .logo-block{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-disp);font-size:20px;font-weight:800;margin-bottom:10px;color:var(--accent);}
.kicker,.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--steel);margin-bottom:16px;}
.pip{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.hero h1,.page-title{font-size:clamp(26px,3.5vw,44px);margin-bottom:12px;}
.hero p,.page-subtitle{font-size:clamp(14px,1.5vw,16px);color:var(--text-dim);max-width:52ch;margin:0 auto;}
/* Cards & panels */
.card,.panel,.form-card,.section-card,.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;margin-bottom:24px;}
.card:hover,.panel:hover{border-color:var(--line-2);}
/* Form elements */
label,.form-label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);display:block;margin-bottom:6px;}
input,select,textarea,.form-control{width:100%;background:var(--ink-2);border:1.5px solid var(--line-2);border-radius:var(--r-sm);padding:10px 14px;font-size:14px;font-family:var(--font-body);color:var(--text);outline:none;transition:border-color .2s;box-sizing:border-box;}
input:focus,select:focus,textarea:focus,.form-control:focus{border-color:var(--accent);background:var(--surface);}
textarea{resize:vertical;min-height:96px;}
select option{background:var(--surface);color:var(--text);}
/* Form layout */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.form-group,.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.form-group.full,.field.full{grid-column:1/-1;}
/* Buttons */
.btn,.btn-primary,.btn-generate,.btn-action{font-family:var(--font-body);font-size:14px;font-weight:600;padding:11px 24px;border-radius:var(--r-pill);border:1.5px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:all .22s var(--ease);display:inline-flex;align-items:center;gap:8px;text-decoration:none;}
.btn:hover,.btn-primary:hover,.btn-generate:hover,.btn-action:hover{background:var(--ember);border-color:var(--ember);box-shadow:0 0 22px rgba(255,90,31,.35);}
.btn-outline,.btn-ghost,.btn-secondary{background:rgba(255,90,31,.1);border-color:var(--accent);color:var(--text);}
.btn-outline:hover,.btn-ghost:hover,.btn-secondary:hover{background:var(--accent);color:#fff;}
.btn-sm{padding:8px 16px;font-size:13px;}
/* Tables */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:32px;}
table{width:100%;border-collapse:collapse;}
thead{background:var(--surface-2);}
th{font-family:var(--font-disp);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);}
td{font-size:14px;color:var(--text-dim);padding:11px 16px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
/* Badges / tags */
.badge,.tag{display:inline-block;padding:3px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:600;background:rgba(255,90,31,.12);color:var(--accent);border:1px solid rgba(255,90,31,.25);}
.badge.green,.tag.green{background:rgba(74,222,128,.12);color:#4ade80;border-color:rgba(74,222,128,.25);}
.badge.red,.tag.red{background:rgba(248,113,113,.12);color:#f87171;border-color:rgba(248,113,113,.25);}
/* Sections */
.section{padding:40px 0 0;}
.section-title{font-family:var(--font-disp);font-size:20px;font-weight:700;margin-bottom:18px;color:var(--text);}
.section-title span,.acc{color:var(--accent);}
/* Output/preview areas */
.output-area,.preview,.result-card,.output-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;margin-top:24px;}
/* Dividers */
hr,.rule,.divider{border:none;border-top:1px solid var(--line);margin:32px 0;}
/* Checklist items */
.check-item{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
.check-item:last-child{border-bottom:none;}
.check-item input[type="checkbox"]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;}
/* Lists */
.list-item{padding:12px 0;border-bottom:1px solid var(--line);color:var(--text-dim);}
.list-item:last-child{border-bottom:none;}
/* Stats / KPI */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:28px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px 22px;}
.stat-label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin-bottom:8px;}
.stat-value{font-family:var(--font-disp);font-size:30px;font-weight:800;color:var(--text);}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:11px 22px;font-size:14px;color:var(--text);transition:transform .3s var(--ease),opacity .3s;opacity:0;z-index:999;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
/* Footer */
.footer{border-top:1px solid var(--line);padding:24px 0;text-align:center;font-size:13px;color:var(--steel);margin-top:64px;}
.footer a{color:var(--accent);}
/* Responsive */
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}.card,.panel,.form-card{padding:20px 16px;}.stat-grid{grid-template-columns:1fr 1fr;}}

/* ── Tool-specific styles ── */

/* Input section */
.input-section {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 32px;
  margin-top: -24px;
  position: relative;
  z-index: 2;
}

/* Field label override for this tool's class */
.field-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--steel);
  text-transform: uppercase;
  letter-spacing: .1em;
  margin-bottom: 8px;
  display: block;
}

.field-group { margin-bottom: 20px; }

/* Textarea override */
textarea { min-height: 220px; line-height: 1.6; }

/* Char count */
.char-count {
  text-align: right;
  font-size: 12px;
  color: var(--steel);
  margin-top: 5px;
}
.char-count.over { color: #f87171; font-weight: 600; }

/* Score button */
.btn-score {
  display: block;
  width: 100%;
  padding: 16px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--r-pill);
  font-size: 17px;
  font-weight: 700;
  font-family: var(--font-body);
  cursor: pointer;
  letter-spacing: -0.2px;
  transition: background 0.18s, transform 0.12s, box-shadow 0.18s;
  box-shadow: 0 4px 14px rgba(255,90,31,0.35);
}
.btn-score:hover {
  background: var(--ember);
  box-shadow: 0 6px 20px rgba(255,90,31,0.45);
  transform: translateY(-1px);
}
.btn-score:active { transform: translateY(0); }

/* Results */
#results { display: none; margin-top: 28px; }

/* Score hero block */
.score-hero {
  background: var(--surface-2);
  border: 1px solid var(--line-2);
  border-radius: var(--r-md);
  padding: 32px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}

.total-score-wrap { text-align: center; flex-shrink: 0; }

.total-score-ring {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 5px solid var(--accent);
  margin: 0 auto 10px;
  background: rgba(255,90,31,0.08);
}

.total-score-ring .num {
  font-size: 32px;
  font-weight: 800;
  color: var(--text);
  line-height: 1;
  font-family: var(--font-disp);
}

.total-score-ring .denom {
  font-size: 13px;
  color: var(--steel);
  margin-top: 2px;
}

.grade-badge {
  display: inline-block;
  background: var(--accent);
  color: #fff;
  font-size: 28px;
  font-weight: 800;
  font-family: var(--font-disp);
  width: 52px;
  height: 52px;
  border-radius: 10px;
  line-height: 52px;
  text-align: center;
}

.score-summary { flex: 1; min-width: 200px; }

.score-summary h3 {
  color: var(--text);
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 6px;
  font-family: var(--font-disp);
}

.score-summary p {
  color: var(--text-dim);
  font-size: 14px;
  line-height: 1.6;
  max-width: 380px;
}

.grade-label { color: var(--accent); font-weight: 700; }

/* Criteria grid */
.criteria-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 16px;
  margin-top: 20px;
}

.criterion-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 20px;
  border-left: 4px solid var(--line-2);
}

.criterion-card.good { border-left-color: #4ade80; }
.criterion-card.mid  { border-left-color: #facc15; }
.criterion-card.bad  { border-left-color: #f87171; }

.crit-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  gap: 10px;
}

.crit-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 7px;
}

.crit-icon { font-size: 16px; }

.crit-score {
  font-size: 18px;
  font-weight: 800;
  color: var(--text);
  flex-shrink: 0;
  font-family: var(--font-disp);
}

.crit-score .max { font-size: 12px; color: var(--steel); font-weight: 400; }

.progress-track {
  height: 8px;
  background: var(--surface-2);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 10px;
}

.progress-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.7s cubic-bezier(0.22,0.61,0.36,1);
  width: 0;
}

.progress-fill.good { background: #4ade80; }
.progress-fill.mid  { background: #facc15; }
.progress-fill.bad  { background: #f87171; }

.crit-feedback {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.5;
}

/* Improvement tip */
.improvement-tip {
  margin-top: 8px;
  padding: 9px 12px;
  background: rgba(255,90,31,.08);
  border: 1px solid rgba(255,90,31,.2);
  border-radius: var(--r-sm);
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.5;
  display: none;
}

.improvement-tip.show { display: block; }

.improvement-tip strong {
  display: block;
  margin-bottom: 2px;
  color: var(--accent);
}

/* Suggestions panel */
#suggestions-panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 24px 28px;
  margin-top: 20px;
  display: none;
}

#suggestions-panel h4 {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
  font-family: var(--font-disp);
}

.suggestion-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.suggestion-list li {
  padding: 12px 16px;
  background: var(--surface-2);
  border-radius: var(--r-sm);
  font-size: 14px;
  line-height: 1.55;
  border-left: 3px solid var(--accent);
  color: var(--text-dim);
}

.suggestion-list li::before {
  content: attr(data-n) ". ";
  font-weight: 700;
  color: var(--accent);
}

/* Retry button */
.btn-retry {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 20px;
  padding: 10px 22px;
  background: transparent;
  border: 2px solid var(--accent);
  color: var(--accent);
  border-radius: var(--r-pill);
  font-size: 14px;
  font-weight: 700;
  font-family: var(--font-body);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.btn-retry:hover { background: var(--accent); color: #fff; }

.section-divider {
  text-align: center;
  margin: 28px 0 0;
  font-size: 13px;
  color: var(--steel);
}

@media (max-width: 600px) {
  .input-section { padding: 22px 18px; }
  .criteria-grid { grid-template-columns: 1fr; }
  .score-hero { flex-direction: column; text-align: center; }
  .score-summary p { max-width: 100%; }
}
</style>
</head>
<body>

<div class="bg-field" style="position:fixed;inset:0;z-index:-1;pointer-events:none;"><div style="position:absolute;inset:0;background:radial-gradient(720px 460px at 82% -6%,rgba(255,90,31,.09),transparent 60%),radial-gradient(620px 520px at 6% 8%,rgba(255,90,31,.04),transparent 60%);"></div></div>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="4" y="10" width="4" height="12" rx="2" fill="#FF5A1F"/><rect x="10" y="6" width="4" height="20" rx="2" fill="#FF5A1F" opacity=".85"/><rect x="16" y="2" width="4" height="28" rx="2" fill="#FF5A1F" opacity=".7"/><rect x="22" y="6" width="4" height="20" rx="2" fill="#FF5A1F" opacity=".55"/></svg>
      CWI <span class="dot">·</span> Cold Email Scorer
    </div>
    <a class="back-link" href="../index.html">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2L3 7l5 5"/><line x1="3" y1="7" x2="12" y2="7"/></svg>
      Back
    </a>
  </div>
</header>

<div class="hero">
  <h2>Score Your <span style="color:var(--accent);">Cold Email</span> Copy</h2>
  <p>Paste your subject line and body below. Get an instant score across 8 outreach criteria with specific improvement suggestions.</p>
</div>

<div class="container">
  <div class="input-section">
    <div class="field-group">
      <label class="field-label" for="subject-input">Subject Line</label>
      <input type="text" id="subject-input" placeholder="e.g. Quick question about your sales follow-up process" />
    </div>
    <div class="field-group">
      <label class="field-label" for="body-input">Email Body</label>
      <textarea id="body-input" placeholder="Paste your email body here..."></textarea>
      <div class="char-count" id="char-count">0 words</div>
    </div>
    <button class="btn-score" id="score-btn" onclick="scoreEmail()">Score My Email</button>

    <div id="results">
      <div class="score-hero" id="score-hero-block">
        <div class="total-score-wrap">
          <div class="total-score-ring">
            <span class="num" id="total-num">0</span>
            <span class="denom">/ 80</span>
          </div>
          <div class="grade-badge" id="grade-badge">—</div>
        </div>
        <div class="score-summary">
          <h3 id="score-headline">Your Score</h3>
          <p id="score-description"></p>
        </div>
      </div>

      <div class="criteria-grid" id="criteria-grid"></div>

      <div id="suggestions-panel">
        <h4>&#128161; Priority Improvements</h4>
        <ul class="suggestion-list" id="suggestion-list"></ul>
      </div>

      <div class="section-divider">
        <button class="btn-retry" onclick="resetTool()">&#8635; Score Another Email</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── Example email pre-loaded ──────────────────────────────────────────
const EXAMPLE_SUBJECT = "Helping [Company] automate your client follow-up";
const EXAMPLE_BODY = `Hi [First Name],

I noticed [Company] is in the mortgage space — a lot of brokers we talk to are losing deals because their follow-up falls through the cracks after the first call.

We've helped firms like Pacific Lending cut their no-response rate by 40% using AI-driven follow-up sequences that run automatically.

I'd love to show you a 15-minute demo this week. Does Thursday or Friday work for a quick call?

— Brian
CWI AI`;

// ── Scoring criteria definitions ──────────────────────────────────────
const CRITERIA = [
  {
    id: "subject_clarity",
    name: "Subject Line Clarity",
    icon: "📋",
    max: 10,
    score: scoreSubjectClarity,
    passThreshold: 7
  },
  {
    id: "personalization",
    name: "Personalization",
    icon: "🎯",
    max: 10,
    score: scorePersonalization,
    passThreshold: 7
  },
  {
    id: "pain_point",
    name: "Pain Point Clarity",
    icon: "⚡",
    max: 10,
    score: scorePainPoint,
    passThreshold: 7
  },
  {
    id: "social_proof",
    name: "Social Proof",
    icon: "🏆",
    max: 10,
    score: scoreSocialProof,
    passThreshold: 7
  },
  {
    id: "cta",
    name: "CTA Strength",
    icon: "📅",
    max: 10,
    score: scoreCTA,
    passThreshold: 7
  },
  {
    id: "length",
    name: "Length",
    icon: "📏",
    max: 10,
    score: scoreLength,
    passThreshold: 7
  },
  {
    id: "tone",
    name: "Tone (Conversational)",
    icon: "💬",
    max: 10,
    score: scoreTone,
    passThreshold: 7
  },
  {
    id: "spam",
    name: "Spam Word Avoidance",
    icon: "🚫",
    max: 10,
    score: scoreSpam,
    passThreshold: 7
  }
];

// ── Scoring functions ─────────────────────────────────────────────────

function wordCount(text) {
  return text.trim().split(/\s+/).filter(w => w.length > 0).length;
}

function lower(text) { return text.toLowerCase(); }

function scoreSubjectClarity(subject, body) {
  let s = 5;
  const sub = lower(subject);
  const words = subject.trim().split(/\s+/).length;

  if (words === 0) return { score: 0, note: "No subject line entered.", tip: "Write a specific subject line that references what you can do for this person." };

  // Specific keywords that suggest concrete value
  const specificTerms = [
    /\d+/, // contains a number
    /automat/i, /save|saving/i, /cut|cutting/i, /reduc/i, /increas/i,
    /help.*with/i, /question about/i, /idea for/i, /quick.*question/i,
    /follow.?up/i, /introduc/i
  ];
  const vagueTerms = [
    /touching base/i, /checking in/i, /hello/i, /hi there/i,
    /opportunity/i, /partnership/i, /synergy/i, /exciting/i
  ];

  specificTerms.forEach(re => { if (re.test(subject)) s += 0.7; });
  vagueTerms.forEach(re => { if (re.test(sub)) s -= 1.5; });

  if (words < 4) s -= 2;
  if (words > 14) s -= 1.5;
  if (/\[.*?\]/.test(subject)) s -= 0.5; // unfilled placeholder

  s = Math.max(0, Math.min(10, Math.round(s * 10) / 10));

  let note, tip;
  if (s >= 7) {
    note = "Subject line is specific and likely to get opens.";
  } else if (s >= 4) {
    note = "Subject is somewhat clear but could be more specific.";
    tip = "Replace vague phrases with a concrete outcome or reference. Example: \"Cut [Company]'s no-response rate by 30%\" outperforms \"Touching base about a partnership\".";
  } else {
    note = "Subject is too vague or generic — likely to be ignored.";
    tip = "Lead with a specific problem or result. Include a number or the prospect's company/industry. Avoid words like \"opportunity\" or \"touching base\".";
  }

  return { score: s, note, tip };
}

function scorePersonalization(subject, body) {
  const full = subject + " " + body;
  let s = 3;

  const personalSignals = [
    { re: /\[.*?(name|first|company|firm|co\b).*?\]/i, pts: -1, label: "unfilled placeholder" },
    { re: /\b(your|you've|you're|you )\b/gi, pts: 1.2, label: "direct address" },
    { re: /\bi noticed\b|\bi saw\b|\bi came across\b/i, pts: 2, label: "observation hook" },
    { re: /\b(mortgage|insurance|real estate|legal|medical|saas|fintech|agency|broker)/i, pts: 1.5, label: "industry mention" },
    { re: /\b(your team|your business|your company|your firm|your process|your clients)\b/i, pts: 1.5, label: "company reference" },
    { re: /congrat/i, pts: 1, label: "personalization hook" },
    { re: /\bhiring\b|\brecently\b|\bjust (launched|raised|opened)/i, pts: 1.5, label: "trigger event" },
  ];

  personalSignals.forEach(({ re, pts }) => {
    const matches = (full.match(re) || []).length;
    if (matches > 0) s += pts;
  });

  // Unfilled placeholders hurt
  const placeholders = (full.match(/\[.*?\]/g) || []).length;
  s -= placeholders * 1.2;

  s = Math.max(0, Math.min(10, Math.round(s * 10) / 10));

  let note, tip;
  if (s >= 7) {
    note = "Good personalization signals present.";
  } else if (s >= 4) {
    note = "Some personalization but reads slightly generic.";
    tip = "Add an observation hook: \"I noticed [Company] recently expanded to...\" or reference the prospect's specific role or industry challenge.";
  } else {
    note = "Email feels like a mass blast — no clear personalization.";
    tip = "Start with something specific: their company name, a trigger event, a recent post they published, or a pain specific to their industry. Generic openers get deleted.";
  }

  return { score: s, note, tip };
}

function scorePainPoint(subject, body) {
  let s = 3;

  // Look at first two sentences of body
  const firstTwo = body.split(/[.!?]+/).slice(0, 2).join(" ");
  const full = lower(subject + " " + body);
  const firstLower = lower(firstTwo);

  const painWords = [
    /losing|lost/i, /miss(ing)?/i, /problem|issue|struggle|pain/i,
    /fall.?through/i, /no.response/i, /chasing/i, /manual/i,
    /slow|delay/i, /overwhelm/i, /inconsisten/i, /leak/i, /cost.*more/i,
    /not.*enough/i, /behind/i, /frustrat/i, /broken/i, /inefficien/i
  ];

  painWords.forEach(re => {
    if (re.test(firstLower)) s += 1.5;
  });

  // Pain in subject line too
  painWords.forEach(re => {
    if (re.test(lower(subject))) s += 0.5;
  });

  if (!firstLower.trim()) s = 0;

  s = Math.max(0, Math.min(10, Math.round(s * 10) / 10));

  let note, tip;
  if (s >= 7) {
    note = "Pain point is clearly named upfront — good hook.";
  } else if (s >= 4) {
    note = "A pain is implied but not stated sharply enough.";
    tip = "Name the problem explicitly in your opening line. \"A lot of [role]s tell us they're losing deals because X\" is stronger than hinting at it.";
  } else {
    note = "No clear pain point in the first two sentences.";
    tip = "Open with the problem your prospect feels every day. Don't start with \"I\" or your company name — lead with their world and what's costing them.";
  }

  return { score: s, note, tip };
}

function scoreSocialProof(subject, body) {
  let s = 2;
  const full = lower(subject + " " + body);

  const proofSignals = [
    { re: /\d+\s*%/, pts: 3 },          // percentage result
    { re: /\d+x\b/, pts: 2.5 },          // multiplier
    { re: /helped\s+\w/, pts: 1.5 },     // "helped [company/role]"
    { re: /client|customer|partner/i, pts: 1 },
    { re: /case study|case-study/i, pts: 1.5 },
    { re: /result/i, pts: 1 },
    { re: /saved|cut|reduced|increased|grew|generated/i, pts: 1.2 },
    { re: /in\s+\d+\s+(days?|weeks?|months?)/i, pts: 1 }, // timeframe
    { re: /like\s+[A-Z][a-z]/, pts: 1 }, // "like [Company]"
  ];

  proofSignals.forEach(({ re, pts }) => {
    if (re.test(full)) s += pts;
  });

  s = Math.max(0, Math.min(10, Math.round(s * 10) / 10));

  let note, tip;
  if (s >= 7) {
    note = "Strong social proof with specific results.";
  } else if (s >= 4) {
    note = "Some proof present but lacks specificity.";
    tip = "Add a specific metric: \"We helped a mortgage brokerage cut their no-response rate by 40% in 6 weeks.\" Named clients or percentages convert far better than vague claims.";
  } else {
    note = "No social proof — prospect has no reason to trust your claim.";
    tip = "Include at least one specific result with a number. If you lack data, name a recognizable client or a specific outcome (\"saved 5 hours/week\"). Vague claims are ignored.";
  }

  return { score: s, note, tip };
}

function scoreCTA(subject, body) {
  let s = 4;
  const b = lower(body);

  // Weak CTAs
  const weakCTAs = [
    /let me know/i, /feel free/i, /reach out/i, /get in touch/i,
    /happy to chat/i, /love to connect/i, /thoughts\?/i,
    /would love to discuss/i, /open to a conversation/i
  ];

  // Strong CTAs
  const strongCTAs = [
    { re: /\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i, pts: 2 },
    { re: /\d+\s*(minute|min)\b/i, pts: 2 },
    { re: /this (week|thursday|friday)/i, pts: 1.5 },
    { re: /\b(demo|call|chat|meeting|session)\b/i, pts: 1 },
    { re: /does\s+.+\s+work\?/i, pts: 2.5 },
    { re: /\b(book|schedule|grab)\b/i, pts: 1.5 },
    { re: /calendly|cal\.com/i, pts: 1 },
    { re: /\?$/, pts: 0.5 },  // ends with a question
  ];

  // Penalize multiple CTAs
  const ctaCount = (b.match(/\?/g) || []).length;
  if (ctaCount > 3) s -= 2;

  weakCTAs.forEach(re => { if (re.test(b)) s -= 1.5; });
  strongCTAs.forEach(({ re, pts }) => { if (re.test(b)) s += pts; });

  s = Math.max(0, Math.min(10, Math.round(s * 10) / 10));

  let note, tip;
  if (s >= 7) {
    note = "Strong, specific CTA with a clear single ask.";
  } else if (s >= 4) {
    note = "CTA present but could be sharper or more specific.";
    tip = "Replace soft closes with a time-specific ask: \"Does Thursday at 2pm or Friday morning work for a 15-minute call?\" Give them two options to choose from.";
  } else {
    note = "Weak or missing CTA — prospect doesn't know what to do.";
    tip = "End with ONE clear ask that proposes a specific time. \"Does [Day] or [Day] work for a quick call?\" outperforms \"Let me know if you're interested\" every time.";
  }

  return { score: s, note, tip };
}

function scoreLength(subject, body) {
  const wc = wordCount(body);
  let s, note, tip;

  if (wc === 0) {
    return { score: 0, note: "No body text entered.", tip: "Write your email body and paste it in." };
  } else if (wc <= 150) {
    s = 10;
    note = `${wc} words — concise and scannable. ✓`;
  } else if (wc <= 200) {
    s = 8;
    note = `${wc} words — good length, slightly trim if possible.`;
  } else if (wc <= 250) {
    s = 6;
    note = `${wc} words — getting long; prospects may skim past the CTA.`;
    tip = "Aim for under 150 words. Cut any sentence that doesn't directly support your pain point or CTA. Remove pleasantries and background about your company.";
  } else if (wc <= 350) {
    s = 4;
    note = `${wc} words — too long for a cold email.`;
    tip = "Cold emails over 250 words get low reply rates. Cut your origin story, over-explained features, and any \"I just wanted to reach out\" fluff. Strip to: hook + proof + CTA.";
  } else {
    s = 2;
    note = `${wc} words — far too long; will not be read.`;
    tip = "This reads like a proposal, not a cold email. Ruthlessly cut to under 150 words. If you need to share more detail, link to a one-pager instead.";
  }

  return { score: s, note, tip };
}

function scoreTone(subject, body) {
  let s = 8;
  const full = lower(subject + " " + body);

  const buzzwords = [
    "leverage", "synergy", "world-class", "best-in-class", "cutting-edge",
    "innovative", "disruptive", "holistic", "paradigm", "solution-oriented",
    "game-changer", "game changer", "revolutionary", "robust", "seamlessly",
    "proactive", "scalable solutions", "dynamic", "empower", "transformative",
    "bleeding edge", "leading provider", "industry-leading", "utilize",
    "facilitate", "actionable insights", "move the needle", "at the end of the day",
    "circle back", "deep dive", "bandwidth", "boil the ocean"
  ];

  const salesyPhrases = [
    /\bi am writing to/i, /\bI hope this (email|message) finds you well/i,
    /\ballow me to introduce/i, /\bI wanted to reach out/i,
    /\bplease don't hesitate/i, /\bas per my (last|previous)/i,
    /\bto whom it may concern/i, /\bdear (sir|madam)/i
  ];

  let buzzHits = 0;
  buzzwords.forEach(word => {
    if (full.includes(word)) buzzHits++;
  });

  let salesyHits = 0;
  salesyPhrases.forEach(re => { if (re.test(full)) salesyHits++; });

  s -= buzzHits * 1.8;
  s -= salesyHits * 2;

  // Reward conversational signals
  if (/\byou\b/gi.test(full)) s += 0.5;
  if (/\?/.test(full)) s += 0.3;
  if (wordCount(body) > 0 && /\b(we|I)\b/gi.test(full)) {
    const youCount = (full.match(/\byou\b/gi) || []).length;
    const iCount = (full.match(/\b(I|we)\b/gi) || []).length;
    if (youCount > iCount) s += 0.5;
  }

  s = Math.max(0, Math.min(10, Math.round(s * 10) / 10));

  let note, tip;
  const hits = [...buzzwords.filter(w => full.includes(w))];
  if (s >= 7) {
    note = "Tone is conversational and direct.";
  } else if (s >= 4) {
    note = "Some salesy language detected: " + (hits.slice(0, 3).join(", ") || "cliche phrases") + ".";
    tip = "Remove buzzwords like \"" + hits.slice(0, 2).join("\", \"") + "\". Write like you'd talk to a colleague — short sentences, plain words.";
  } else {
    note = "Heavily salesy or corporate tone detected.";
    tip = "Delete every buzzword and formal phrase. Read your email out loud — if you wouldn't say it in a coffee conversation, cut it. Plain language always wins in cold email.";
  }

  return { score: s, note, tip };
}

function scoreSpam(subject, body) {
  let s = 10;
  const full = lower(subject + " " + body);

  const spamWords = [
    "free", "guaranteed", "click here", "urgent", "act now",
    "limited time", "limited offer", "don't miss", "don't miss out",
    "buy now", "order now", "special offer", "winner", "you've been selected",
    "congratulations", "earn money", "make money", "no obligation",
    "100% free", "risk-free", "risk free", "no cost", "zero cost",
    "cash", "prize", "credit card", "loan", "apply now", "subscribe now",
    "unsubscribe", "opt-in", "opt in", "this is not spam",
    "dear friend", "dear sir", "dear madam"
  ];

  const capsCheck = (body.match(/[A-Z]{3,}/g) || []).length;
  const exclCheck = (body.match(/!/g) || []).length;

  let hitWords = [];
  spamWords.forEach(word => {
    if (full.includes(word)) {
      hitWords.push(word);
      s -= 2.5;
    }
  });

  if (capsCheck > 2) s -= 1.5;
  if (exclCheck > 2) s -= 1;

  s = Math.max(0, Math.min(10, Math.round(s * 10) / 10));

  let note, tip;
  if (s >= 8) {
    note = "No major spam triggers detected.";
  } else if (s >= 5) {
    note = "Some spam-trigger words found: " + hitWords.slice(0, 3).join(", ") + ".";
    tip = "Remove words like \"" + hitWords.slice(0, 2).join("\", \"") + "\". These trigger spam filters and reduce trust with prospects.";
  } else {
    note = "Multiple spam triggers detected — email may not reach the inbox.";
    tip = "Rewrite to remove all spam trigger words: " + hitWords.join(", ") + ". Also reduce ALL CAPS usage and exclamation points.";
  }

  return { score: s, note, tip };
}

// ── Grade logic ───────────────────────────────────────────────────────
function getGrade(total) {
  if (total >= 72) return { grade: "A", label: "Excellent", desc: "Your email is sharp, specific, and ready to send. Expect above-average reply rates." };
  if (total >= 64) return { grade: "B", label: "Good",      desc: "Solid email with a few areas to tighten. Fix the flagged issues for better reply rates." };
  if (total >= 52) return { grade: "C", label: "Average",   desc: "Your email will compete with hundreds of others. The improvements below will set it apart." };
  if (total >= 40) return { grade: "D", label: "Below Average", desc: "Significant gaps in personalization, proof, or CTA. Work through each suggestion below." };
  return { grade: "F", label: "Needs Rework", desc: "This email is unlikely to generate replies. Rebuild it using the suggestions below as a checklist." };
}

// ── Color tier ────────────────────────────────────────────────────────
function getTier(score, max) {
  const pct = score / max;
  if (pct >= 0.7) return "good";
  if (pct >= 0.4) return "mid";
  return "bad";
}

// ── Main scoring entry point ──────────────────────────────────────────
function scoreEmail() {
  const subject = document.getElementById("subject-input").value.trim();
  const body = document.getElementById("body-input").value.trim();

  if (!subject && !body) {
    alert("Please enter a subject line and email body before scoring.");
    return;
  }

  const results = CRITERIA.map(c => {
    const res = c.score(subject, body);
    return { ...c, computed: Math.min(c.max, Math.max(0, res.score)), note: res.note, tip: res.tip || null };
  });

  const total = Math.round(results.reduce((sum, r) => sum + r.computed, 0));
  const { grade, label, desc } = getGrade(total);

  // Animate total
  document.getElementById("total-num").textContent = total;
  document.getElementById("grade-badge").textContent = grade;
  document.getElementById("score-headline").textContent = label;
  document.getElementById("score-description").textContent = desc;

  // Color grade badge
  const gb = document.getElementById("grade-badge");
  gb.style.background = grade === "A" ? "#16a34a" : grade === "B" ? "#2563eb" : grade === "C" ? "#d97706" : "#dc2626";

  // Build criteria cards
  const grid = document.getElementById("criteria-grid");
  grid.innerHTML = "";
  results.forEach(r => {
    const tier = getTier(r.computed, r.max);
    const pct = (r.computed / r.max) * 100;
    const card = document.createElement("div");
    card.className = `criterion-card ${tier}`;
    card.innerHTML = `
      <div class="crit-header">
        <div class="crit-name"><span class="crit-icon">${r.icon}</span>${r.name}</div>
        <div class="crit-score">${r.computed.toFixed(1)}<span class="max"> / ${r.max}</span></div>
      </div>
      <div class="progress-track">
        <div class="progress-fill ${tier}" style="width:0%" data-pct="${pct}"></div>
      </div>
      <div class="crit-feedback">${r.note}</div>
      ${r.tip && r.computed < r.passThreshold ? `<div class="improvement-tip show"><strong>Suggestion</strong>${r.tip}</div>` : ""}
    `;
    grid.appendChild(card);
  });

  // Animate progress bars
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      grid.querySelectorAll(".progress-fill").forEach(el => {
        el.style.width = el.dataset.pct + "%";
      });
    });
  });

  // Suggestions panel
  const lowScores = results.filter(r => r.computed < r.passThreshold && r.tip);
  const sugPanel = document.getElementById("suggestions-panel");
  const sugList = document.getElementById("suggestion-list");
  sugList.innerHTML = "";

  if (lowScores.length > 0) {
    lowScores.forEach((r, i) => {
      const li = document.createElement("li");
      li.dataset.n = i + 1;
      li.textContent = `[${r.name}] ${r.tip}`;
      sugList.appendChild(li);
    });
    sugPanel.style.display = "block";
  } else {
    sugPanel.style.display = "none";
  }

  // Show results
  const resultsEl = document.getElementById("results");
  resultsEl.style.display = "block";
  resultsEl.scrollIntoView({ behavior: "smooth", block: "start" });
}

function resetTool() {
  document.getElementById("results").style.display = "none";
  document.getElementById("subject-input").focus();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ── Word count live update ────────────────────────────────────────────
document.getElementById("body-input").addEventListener("input", function() {
  const wc = wordCount(this.value);
  const el = document.getElementById("char-count");
  el.textContent = wc + " words";
  el.className = "char-count" + (wc > 250 ? " over" : "");
});

// ── Pre-load example ──────────────────────────────────────────────────
window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("subject-input").value = EXAMPLE_SUBJECT;
  const bodyEl = document.getElementById("body-input");
  bodyEl.value = EXAMPLE_BODY;
  const wc = wordCount(EXAMPLE_BODY);
  document.getElementById("char-count").textContent = wc + " words";
});
</script>
