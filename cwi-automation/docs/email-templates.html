<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CWI AI — Email Template Library</title>
  <meta name="description" content="CWI internal tool: CWI AI — Email Template Library. Internal use only — CWI Compute With Imagination.">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0A0A0C;
      --surface:  #111115;
      --surface2: #18181e;
      --border:   #2a2a35;
      --accent:   #FF5A1F;
      --accent-h: #ff7040;
      --text:     #e8e8f0;
      --muted:    #7a7a90;
      --white:    #ffffff;
    }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 80px;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 28px 48px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo-mark {
      width: 40px;
      height: 40px;
      background: var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: #fff;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    header p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Page body ── */
    .page-body {
      max-width: 1160px;
      margin: 0 auto;
      padding: 52px 48px 0;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .section-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .section-desc {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 48px;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
      gap: 28px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s;
    }

    .card:hover {
      border-color: #3a3a50;
    }

    .card-header {
      padding: 22px 24px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .card-meta {
      flex: 1;
      min-width: 0;
    }

    .scenario-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(255,90,31,0.15);
      color: var(--accent);
      border: 1px solid rgba(255,90,31,0.3);
      border-radius: 6px;
      padding: 3px 8px;
      margin-bottom: 7px;
    }

    .card-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--white);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-trigger {
      font-size: 12px;
      color: var(--muted);
    }

    .copy-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Sora', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 13px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .copy-btn:hover {
      background: #22222d;
      border-color: var(--accent);
      color: var(--accent);
    }

    .copy-btn.copied {
      background: rgba(255,90,31,0.12);
      border-color: var(--accent);
      color: var(--accent);
    }

    .copy-btn svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    /* ── Preview window ── */
    .preview-wrap {
      padding: 20px 24px 24px;
      flex: 1;
    }

    .preview-chrome {
      border: 1px solid #d0d0d8;
      border-radius: 10px;
      overflow: hidden;
      background: #f2f2f4;
    }

    .preview-chrome-bar {
      background: #e4e4ea;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #d0d0d8;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot-r { background: #ff5f57; }
    .dot-y { background: #febc2e; }
    .dot-g { background: #28c840; }

    .preview-subject {
      margin-left: 8px;
      font-size: 11px;
      color: #555;
      font-family: 'Sora', sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-body {
      overflow: hidden;
      max-height: 420px;
      position: relative;
    }

    .preview-body::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: linear-gradient(transparent, #f2f2f4);
      pointer-events: none;
    }

    .preview-body iframe {
      width: 100%;
      height: 420px;
      border: none;
      display: block;
      background: white;
    }

    /* ── Hidden template sources ── */
    .template-source { display: none; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e1e28;
      border: 1px solid var(--accent);
      color: var(--text);
      font-family: 'Sora', sans-serif;
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 10px;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 999;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 700px) {
      header { padding: 20px 20px; }
      .page-body { padding: 36px 20px 0; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ══════════════ HEADER ══════════════ -->
<header>
  <div class="logo-mark">C</div>
  <div>
    <h1>CWI AI — Email Template Library</h1>

<!-- ══════════════ JAVASCRIPT ══════════════ -->
<script>
  const templates = [
    {
      id: 'tpl-1',
      scenario: 'scenario-h',
      name: 'Welcome Email',
      trigger: 'Sends on: Client onboarding',
      subject: 'Welcome! Here is what happens next'
    },
    {
      id: 'tpl-2',
      scenario: 'scenario-m',
      name: 'Appointment Reminder',
      trigger: 'Sends on: Day before appointment',
      subject: 'Your appointment tomorrow — [Service Name]'
    },
    {
      id: 'tpl-3',
      scenario: 'scenario-a',
      name: 'Booking Confirmation',
      trigger: 'Sends on: Immediately after booking',
      subject: 'Your appointment is confirmed — [Date]'
    },
    {
      id: 'tpl-4',
      scenario: 'scenario-j',
      name: 'Review Request',
      trigger: 'Sends on: After appointment completion',
      subject: 'How did we do? Quick review request'
    },
    {
      id: 'tpl-5',
      scenario: 'scenario-l',
      name: 'No-Show Recovery',
      trigger: 'Sends on: After missed/no-show appointment',
      subject: 'Let us find a better time'
    },
    {
      id: 'tpl-6',
      scenario: 'scenario-b',
      name: 'Missed Follow-Up',
      trigger: 'Sends on: Unresponsive lead after inquiry',
      subject: 'Still thinking it over? We are here to help'
    }
  ];

  const grid = document.getElementById('cardGrid');

  templates.forEach(t => {
    const rawHTML = document.getElementById(t.id).innerHTML.trim();

    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML = `
      <div class="card-header">
        <div class="card-meta">
          <span class="scenario-badge">${t.scenario}</span>
          <div class="card-name">${t.name}</div>
          <div class="card-trigger">${t.trigger}</div>
        </div>
        <button class="copy-btn" data-tpl-id="${t.id}" type="button" aria-label="Copy HTML for ${t.name}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          Copy HTML
        </button>
      </div>
      <div class="preview-wrap">
        <div class="preview-chrome">
          <div class="preview-chrome-bar">
            <span class="dot dot-r"></span>
            <span class="dot dot-y"></span>
            <span class="dot dot-g"></span>
            <span class="preview-subject">${t.subject}</span>
          </div>
          <div class="preview-body">
            <iframe title="Preview: ${t.name}" sandbox="allow-same-origin"></iframe>
          </div>
        </div>
      </div>
    `;

    // Inject HTML into iframe after appending
    grid.appendChild(card);

    const iframe = card.querySelector('iframe');
    iframe.addEventListener('load', () => {}, { once: true });
    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
    iframeDoc.open();
    iframeDoc.write(rawHTML);
    iframeDoc.close();

    // Copy button
    const btn = card.querySelector('.copy-btn');
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(rawHTML).then(() => {
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Copied!
        `;
        showToast();
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            Copy HTML
          `;
        }, 2200);
      }).catch(() => {
        // Fallback for older browsers
        const ta = document.createElement('textarea');
        ta.value = rawHTML;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast();
      });
    });
  });

  const toast = document.getElementById('toast');
  let toastTimer;
  function showToast() {
    clearTimeout(toastTimer);
    toast.classList.add('show');
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }
</script>
</body>
</html>
