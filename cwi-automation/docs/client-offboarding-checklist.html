<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Offboarding Checklist — CWI</title>
<meta name="description" content="Track every step when a CWI client cancels, from immediate actions to archiving and analytics.">
<link rel="icon" type="image/png" href="../assets/cwi-favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0A0C;--ink-2:#0E0E11;--surface:#141418;--surface-2:#191920;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.14);--accent:#FF5A1F;--ember:#FF8A3D;--steel:#85858E;--text:#F4F4F6;--text-dim:#C2C2C8;--font-disp:'Sora',sans-serif;--font-body:'Instrument Sans',sans-serif;--r-sm:12px;--r-md:18px;--r-pill:999px;--ease:cubic-bezier(.22,.61,.36,1);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--ink);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh;padding:0 0 64px;}
h1,h2,h3,h4,h5,h6{font-family:var(--font-disp);letter-spacing:-.03em;line-height:1.15;font-weight:800;color:var(--text);}
a{color:var(--accent);text-decoration:none;}
p{color:var(--text-dim);line-height:1.65;}
ul,ol{color:var(--text-dim);padding-left:1.4em;}
li{margin-bottom:6px;}
/* Layout */
.wrap{max-width:960px;margin:0 auto;padding:0 24px;}
.container{max-width:900px;margin:0 auto;padding:0 24px;}
/* Topbar */
.topbar{border-bottom:1px solid var(--line);background:rgba(10,10,12,.9);backdrop-filter:blur(14px);position:sticky;top:0;z-index:100;padding:14px 0;}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:960px;margin:0 auto;padding:0 24px;}
.logo{font-family:var(--font-disp);font-weight:800;font-size:17px;letter-spacing:-.04em;display:flex;align-items:center;gap:8px;color:var(--text);}
.logo .dot{color:var(--accent);}
.back-link{font-size:13px;color:var(--steel);display:flex;align-items:center;gap:5px;transition:color .2s;}
.back-link:hover{color:var(--text);}
/* Hero */
.page-header,.hero{padding:52px 0 32px;text-align:center;}
.page-header .logo-block,.hero .logo-block{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-disp);font-size:20px;font-weight:800;margin-bottom:10px;color:var(--accent);}
.kicker,.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--steel);margin-bottom:16px;}
.pip{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.hero h1,.page-title{font-size:clamp(26px,3.5vw,44px);margin-bottom:12px;}
.hero p,.page-subtitle{font-size:clamp(14px,1.5vw,16px);color:var(--text-dim);max-width:52ch;margin:0 auto;}
/* Cards & panels */
.card,.panel,.form-card,.section-card,.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;margin-bottom:24px;}
.card:hover,.panel:hover{border-color:var(--line-2);}
/* Form elements */
label,.form-label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);display:block;margin-bottom:6px;}
input,select,textarea,.form-control{width:100%;background:var(--ink-2);border:1.5px solid var(--line-2);border-radius:var(--r-sm);padding:10px 14px;font-size:14px;font-family:var(--font-body);color:var(--text);outline:none;transition:border-color .2s;box-sizing:border-box;}
input:focus,select:focus,textarea:focus,.form-control:focus{border-color:var(--accent);background:var(--surface);}
textarea{resize:vertical;min-height:96px;}
select option{background:var(--surface);color:var(--text);}
/* Form layout */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.form-group,.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.form-group.full,.field.full{grid-column:1/-1;}
/* Buttons */
.btn,.btn-primary,.btn-generate,.btn-action{font-family:var(--font-body);font-size:14px;font-weight:600;padding:11px 24px;border-radius:var(--r-pill);border:1.5px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:all .22s var(--ease);display:inline-flex;align-items:center;gap:8px;text-decoration:none;}
.btn:hover,.btn-primary:hover,.btn-generate:hover,.btn-action:hover{background:var(--ember);border-color:var(--ember);box-shadow:0 0 22px rgba(255,90,31,.35);}
.btn-outline,.btn-ghost,.btn-secondary{background:rgba(255,90,31,.1);border-color:var(--accent);color:var(--text);}
.btn-outline:hover,.btn-ghost:hover,.btn-secondary:hover{background:var(--accent);color:#fff;}
.btn-sm{padding:8px 16px;font-size:13px;}
/* Tables */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:32px;}
table{width:100%;border-collapse:collapse;}
thead{background:var(--surface-2);}
th{font-family:var(--font-disp);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);}
td{font-size:14px;color:var(--text-dim);padding:11px 16px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
/* Badges / tags */
.badge,.tag{display:inline-block;padding:3px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:600;background:rgba(255,90,31,.12);color:var(--accent);border:1px solid rgba(255,90,31,.25);}
.badge.green,.tag.green{background:rgba(74,222,128,.12);color:#4ade80;border-color:rgba(74,222,128,.25);}
.badge.red,.tag.red{background:rgba(248,113,113,.12);color:#f87171;border-color:rgba(248,113,113,.25);}
/* Sections */
.section{padding:40px 0 0;}
.section-title{font-family:var(--font-disp);font-size:20px;font-weight:700;margin-bottom:18px;color:var(--text);}
.section-title span,.acc{color:var(--accent);}
/* Output/preview areas */
.output-area,.preview,.result-card,.output-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;margin-top:24px;}
/* Dividers */
hr,.rule,.divider{border:none;border-top:1px solid var(--line);margin:32px 0;}
/* Checklist items */
.check-item{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
.check-item:last-child{border-bottom:none;}
.check-item input[type="checkbox"]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;}
/* Lists */
.list-item{padding:12px 0;border-bottom:1px solid var(--line);color:var(--text-dim);}
.list-item:last-child{border-bottom:none;}
/* Stats / KPI */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:28px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px 22px;}
.stat-label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin-bottom:8px;}
.stat-value{font-family:var(--font-disp);font-size:30px;font-weight:800;color:var(--text);}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:11px 22px;font-size:14px;color:var(--text);transition:transform .3s var(--ease),opacity .3s;opacity:0;z-index:999;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
/* Footer */
.footer{border-top:1px solid var(--line);padding:24px 0;text-align:center;font-size:13px;color:var(--steel);margin-top:64px;}
.footer a{color:var(--accent);}
/* Responsive */
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}.card,.panel,.form-card{padding:20px 16px;}.stat-grid{grid-template-columns:1fr 1fr;}}

/* Tool-specific styles */
/* Page content wrapper */
.page-content{max-width:760px;margin:32px auto 0;padding:0 24px;}
/* Card title */
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:16px;font-family:var(--font-disp);}
/* Fields grid */
.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field-group{display:flex;flex-direction:column;gap:5px;}
.field-group.full{grid-column:1/-1;}
/* Progress */
.progress-wrapper{max-width:760px;margin:0 auto 20px;padding:0 24px;}
.progress-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.progress-label{font-size:13px;font-weight:600;color:var(--steel);}
.progress-pct{font-size:16px;font-weight:700;color:var(--accent);}
.progress-track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line);}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--ember));border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1);width:0%;}
.progress-fill.complete{background:linear-gradient(90deg,#22c55e,#4ade80);}
/* Section header */
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.section-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,90,31,.12);color:var(--accent);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:4px 12px;border-radius:99px;border:1px solid rgba(255,90,31,.25);font-family:var(--font-disp);}
.section-badge.green{background:rgba(74,222,128,.12);color:#4ade80;border-color:rgba(74,222,128,.25);}
.section-badge.blue{background:rgba(99,179,237,.12);color:#63b3ed;border-color:rgba(99,179,237,.25);}
.section-count{font-size:12px;color:var(--steel);margin-left:auto;}
/* Checklist overrides for this tool */
.checklist{display:flex;flex-direction:column;gap:2px;}
.check-item{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:background .1s;user-select:none;border-bottom:none;}
.check-item:hover{background:rgba(255,255,255,.04);}
.check-item.done{background:rgba(74,222,128,.06);}
.check-item input[type="checkbox"]{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:2px solid var(--line-2);border-radius:6px;flex-shrink:0;margin-top:1px;cursor:pointer;transition:all .15s;position:relative;background:var(--ink-2);}
.check-item input[type="checkbox"]:checked{background:#22c55e;border-color:#22c55e;}
.check-item input[type="checkbox"]:checked::after{content:'';position:absolute;left:5px;top:2px;width:6px;height:10px;border:2px solid #fff;border-top:none;border-left:none;transform:rotate(45deg);}
.check-label{font-size:14px;line-height:1.45;color:var(--text-dim);flex:1;}
.check-item.done .check-label{color:var(--steel);text-decoration:line-through;}
/* Client toolbar */
.client-toolbar{max-width:760px;margin:24px auto 16px;padding:0 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.client-toolbar select{flex:1;min-width:180px;max-width:300px;}
.client-toolbar label{align-self:center;white-space:nowrap;}
/* Danger button */
.btn-danger{background:transparent;color:#f87171;border:1.5px solid rgba(248,113,113,.3);}
.btn-danger:hover{background:rgba(248,113,113,.12);border-color:#f87171;box-shadow:none;}
/* Analytics */
.analytics-card{margin-top:0;}
.analytics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:20px;}
.stat-pill{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:center;}
.stat-pill .stat-num{font-size:1.6rem;font-weight:800;color:var(--accent);line-height:1;font-family:var(--font-disp);}
.stat-pill .stat-label{font-size:11px;color:var(--steel);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.chart-title{font-size:11px;font-weight:700;color:var(--steel);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px;font-family:var(--font-disp);}
.bar-chart{display:flex;flex-direction:column;gap:10px;}
.bar-row{display:flex;align-items:center;gap:12px;}
.bar-reason-label{font-size:13px;color:var(--text-dim);width:160px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;height:22px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line);}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--ember));border-radius:6px;transition:width .6s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;padding-left:8px;min-width:2px;}
.bar-count{font-size:12px;font-weight:700;color:var(--text-dim);margin-left:8px;width:30px;flex-shrink:0;}
.empty-analytics{text-align:center;padding:32px;color:var(--steel);font-size:14px;}
/* Save toast */
.save-toast{position:fixed;bottom:24px;right:24px;background:#22c55e;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 4px 20px rgba(34,197,94,.35);transform:translateY(80px);opacity:0;transition:all .25s cubic-bezier(.4,0,.2,1);z-index:999;pointer-events:none;}
.save-toast.show{transform:translateY(0);opacity:1;}
/* Divider inside card */
.divider{height:1px;background:var(--line);margin:20px 0;border:none;}
/* Card max-width constraint */
.card{max-width:760px;margin-left:auto;margin-right:auto;}
@media(max-width:560px){.fields-grid{grid-template-columns:1fr;}.bar-reason-label{width:100px;font-size:12px;}}
@media print{body{background:#fff;padding:0;color:#000;}.topbar,.btn,.client-toolbar,.save-toast,.bg-field{display:none!important;}.card{box-shadow:none;border:1px solid #ccc;background:#fff;}.check-label,.progress-label,.section-count,.card-title,.chart-title{color:#333;}.check-item.done .check-label{color:#666;}.section-badge{border:1px solid #ccc;color:#333;background:#f5f5f5;}}
</style>
</head>
<body>

<div class="bg-field" style="position:fixed;inset:0;z-index:-1;pointer-events:none;"><div style="position:absolute;inset:0;background:radial-gradient(720px 460px at 82% -6%,rgba(255,90,31,.09),transparent 60%),radial-gradient(620px 520px at 6% 8%,rgba(255,90,31,.04),transparent 60%);"></div></div>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="4" y="10" width="4" height="12" rx="2" fill="#FF5A1F"/><rect x="10" y="6" width="4" height="20" rx="2" fill="#FF5A1F" opacity=".85"/><rect x="16" y="2" width="4" height="28" rx="2" fill="#FF5A1F" opacity=".7"/><rect x="22" y="6" width="4" height="20" rx="2" fill="#FF5A1F" opacity=".55"/></svg>
      CWI <span class="dot">·</span> Client Offboarding Checklist
    </div>
    <a class="back-link" href="../index.html">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2L3 7l5 5"/><line x1="3" y1="7" x2="12" y2="7"/></svg>
      Back
    </a>
  </div>
</header>

<!-- Client Toolbar -->
<div class="client-toolbar">
  <label for="clientSelector" style="font-size:12px;font-weight:600;color:var(--steel);text-transform:uppercase;letter-spacing:0.05em;align-self:center;">Load Client:</label>
  <select id="clientSelector" onchange="loadClient()">
    <option value="">-- New Offboarding --</option>
  </select>
  <button class="btn btn-ghost" onclick="newOffboarding()">+ New</button>
  <button class="btn btn-danger" onclick="deleteCurrentClient()" id="deleteBtn" style="display:none;">Delete</button>
  <button class="btn btn-primary" onclick="exportPDF()" style="margin-left:auto;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Export PDF
  </button>
</div>

<!-- Client Fields -->
<div class="card">
  <div class="card-title">Client Information</div>
  <div class="fields-grid">
    <div class="field-group">
      <label for="clientName">Client Name</label>
      <input type="text" id="clientName" placeholder="Acme Corp" oninput="autoSave()">
    </div>
    <div class="field-group">
      <label for="cancelDate">Cancellation Date</label>
      <input type="date" id="cancelDate" oninput="autoSave()">
    </div>
    <div class="field-group">
      <label for="cancelReason">Cancellation Reason</label>
      <select id="cancelReason" onchange="autoSave()">
        <option value="">-- Select Reason --</option>
        <option value="Price">Price</option>
        <option value="Results">Results</option>
        <option value="No longer needed">No longer needed</option>
        <option value="Switching tools">Switching tools</option>
        <option value="Business closed">Business closed</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="field-group">
      <label for="notes">Notes</label>
      <textarea id="notes" placeholder="Additional context about this offboarding..." oninput="autoSave()"></textarea>
    </div>
  </div>
</div>

<!-- Progress Bar -->
<div class="progress-wrapper">
  <div class="progress-header">
    <span class="progress-label">Overall Completion</span>
    <span class="progress-pct" id="progressPct">0%</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</div>

<!-- Section 1: Immediate -->
<div class="card">
  <div class="section-header">
    <div class="section-badge">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Immediate — Day 1
    </div>
    <span class="section-count" id="count-1"></span>
  </div>
  <div class="checklist" id="section-1">
    <label class="check-item" onclick="toggleItem(this)">
      <input type="checkbox" data-key="ack-email">
      <span class="check-label">Acknowledge cancellation email sent to client</span>
    </label>
    <label class="check-item" onclick="toggleItem(this)">
      <input type="checkbox" data-key="stripe-cancel">
      <span class="check-label">Stripe subscription cancelled</span>
    </label>
    <label class="check-item" onclick="toggleItem(this)">
      <input type="checkbox" data-key="make-paused">
      <span class="check-label">Make scenarios paused</span>
    </label>
    <label class="check-item" onclick="toggleItem(this)">
      <input type="checkbox" data-key="brian-notified">
      <span class="check-label">Brian notified of cancellation</span>
    </label>
    <label class="check-item" onclick="toggleItem(this)">
      <input type="checkbox" data-key="hubspot-closed">
      <span class="check-label">HubSpot deal moved to Closed Lost</span>
    </label>
  </div>
</div>

<!-- Section 2: Within 3 Days -->
<div class="card">
  <div class="section-header">
    <div class="section-badge green">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Within 3 Days
    </div>
    <span class="section-count" id="count-2"></span>
  </div>
  <div class="checklist" id="section-2">
    <label class="check-item" onclick="toggleItem(this)">
      <input type="checkbox" data-key="winback-email">
      <span class="check-label">Win-back email sent (auto via scenario-w)</span>
    </label>
    <label class="check-item" onclick="toggleItem(this)">
      <input type="checkbox" data-key="final-report">
      <span class="check-label">Final monthly report sent to client</span>
    </label>
    <label class="check-item" onclick="toggleItem(this)">
      <input type="checkbox" data-key="creds-revoked">
      <span class="check-label">Access credentials revoked</span>
    </label>
    <label class="check-item" onclick="toggleItem(this)">
      <input type="checkbox" data-key="dns-removal">
      <span class="check-label">DNS records removal instructions sent</span>
    </label>
    <label class="check-item" onclick="toggleItem(this)">
      <input type="checkbox" data-key="freshchat-removed">
      <span class="check-label">Freshchat bot removed from client site</span>
    </label>
  </div>
</div>

<!-- Section 3: Within 7 Days -->
<div class="card">
  <div class="section-header">
    <div class="section-badge blue">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      Within 7 Days
    </div>
    <span class="section-count" id="count-3"></span>
  </div>
  <div class="checklist" id="section-3">
    <label class="check-item" onclick="toggleItem(this)">
      <input type="checkbox" data-key="folder-archived">
      <span class="check-label">Client folder archived in file system</span>
    </label>
    <label class="check-item" onclick="toggleItem(this)">
      <input type="checkbox" data-key="survey-sent">
      <span class="check-label">Offboarding survey sent</span>
    </label>
    <label class="check-item" onclick="toggleItem(this)">
      <input type="checkbox" data-key="case-study">
      <span class="check-label">Case study opportunity evaluated</span>
    </label>
    <label class="check-item" onclick="toggleItem(this)">
      <input type="checkbox" data-key="testimonial">
      <span class="check-label">Testimonial requested (if ended positively)</span>
    </label>
    <label class="check-item" onclick="toggleItem(this)">
      <input type="checkbox" data-key="linkedin">
      <span class="check-label">LinkedIn connection sent to stay in touch</span>
    </label>
  </div>
</div>

<!-- Analytics -->
<div class="card analytics-card">
  <div class="card-title">Reason Analytics — All Offboardings</div>
  <div class="analytics-grid" id="analyticsStats"></div>
  <div class="divider"></div>
  <div class="chart-title">Cancellation Reason Distribution</div>
  <div class="bar-chart" id="reasonChart"></div>
</div>

<div class="save-toast" id="saveToast">Saved</div>

<script>
  const STORAGE_KEY = 'cwi_offboardings';
  const ALL_KEYS = [
    'ack-email','stripe-cancel','make-paused','brian-notified','hubspot-closed',
    'winback-email','final-report','creds-revoked','dns-removal','freshchat-removed',
    'folder-archived','survey-sent','case-study','testimonial','linkedin'
  ];
  const REASONS = ['Price','Results','No longer needed','Switching tools','Business closed','Other'];

  let currentId = null;
  let saveTimer = null;

  function getData() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; }
  }

  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function genId() {
    return 'ob_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
  }

  function populateSelector() {
    const data = getData();
    const sel = document.getElementById('clientSelector');
    const prev = sel.value;
    while (sel.options.length > 1) sel.remove(1);
    const entries = Object.entries(data).sort((a,b) => (b[1].updatedAt||0) - (a[1].updatedAt||0));
    entries.forEach(([id, record]) => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = record.clientName || '(Unnamed)';
      if (record.cancelDate) opt.textContent += ' — ' + record.cancelDate;
      sel.appendChild(opt);
    });
    if (prev && data[prev]) sel.value = prev;
  }

  function newOffboarding() {
    currentId = genId();
    document.getElementById('clientSelector').value = '';
    document.getElementById('deleteBtn').style.display = 'none';
    clearForm();
    document.getElementById('cancelDate').value = new Date().toISOString().slice(0,10);
    updateProgress();
    updateSectionCounts();
  }

  function clearForm() {
    document.getElementById('clientName').value = '';
    document.getElementById('cancelDate').value = '';
    document.getElementById('cancelReason').value = '';
    document.getElementById('notes').value = '';
    ALL_KEYS.forEach(k => {
      const cb = document.querySelector(`[data-key="${k}"]`);
      if (cb) {
        cb.checked = false;
        cb.closest('.check-item').classList.remove('done');
      }
    });
  }

  function loadClient() {
    const sel = document.getElementById('clientSelector');
    const id = sel.value;
    if (!id) { newOffboarding(); return; }
    currentId = id;
    document.getElementById('deleteBtn').style.display = '';
    const data = getData();
    const record = data[id] || {};
    document.getElementById('clientName').value = record.clientName || '';
    document.getElementById('cancelDate').value = record.cancelDate || '';
    document.getElementById('cancelReason').value = record.cancelReason || '';
    document.getElementById('notes').value = record.notes || '';
    ALL_KEYS.forEach(k => {
      const cb = document.querySelector(`[data-key="${k}"]`);
      if (cb) {
        cb.checked = !!(record.checks && record.checks[k]);
        cb.closest('.check-item').classList.toggle('done', cb.checked);
      }
    });
    updateProgress();
    updateSectionCounts();
  }

  function getCurrentRecord() {
    return {
      clientName: document.getElementById('clientName').value.trim(),
      cancelDate: document.getElementById('cancelDate').value,
      cancelReason: document.getElementById('cancelReason').value,
      notes: document.getElementById('notes').value.trim(),
      checks: Object.fromEntries(ALL_KEYS.map(k => {
        const cb = document.querySelector(`[data-key="${k}"]`);
        return [k, cb ? cb.checked : false];
      })),
      updatedAt: Date.now()
    };
  }

  function save() {
    if (!currentId) currentId = genId();
    const data = getData();
    data[currentId] = getCurrentRecord();
    saveData(data);
    populateSelector();
    document.getElementById('clientSelector').value = currentId;
    document.getElementById('deleteBtn').style.display = '';
    showToast();
    renderAnalytics();
  }

  function autoSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 600);
    updateProgress();
    updateSectionCounts();
  }

  function toggleItem(label) {
    setTimeout(() => {
      const cb = label.querySelector('input[type="checkbox"]');
      if (cb) label.classList.toggle('done', cb.checked);
      autoSave();
    }, 0);
  }

  function updateProgress() {
    const total = ALL_KEYS.length;
    const done = ALL_KEYS.filter(k => {
      const cb = document.querySelector(`[data-key="${k}"]`);
      return cb && cb.checked;
    }).length;
    const pct = Math.round((done / total) * 100);
    document.getElementById('progressPct').textContent = pct + '%';
    const fill = document.getElementById('progressFill');
    fill.style.width = pct + '%';
    fill.classList.toggle('complete', pct === 100);
  }

  function updateSectionCounts() {
    const sections = {
      '1': ['ack-email','stripe-cancel','make-paused','brian-notified','hubspot-closed'],
      '2': ['winback-email','final-report','creds-revoked','dns-removal','freshchat-removed'],
      '3': ['folder-archived','survey-sent','case-study','testimonial','linkedin']
    };
    Object.entries(sections).forEach(([sec, keys]) => {
      const done = keys.filter(k => {
        const cb = document.querySelector(`[data-key="${k}"]`);
        return cb && cb.checked;
      }).length;
      const el = document.getElementById('count-' + sec);
      if (el) el.textContent = done + ' / ' + keys.length + ' done';
    });
  }

  function showToast() {
    const t = document.getElementById('saveToast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  function deleteCurrentClient() {
    if (!currentId) return;
    const name = document.getElementById('clientName').value || 'this record';
    if (!confirm(`Delete offboarding for "${name}"? This cannot be undone.`)) return;
    const data = getData();
    delete data[currentId];
    saveData(data);
    currentId = null;
    populateSelector();
    newOffboarding();
    renderAnalytics();
  }

  function renderAnalytics() {
    const data = getData();
    const records = Object.values(data);
    const total = records.length;

    const statsEl = document.getElementById('analyticsStats');
    const chartEl = document.getElementById('reasonChart');

    if (total === 0) {
      statsEl.innerHTML = '';
      chartEl.innerHTML = '<div class="empty-analytics">No offboarding records saved yet. Complete your first offboarding to see analytics.</div>';
      return;
    }

    // Count reasons
    const counts = {};
    REASONS.forEach(r => counts[r] = 0);
    records.forEach(r => { if (r.cancelReason && counts[r.cancelReason] !== undefined) counts[r.cancelReason]++; });

    const completed = records.filter(r => {
      if (!r.checks) return false;
      return ALL_KEYS.every(k => r.checks[k]);
    }).length;

    // Stats pills
    statsEl.innerHTML = `
      <div class="stat-pill"><div class="stat-num">${total}</div><div class="stat-label">Total</div></div>
      <div class="stat-pill"><div class="stat-num">${completed}</div><div class="stat-label">Fully Done</div></div>
      <div class="stat-pill"><div class="stat-num">${total - completed}</div><div class="stat-label">In Progress</div></div>
    `;

    const maxCount = Math.max(...Object.values(counts), 1);
    chartEl.innerHTML = REASONS.map(reason => {
      const cnt = counts[reason];
      const pct = Math.round((cnt / maxCount) * 100);
      return `
        <div class="bar-row">
          <span class="bar-reason-label">${reason}</span>
          <div class="bar-track">
            <div class="bar-fill" style="width:${pct}%"></div>
          </div>
          <span class="bar-count">${cnt}</span>
        </div>
      `;
    }).join('');
  }

  function exportPDF() {
    const clientName = document.getElementById('clientName').value || 'Client';
    const cancelDate = document.getElementById('cancelDate').value || '';
    document.title = `CWI AI Offboarding — ${clientName}${cancelDate ? ' ' + cancelDate : ''}`;
    window.print();
    document.title = 'CWI AI — Client Offboarding Checklist';
  }

  // Init
  (function init() {
    newOffboarding();
    populateSelector();
    renderAnalytics();
    updateSectionCounts();

    // Clicking label should not double-toggle since toggleItem uses setTimeout
    document.querySelectorAll('.check-item').forEach(item => {
      item.addEventListener('click', function(e) {
        if (e.target.tagName === 'INPUT') {
          // checkbox click is handled natively, just call toggleItem manually
          const label = e.target.closest('.check-item');
          setTimeout(() => {
            label.classList.toggle('done', e.target.checked);
            autoSave();
          }, 0);
          e.stopPropagation();
        }
      });
    });
  })();
</script>
</body>
</html>
