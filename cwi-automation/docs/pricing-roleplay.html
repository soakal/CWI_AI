<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing Roleplay Trainer</title>
<meta name="description" content="CWI internal tool: Pricing Roleplay Trainer. Internal use only — CWI Compute With Imagination.">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #FF5A1F;
    --accent-dim: rgba(255,90,31,0.15);
    --accent-border: rgba(255,90,31,0.4);
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --surface3: #2a2a38;
    --text: #e8e8f0;
    --text-dim: #9090a8;
    --good: #22c55e;
    --good-bg: rgba(34,197,94,0.12);
    --risky: #f59e0b;
    --risky-bg: rgba(245,158,11,0.12);
    --weak: #ef4444;
    --weak-bg: rgba(239,68,68,0.12);
    --radius: 10px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px;
  }

  .shell {
    max-width: 820px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header-left h1 {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .header-left p {
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .mode-toggle {
    display: flex;
    gap: 0;
    border: 1px solid var(--surface3);
    border-radius: 8px;
    overflow: hidden;
  }
  .mode-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    padding: 7px 16px;
    font-size: 0.82rem;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .mode-btn.active {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  /* Score bar */
  .score-bar {
    background: var(--surface);
    border: 1px solid var(--surface3);
    border-radius: var(--radius);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .score-main {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent);
    min-width: 64px;
  }
  .score-main span { font-size: 1rem; color: var(--text-dim); font-weight: 400; }
  .score-cats {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .score-cat {
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  .score-cat strong { color: var(--text); }
  .score-pct {
    margin-left: auto;
    text-align: right;
  }
  .score-pct .pct-num {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
  }
  .pct-bar {
    width: 120px;
    height: 6px;
    background: var(--surface3);
    border-radius: 99px;
    overflow: hidden;
    margin-top: 4px;
  }
  .pct-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.4s;
  }

  /* Round dots */
  .round-dots {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .rdot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--surface2);
    border: 2px solid var(--surface3);
    font-size: 0.7rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    transition: all 0.2s;
  }
  .rdot.current { border-color: var(--accent); color: var(--accent); }
  .rdot.correct { background: var(--good); border-color: var(--good); color: #fff; }
  .rdot.wrong { background: var(--weak); border-color: var(--weak); color: #fff; }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--surface3);
    border-radius: 14px;
    overflow: hidden;
  }

  .card-header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--surface3);
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--accent-dim);
    border: 2px solid var(--accent-border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
  }
  .prospect-info .name {
    font-weight: 700;
    font-size: 1rem;
  }
  .prospect-info .role {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 1px;
  }
  .badge {
    margin-left: auto;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 99px;
    white-space: nowrap;
  }
  .badge-cold { background: rgba(99,102,241,0.18); color: #a5b4fc; }
  .badge-discovery { background: rgba(20,184,166,0.18); color: #5eead4; }
  .badge-proposal { background: rgba(234,179,8,0.18); color: #fde047; }

  .card-body { padding: 22px; }
  .round-label {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }
  .context-block {
    background: var(--surface2);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 12px 16px;
    font-size: 0.87rem;
    color: var(--text-dim);
    margin-bottom: 20px;
    line-height: 1.6;
  }
  .objection {
    font-size: 1.05rem;
    font-weight: 600;
    line-height: 1.55;
    margin-bottom: 22px;
    color: var(--text);
  }
  .objection::before {
    content: '"';
    color: var(--accent);
    font-size: 1.4rem;
    line-height: 0;
    vertical-align: -0.3em;
  }
  .objection::after {
    content: '"';
    color: var(--accent);
    font-size: 1.4rem;
    line-height: 0;
    vertical-align: -0.3em;
  }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    background: var(--surface2);
    border: 2px solid var(--surface3);
    border-radius: var(--radius);
    padding: 14px 16px;
    text-align: left;
    cursor: pointer;
    color: var(--text);
    font-size: 0.9rem;
    line-height: 1.5;
    transition: border-color 0.15s, background 0.15s;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .option-btn:hover:not(:disabled) {
    border-color: var(--accent-border);
    background: var(--surface3);
  }
  .option-btn:disabled { cursor: default; }
  .opt-letter {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: var(--surface3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
    transition: background 0.15s;
  }
  .opt-content { flex: 1; }
  .opt-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-top: 6px;
    display: none;
  }
  .opt-explanation {
    font-size: 0.8rem;
    margin-top: 6px;
    display: none;
    line-height: 1.5;
  }

  /* Revealed states */
  .option-btn.revealed-good {
    border-color: var(--good);
    background: var(--good-bg);
  }
  .option-btn.revealed-risky {
    border-color: var(--risky);
    background: var(--risky-bg);
  }
  .option-btn.revealed-weak {
    border-color: var(--weak);
    background: var(--weak-bg);
  }
  .option-btn.revealed-good .opt-letter { background: var(--good); color: #fff; }
  .option-btn.revealed-risky .opt-letter { background: var(--risky); color: #fff; }
  .option-btn.revealed-weak .opt-letter { background: var(--weak); color: #fff; }
  .option-btn.revealed-good .opt-label { display: block; color: var(--good); }
  .option-btn.revealed-risky .opt-label { display: block; color: var(--risky); }
  .option-btn.revealed-weak .opt-label { display: block; color: var(--weak); }
  .option-btn.revealed-good .opt-explanation,
  .option-btn.revealed-risky .opt-explanation,
  .option-btn.revealed-weak .opt-explanation { display: block; color: var(--text-dim); }

  /* Ideal script */
  .ideal-block {
    display: none;
    margin-top: 20px;
    background: var(--accent-dim);
    border: 1px solid var(--accent-border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .ideal-block.show { display: block; }
  .ideal-block h4 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 8px;
    font-weight: 700;
  }
  .ideal-block p {
    font-size: 0.88rem;
    line-height: 1.65;
    color: var(--text);
  }

  /* Mastery mode textarea */
  .mastery-input {
    width: 100%;
    min-height: 90px;
    background: var(--surface2);
    border: 2px solid var(--surface3);
    border-radius: var(--radius);
    padding: 12px 14px;
    color: var(--text);
    font-size: 0.9rem;
    font-family: inherit;
    resize: vertical;
    margin-bottom: 12px;
    transition: border-color 0.15s;
  }
  .mastery-input:focus { outline: none; border-color: var(--accent-border); }
  .mastery-input::placeholder { color: var(--text-dim); }

  /* Card footer */
  .card-footer {
    padding: 16px 22px;
    border-top: 1px solid var(--surface3);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .footer-status {
    font-size: 0.82rem;
    color: var(--text-dim);
  }
  .btn {
    padding: 9px 22px;
    border-radius: 8px;
    font-size: 0.87rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { opacity: 0.9; }
  .btn-ghost {
    background: var(--surface3);
    color: var(--text);
  }
  .btn-ghost:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: default; }

  /* Completion screen */
  .completion {
    display: none;
    text-align: center;
    padding: 48px 24px;
  }
  .completion.show { display: block; }
  .trophy { font-size: 4rem; margin-bottom: 16px; }
  .completion h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 6px; }
  .completion .final-score {
    font-size: 3.5rem;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
    margin: 20px 0 4px;
  }
  .completion .final-score span { font-size: 1.5rem; color: var(--text-dim); font-weight: 400; }
  .completion .grade {
    font-size: 1.1rem;
    color: var(--text-dim);
    margin-bottom: 32px;
  }
  .breakdown-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 480px;
    margin: 0 auto 32px;
  }
  .breakdown-cell {
    background: var(--surface2);
    border: 1px solid var(--surface3);
    border-radius: var(--radius);
    padding: 14px 10px;
  }
  .breakdown-cell .bc-type {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .breakdown-cell .bc-score {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--text);
  }
  .breakdown-cell .bc-score span { font-size: 0.9rem; color: var(--text-dim); font-weight: 400; }

  @media (max-width: 540px) {
    .score-bar { flex-direction: column; align-items: flex-start; }
    .score-pct { margin-left: 0; text-align: left; }
    .pct-bar { width: 180px; }
    .breakdown-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="shell">

  <div class="header">
    <div class="header-left">
      <h1>Pricing Roleplay Trainer</h1>
      <p>15 rounds across Cold, Discovery, and Proposal scenarios</p>
    </div>
    <div class="mode-toggle">
      <button class="mode-btn active" id="btnQuiz" onclick="setMode('quiz')">Quiz Mode</button>
      <button class="mode-btn" id="btnMastery" onclick="setMode('mastery')">Mastery Mode</button>
    </div>
  </div>

  <div class="score-bar">
    <div class="score-main" id="scoreMain">0<span>/0</span></div>
    <div class="score-cats">
      <div class="score-cat">Cold: <strong id="scoreCold">0/5</strong></div>
      <div class="score-cat">Discovery: <strong id="scoreDisc">0/5</strong></div>
      <div class="score-cat">Proposal: <strong id="scoreProp">0/5</strong></div>
    </div>
    <div class="score-pct">
      <div class="pct-num" id="pctNum">--</div>
      <div class="pct-bar"><div class="pct-fill" id="pctFill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="round-dots" id="roundDots"></div>

  <div class="card" id="mainCard">
    <div id="quizArea">
      <div class="card-header">
        <div class="avatar" id="cardAvatar">?</div>
        <div class="prospect-info">
          <div class="name" id="cardName">--</div>
          <div class="role" id="cardRole">--</div>
        </div>
        <span class="badge" id="cardBadge">--</span>
      </div>
      <div class="card-body">
        <div class="round-label" id="roundLabel">Round 1 of 15</div>
        <div class="context-block" id="cardContext">--</div>
        <div class="objection" id="cardObjection">--</div>
        <div id="masteryInputArea" style="display:none">
          <textarea class="mastery-input" id="masteryText" placeholder="Type your response, then click Reveal to see the ideal script..."></textarea>
          <button class="btn btn-ghost" onclick="revealMastery()" id="revealBtn">Reveal Answer</button>
        </div>
        <div class="options" id="optionsArea"></div>
        <div class="ideal-block" id="idealBlock">
          <h4>Ideal Script</h4>
          <p id="idealText">--</p>
        </div>
      </div>
      <div class="card-footer">
        <div class="footer-status" id="footerStatus">Choose your response</div>
        <button class="btn btn-accent" id="nextBtn" onclick="nextRound()" disabled>Next Round</button>
      </div>
    </div>

    <div class="completion" id="completionArea">
      <div class="trophy">&#127942;</div>
      <h2>Training Complete</h2>
      <div class="final-score" id="finalScore">0<span>/15</span></div>
      <div class="grade" id="finalGrade">--</div>
      <div class="breakdown-grid">
        <div class="breakdown-cell">
          <div class="bc-type">Cold Outreach</div>
          <div class="bc-score" id="bcCold">0<span>/5</span></div>
        </div>
        <div class="breakdown-cell">
          <div class="bc-type">Discovery Call</div>
          <div class="bc-score" id="bcDisc">0<span>/5</span></div>
        </div>
        <div class="breakdown-cell">
          <div class="bc-type">Proposal Follow-up</div>
          <div class="bc-score" id="bcProp">0<span>/5</span></div>
        </div>
      </div>
      <button class="btn btn-accent" onclick="restartAll()">Restart Training</button>
    </div>
  </div>

</div>

<script>
// ─────────────────────────────────────────────
// DATA — 15 rounds
// ─────────────────────────────────────────────
const ROUNDS = [
  // ── COLD OUTREACH 1 ──
  {
    type: 'cold',
    badge: 'Cold Outreach',
    badgeClass: 'badge-cold',
    avatar: 'S',
    name: 'Sarah Chen',
    role: 'Operations Director — Mid-size logistics firm',
    context: 'First email reply. Sarah responded to your outreach saying she has a current vendor and things are "working fine." No budget conversation has happened yet.',
    objection: 'We already have a system in place. I don\'t think we\'re looking to make any changes right now.',
    options: [
      {
        letter: 'A',
        text: 'Totally understand — switching systems is a big lift. Would it be worth a 20-minute call just to benchmark what you\'re paying now against what\'s possible? Even if nothing changes, you\'d walk away knowing your current deal is solid.',
        quality: 'good',
        label: 'Good',
        explanation: 'Low-pressure, frames value as free intelligence rather than a sales call, and gives her a reason to say yes even if she stays put.'
      },
      {
        letter: 'B',
        text: 'Our platform is actually 30% cheaper than most legacy systems and we have a 5-minute setup. Can I send you a demo link?',
        quality: 'risky',
        label: 'Risky',
        explanation: 'Jumps to price and features before understanding her situation. Numbers feel unsubstantiated at this stage and a demo link is low-intent.'
      },
      {
        letter: 'C',
        text: 'That makes sense! Let me know if anything changes.',
        quality: 'weak',
        label: 'Weak',
        explanation: 'Completely surrenders the conversation. Leaves no door open and puts all follow-up responsibility on the prospect.'
      }
    ],
    correct: 'A',
    ideal: 'Totally understand — switching mid-stream is a real cost. The only reason I ask is that we\'ve helped a few logistics teams discover they were over-paying by 20–40% without realizing it. Would a 15-minute benchmark call be worth your time? No pitch, just a comparison you can walk away with.'
  },

  // ── COLD OUTREACH 2 ──
  {
    type: 'cold',
    badge: 'Cold Outreach',
    badgeClass: 'badge-cold',
    avatar: 'M',
    name: 'Marcus Webb',
    role: 'VP of Finance — 80-person SaaS company',
    context: 'LinkedIn message reply. Marcus has seen your profile and is skeptical. He has not agreed to a call yet.',
    objection: 'I\'m going to be honest — I get 10 messages like this a week. Why should I spend time on this one?',
    options: [
      {
        letter: 'A',
        text: 'Fair challenge. Here\'s the short answer: most vendors pitch features — I\'m trying to find out if there\'s actually a fit before wasting either of our time. If I can\'t show you a specific number that matters to your P&L in 15 minutes, I\'ll tell you so and we move on.',
        quality: 'good',
        label: 'Good',
        explanation: 'Respects his time, positions you as different through behavior not claims, and sets a concrete success bar that reduces perceived risk.'
      },
      {
        letter: 'B',
        text: 'I understand your concern. We\'ve worked with companies just like yours and have a 95% customer satisfaction rate.',
        quality: 'risky',
        label: 'Risky',
        explanation: 'Generic social proof and statistics don\'t differentiate you and don\'t answer his actual challenge about your specific outreach.'
      },
      {
        letter: 'C',
        text: 'I\'d love to tell you all about what makes us different! Do you have 30 minutes for a full demo this week?',
        quality: 'weak',
        label: 'Weak',
        explanation: 'Completely ignores the challenge and doubles down on asking for more time. Will almost certainly get ignored.'
      }
    ],
    correct: 'A',
    ideal: 'That\'s a fair challenge — and honestly the right one to ask. I\'ll be direct: I\'m not here to pitch. I want to find out in 15 minutes whether there\'s a number on your P&L I can actually move. If there isn\'t, I\'ll tell you straight and we both save time. Is that worth 15 minutes?'
  },

  // ── COLD OUTREACH 3 ──
  {
    type: 'cold',
    badge: 'Cold Outreach',
    badgeClass: 'badge-cold',
    avatar: 'P',
    name: 'Priya Nair',
    role: 'Founder — 12-person e-commerce brand',
    context: 'Phone cold call, first contact. She answered but sounds busy and guarded.',
    objection: 'We don\'t have budget for anything new right now. Q3 is tight.',
    options: [
      {
        letter: 'A',
        text: 'Completely understand — tight quarters. Can I ask one quick question before you go? If I told you we could cut your current [relevant cost] by 15%, would that change the Q3 conversation internally, or is it truly frozen?',
        quality: 'good',
        label: 'Good',
        explanation: 'Acknowledges the constraint, asks a diagnostic question, and tests whether the objection is a firm no or a moveable obstacle — all in under 20 seconds.'
      },
      {
        letter: 'B',
        text: 'We actually have a free trial so there\'s no budget needed to get started!',
        quality: 'risky',
        label: 'Risky',
        explanation: 'Sidesteps her real concern. Even free tools require time and implementation budget. May feel like you didn\'t listen.'
      },
      {
        letter: 'C',
        text: 'No problem, I\'ll reach out in Q4 when budgets reset.',
        quality: 'weak',
        label: 'Weak',
        explanation: 'Passive retreat. You lose the moment and she won\'t remember you in Q4. No reason to re-engage was established.'
      }
    ],
    correct: 'A',
    ideal: 'Got it, Q3 is tight — I\'ll be quick. One question: if we could reduce your current [cost area] by 15% starting this quarter, is that a conversation worth having, or is spend truly frozen? I just want to know if I should follow up in Q4 or if there\'s a real window now.'
  },

  // ── COLD OUTREACH 4 ──
  {
    type: 'cold',
    badge: 'Cold Outreach',
    badgeClass: 'badge-cold',
    avatar: 'D',
    name: 'David Osei',
    role: 'Head of IT — Regional healthcare network',
    context: 'Second email in a sequence. He replied to your first email with a one-liner.',
    objection: 'Send me some information and I\'ll take a look.',
    options: [
      {
        letter: 'A',
        text: 'Happy to — and I want to make sure I send the right thing. Quick question: is your main pain point right now around cost, compliance, or system reliability? I\'ll tailor it so it\'s actually worth reading.',
        quality: 'good',
        label: 'Good',
        explanation: 'Uses the opening to qualify and personalize rather than blasting a generic brochure. Increases the chance the content actually lands.'
      },
      {
        letter: 'B',
        text: 'Absolutely! Here is our full product overview deck, case study library, and pricing sheet.',
        quality: 'risky',
        label: 'Risky',
        explanation: 'Information overload. Sending everything at once buries the relevant parts and signals you didn\'t think about his specific situation.'
      },
      {
        letter: 'C',
        text: 'Sure thing! Here\'s our website: [link]. Let me know what you think.',
        quality: 'weak',
        label: 'Weak',
        explanation: 'Sending someone to a homepage is the lowest-quality response possible. No follow-up hook, no personalization, no next step.'
      }
    ],

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let state = {
  mode: 'quiz',
  current: 0,
  answered: false,
  scores: { correct: 0, total: 0 },
  catScores: { cold: { c: 0, t: 0 }, discovery: { c: 0, t: 0 }, proposal: { c: 0, t: 0 } },
  results: Array(15).fill(null)
};

function setMode(m) {
  state.mode = m;
  document.getElementById('btnQuiz').classList.toggle('active', m === 'quiz');
  document.getElementById('btnMastery').classList.toggle('active', m === 'mastery');
  renderRound();
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function renderRound() {
  if (state.current >= ROUNDS.length) {
    showCompletion();
    return;
  }
  const r = ROUNDS[state.current];
  state.answered = false;

  // Dots
  const dots = document.getElementById('roundDots');
  dots.innerHTML = '';
  for (let i = 0; i < ROUNDS.length; i++) {
    const d = document.createElement('div');
    d.className = 'rdot';
    d.textContent = i + 1;
    if (i === state.current) d.classList.add('current');
    else if (state.results[i] === true) d.classList.add('correct');
    else if (state.results[i] === false) d.classList.add('wrong');
    dots.appendChild(d);
  }

  // Card header
  document.getElementById('cardAvatar').textContent = r.avatar;
  document.getElementById('cardName').textContent = r.name;
  document.getElementById('cardRole').textContent = r.role;
  const badge = document.getElementById('cardBadge');
  badge.textContent = r.badge;
  badge.className = 'badge ' + r.badgeClass;

  // Body
  document.getElementById('roundLabel').textContent = `Round ${state.current + 1} of ${ROUNDS.length}`;
  document.getElementById('cardContext').textContent = r.context;
  document.getElementById('cardObjection').textContent = r.objection;

  // Mastery vs Quiz
  const masteryArea = document.getElementById('masteryInputArea');
  const optionsArea = document.getElementById('optionsArea');
  if (state.mode === 'mastery') {
    masteryArea.style.display = 'block';
    document.getElementById('masteryText').value = '';
    document.getElementById('revealBtn').disabled = false;
    optionsArea.style.display = 'none';
  } else {
    masteryArea.style.display = 'none';
    optionsArea.style.display = 'flex';
    optionsArea.innerHTML = '';
    r.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = `
        <div class="opt-letter">${opt.letter}</div>
        <div class="opt-content">
          <div class="opt-text">${opt.text}</div>
          <div class="opt-label">${opt.label}</div>
          <div class="opt-explanation">${opt.explanation}</div>
        </div>`;
      btn.onclick = () => selectOption(opt.letter, idx);
      optionsArea.appendChild(btn);
    });
  }

  // Ideal block
  document.getElementById('idealBlock').classList.remove('show');
  document.getElementById('idealText').textContent = r.ideal;

  // Footer
  document.getElementById('footerStatus').textContent = state.mode === 'mastery'
    ? 'Write your response, then reveal the ideal script'
    : 'Choose your response';
  document.getElementById('nextBtn').disabled = true;
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = state.current === ROUNDS.length - 1 ? 'See Results' : 'Next Round';
}

function selectOption(letter, clickedIdx) {
  if (state.answered) return;
  state.answered = true;
  const r = ROUNDS[state.current];
  const isCorrect = letter === r.correct;

  // Update scores
  state.scores.total++;
  if (isCorrect) state.scores.correct++;
  const cat = r.type;
  state.catScores[cat].t++;
  if (isCorrect) state.catScores[cat].c++;
  state.results[state.current] = isCorrect;

  // Reveal options
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((btn, idx) => {
    btn.disabled = true;
    const opt = r.options[idx];
    btn.classList.add('revealed-' + opt.quality);
  });

  // Show ideal
  document.getElementById('idealBlock').classList.add('show');

  // Footer status
  document.getElementById('footerStatus').textContent = isCorrect
    ? 'Correct — well handled'
    : `Incorrect — best answer was ${r.correct}`;

  document.getElementById('nextBtn').disabled = false;
  updateScoreBar();
  renderDots();
}

function revealMastery() {
  if (state.answered) return;
  state.answered = true;
  const r = ROUNDS[state.current];
  document.getElementById('revealBtn').disabled = true;
  document.getElementById('idealBlock').classList.add('show');

  // In mastery mode score as correct always (self-assessed)
  state.scores.total++;
  state.scores.correct++;
  const cat = r.type;
  state.catScores[cat].t++;
  state.catScores[cat].c++;
  state.results[state.current] = true;

  document.getElementById('footerStatus').textContent = 'Compare your response to the ideal script';
  document.getElementById('nextBtn').disabled = false;
  updateScoreBar();
  renderDots();
}

function nextRound() {
  state.current++;
  renderRound();
}

function renderDots() {
  const dots = document.querySelectorAll('.rdot');
  dots.forEach((d, i) => {
    d.className = 'rdot';
    if (i === state.current) d.classList.add('current');
    else if (state.results[i] === true) d.classList.add('correct');
    else if (state.results[i] === false) d.classList.add('wrong');
  });
}

function updateScoreBar() {
  const { correct, total } = state.scores;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  document.getElementById('scoreMain').innerHTML = `${correct}<span>/${total}</span>`;
  document.getElementById('pctNum').textContent = total > 0 ? pct + '%' : '--';
  document.getElementById('pctFill').style.width = pct + '%';

  const cs = state.catScores;
  document.getElementById('scoreCold').textContent = `${cs.cold.c}/${cs.cold.t || 5}`;
  document.getElementById('scoreDisc').textContent = `${cs.discovery.c}/${cs.discovery.t || 5}`;
  document.getElementById('scoreProp').textContent = `${cs.proposal.c}/${cs.proposal.t || 5}`;
}

function showCompletion() {
  document.getElementById('quizArea').style.display = 'none';
  const comp = document.getElementById('completionArea');
  comp.classList.add('show');
  document.getElementById('roundDots').style.display = 'none';

  const total = state.scores.correct;
  document.getElementById('finalScore').innerHTML = `${total}<span>/15</span>`;

  const pct = Math.round((total / 15) * 100);
  let grade = '';
  if (pct >= 93) grade = 'Outstanding — Elite closer';
  else if (pct >= 80) grade = 'Strong — Above average performance';
  else if (pct >= 67) grade = 'Solid — Good foundation, room to sharpen';
  else if (pct >= 53) grade = 'Developing — Key gaps to address';
  else grade = 'Needs work — Focus on the fundamentals';
  document.getElementById('finalGrade').textContent = grade;

  const cs = state.catScores;
  document.getElementById('bcCold').innerHTML = `${cs.cold.c}<span>/5</span>`;
  document.getElementById('bcDisc').innerHTML = `${cs.discovery.c}<span>/5</span>`;
  document.getElementById('bcProp').innerHTML = `${cs.proposal.c}<span>/5</span>`;
}

function restartAll() {
  state = {
    mode: state.mode,
    current: 0,
    answered: false,
    scores: { correct: 0, total: 0 },
    catScores: { cold: { c: 0, t: 0 }, discovery: { c: 0, t: 0 }, proposal: { c: 0, t: 0 } },
    results: Array(15).fill(null)
  };
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('completionArea').classList.remove('show');
  document.getElementById('roundDots').style.display = 'flex';
  updateScoreBar();
  renderRound();
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
updateScoreBar();
renderRound();
</script>
</body>
</html>
