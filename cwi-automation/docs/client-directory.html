<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Directory — CWI</title>
<meta name="description" content="Internal CWI client directory for managing business contacts, plan tiers, billing details, and integration IDs.">
<link rel="icon" type="image/png" href="../assets/cwi-favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0A0C;--ink-2:#0E0E11;--surface:#141418;--surface-2:#191920;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.14);--accent:#FF5A1F;--ember:#FF8A3D;--steel:#85858E;--text:#F4F4F6;--text-dim:#C2C2C8;--font-disp:'Sora',sans-serif;--font-body:'Instrument Sans',sans-serif;--r-sm:12px;--r-md:18px;--r-pill:999px;--ease:cubic-bezier(.22,.61,.36,1);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--ink);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh;padding:0 0 64px;}
h1,h2,h3,h4,h5,h6{font-family:var(--font-disp);letter-spacing:-.03em;line-height:1.15;font-weight:800;color:var(--text);}
a{color:var(--accent);text-decoration:none;}
p{color:var(--text-dim);line-height:1.65;}
ul,ol{color:var(--text-dim);padding-left:1.4em;}
li{margin-bottom:6px;}
/* Layout */
.wrap{max-width:960px;margin:0 auto;padding:0 24px;}
.container{max-width:900px;margin:0 auto;padding:0 24px;}
/* Topbar */
.topbar{border-bottom:1px solid var(--line);background:rgba(10,10,12,.9);backdrop-filter:blur(14px);position:sticky;top:0;z-index:100;padding:14px 0;}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:960px;margin:0 auto;padding:0 24px;}
.logo{font-family:var(--font-disp);font-weight:800;font-size:17px;letter-spacing:-.04em;display:flex;align-items:center;gap:8px;color:var(--text);}
.logo .dot{color:var(--accent);}
.back-link{font-size:13px;color:var(--steel);display:flex;align-items:center;gap:5px;transition:color .2s;}
.back-link:hover{color:var(--text);}
/* Hero */
.page-header,.hero{padding:52px 0 32px;text-align:center;}
.page-header .logo-block,.hero .logo-block{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-disp);font-size:20px;font-weight:800;margin-bottom:10px;color:var(--accent);}
.kicker,.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--steel);margin-bottom:16px;}
.pip{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.hero h1,.page-title{font-size:clamp(26px,3.5vw,44px);margin-bottom:12px;}
.hero p,.page-subtitle{font-size:clamp(14px,1.5vw,16px);color:var(--text-dim);max-width:52ch;margin:0 auto;}
/* Cards & panels */
.card,.panel,.form-card,.section-card,.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;margin-bottom:24px;}
.card:hover,.panel:hover{border-color:var(--line-2);}
/* Form elements */
label,.form-label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);display:block;margin-bottom:6px;}
input,select,textarea,.form-control{width:100%;background:var(--ink-2);border:1.5px solid var(--line-2);border-radius:var(--r-sm);padding:10px 14px;font-size:14px;font-family:var(--font-body);color:var(--text);outline:none;transition:border-color .2s;box-sizing:border-box;}
input:focus,select:focus,textarea:focus,.form-control:focus{border-color:var(--accent);background:var(--surface);}
textarea{resize:vertical;min-height:96px;}
select option{background:var(--surface);color:var(--text);}
/* Form layout */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.form-group,.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.form-group.full,.field.full{grid-column:1/-1;}
/* Buttons */
.btn,.btn-primary,.btn-generate,.btn-action{font-family:var(--font-body);font-size:14px;font-weight:600;padding:11px 24px;border-radius:var(--r-pill);border:1.5px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:all .22s var(--ease);display:inline-flex;align-items:center;gap:8px;text-decoration:none;}
.btn:hover,.btn-primary:hover,.btn-generate:hover,.btn-action:hover{background:var(--ember);border-color:var(--ember);box-shadow:0 0 22px rgba(255,90,31,.35);}
.btn-outline,.btn-ghost,.btn-secondary{background:rgba(255,90,31,.1);border-color:var(--accent);color:var(--text);}
.btn-outline:hover,.btn-ghost:hover,.btn-secondary:hover{background:var(--accent);color:#fff;}
.btn-sm{padding:8px 16px;font-size:13px;}
/* Tables */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:32px;}
table{width:100%;border-collapse:collapse;}
thead{background:var(--surface-2);}
th{font-family:var(--font-disp);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);}
td{font-size:14px;color:var(--text-dim);padding:11px 16px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
/* Badges / tags */
.badge,.tag{display:inline-block;padding:3px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:600;background:rgba(255,90,31,.12);color:var(--accent);border:1px solid rgba(255,90,31,.25);}
.badge.green,.tag.green{background:rgba(74,222,128,.12);color:#4ade80;border-color:rgba(74,222,128,.25);}
.badge.red,.tag.red{background:rgba(248,113,113,.12);color:#f87171;border-color:rgba(248,113,113,.25);}
/* Sections */
.section{padding:40px 0 0;}
.section-title{font-family:var(--font-disp);font-size:20px;font-weight:700;margin-bottom:18px;color:var(--text);}
.section-title span,.acc{color:var(--accent);}
/* Output/preview areas */
.output-area,.preview,.result-card,.output-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;margin-top:24px;}
/* Dividers */
hr,.rule,.divider{border:none;border-top:1px solid var(--line);margin:32px 0;}
/* Checklist items */
.check-item{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
.check-item:last-child{border-bottom:none;}
.check-item input[type="checkbox"]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;}
/* Lists */
.list-item{padding:12px 0;border-bottom:1px solid var(--line);color:var(--text-dim);}
.list-item:last-child{border-bottom:none;}
/* Stats / KPI */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:28px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px 22px;}
.stat-label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin-bottom:8px;}
.stat-value{font-family:var(--font-disp);font-size:30px;font-weight:800;color:var(--text);}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:11px 22px;font-size:14px;color:var(--text);transition:transform .3s var(--ease),opacity .3s;opacity:0;z-index:999;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
/* Footer */
.footer{border-top:1px solid var(--line);padding:24px 0;text-align:center;font-size:13px;color:var(--steel);margin-top:64px;}
.footer a{color:var(--accent);}
/* Responsive */
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}.card,.panel,.form-card{padding:20px 16px;}.stat-grid{grid-template-columns:1fr 1fr;}}

/* ── Tool-specific styles ── */

/* Header stats bar */
.header-stats{display:flex;gap:12px;flex-wrap:wrap;}
.stat-pill{background:rgba(255,255,255,.07);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:6px 16px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--text-dim);}
.stat-pill .val{color:var(--accent);margin-left:4px;}
.header-actions{display:flex;gap:10px;}

/* Toolbar */
.toolbar{padding:14px 24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--surface);border-bottom:1px solid var(--line);}
.search-wrap{position:relative;flex:1 1 220px;max-width:360px;}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none;}
.search-wrap input{padding:8px 12px 8px 34px;}
.toolbar-spacer{flex:1;}

/* Main content area */
.main{padding:24px;}

/* Table tweaks */
thead th{cursor:pointer;user-select:none;white-space:nowrap;}
thead th:hover{color:var(--accent);}
thead th .sort-icon{margin-left:4px;opacity:.4;}
thead th.sorted .sort-icon{opacity:1;color:var(--accent);}
tbody tr.client-row{cursor:pointer;transition:background .1s;border-bottom:1px solid var(--line);}
tbody tr.client-row:hover td{background:rgba(255,90,31,.04);}
tbody tr.client-row:last-child{border-bottom:none;}
tbody tr.client-row.expanded td{background:rgba(255,90,31,.06);}
tbody tr.client-row td{padding:11px 14px;vertical-align:middle;}
tbody tr.detail-row td{padding:0;border-bottom:1px solid var(--line);}
.expand-icon{display:inline-block;transition:transform .2s;font-size:10px;color:var(--steel);margin-right:6px;}
.expanded .expand-icon{transform:rotate(90deg);}

/* Badge variants for tier/status */
.badge-starter{background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.25);}
.badge-growth{background:rgba(74,222,128,.12);color:#4ade80;border:1px solid rgba(74,222,128,.25);}
.badge-pro{background:rgba(167,139,250,.12);color:#a78bfa;border:1px solid rgba(167,139,250,.25);}
.badge-active{background:rgba(74,222,128,.12);color:#4ade80;border:1px solid rgba(74,222,128,.25);}
.badge-paused{background:rgba(167,139,250,.12);color:#a78bfa;border:1px solid rgba(167,139,250,.25);}
.badge-churned{background:rgba(248,113,113,.12);color:#f87171;border:1px solid rgba(248,113,113,.25);}

/* Copy buttons */
.copy-btn{background:none;border:none;cursor:pointer;padding:3px 5px;border-radius:4px;color:var(--steel);transition:all .15s;font-size:12px;}
.copy-btn:hover{background:rgba(255,90,31,.12);color:var(--accent);}
.copy-btn.copied{color:#4ade80;}
.action-cell{display:flex;align-items:center;gap:4px;}

/* Detail card (expanded row) */
.detail-card{padding:20px 24px;background:var(--surface-2);border-top:3px solid var(--accent);animation:slideDown .15s ease;}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px 24px;margin-bottom:16px;}
.detail-field label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--steel);margin-bottom:3px;}
.detail-field .val{font-size:13px;font-weight:500;color:var(--text);word-break:break-word;}
.detail-field .val a{color:var(--accent);text-decoration:none;}
.detail-field .val a:hover{text-decoration:underline;}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line);}

/* Notes block */
.notes-block{grid-column:1/-1;}
.notes-block .val{color:var(--text-dim);font-style:italic;}

/* Empty state */
.empty-state{text-align:center;padding:56px 24px;color:var(--steel);}
.empty-state svg{margin-bottom:12px;opacity:.35;}
.empty-state p{font-size:15px;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;animation:fadeIn .15s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-md);box-shadow:0 24px 64px rgba(0,0,0,.5);width:100%;max-width:780px;max-height:90vh;overflow-y:auto;animation:slideUp .18s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.modal-header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:1;}
.modal-header h2{font-size:17px;font-weight:700;}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--steel);line-height:1;padding:2px 6px;border-radius:4px;transition:color .15s;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:20px 24px;}
.modal-footer{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--surface);}

/* Form section titles inside modal */
.form-section-title{grid-column:1/-1;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:6px;}

/* Danger button */
.btn-danger,.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-danger{background:#ef4444;border-color:#ef4444;}
.btn-danger:hover{background:#dc2626;border-color:#dc2626;box-shadow:0 0 18px rgba(239,68,68,.3);}

/* Toast wrap (stacked toasts, bottom-right) */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.toast-wrap .toast{position:static;transform:none;opacity:1;border-radius:var(--r-sm);border-left:3px solid var(--accent);padding:10px 18px;font-size:13px;animation:toastIn .2s ease;}
.toast-wrap .toast.removing{animation:toastOut .2s ease forwards;}
@keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px);}}

/* Confirm overlay */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:2000;}
.confirm-box{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-md);padding:28px 32px;max-width:380px;width:90%;box-shadow:0 24px 64px rgba(0,0,0,.5);text-align:center;}
.confirm-box h3{font-size:16px;margin-bottom:8px;}
.confirm-box p{font-size:13px;color:var(--text-dim);margin-bottom:20px;}
.confirm-box .actions{display:flex;gap:10px;justify-content:center;}

/* Stripe ID code inline */
code{font-size:12px;background:var(--surface-2);padding:2px 6px;border-radius:4px;color:var(--text-dim);font-family:monospace;}

@media(max-width:700px){
  .form-grid{grid-template-columns:1fr;}
  .form-group.full{grid-column:auto;}
  .toolbar,.main{padding:12px 16px;}
  .col-hide{display:none;}
  .header-stats{display:none;}
}
</style>
</head>
<body>

<div class="bg-field" style="position:fixed;inset:0;z-index:-1;pointer-events:none;"><div style="position:absolute;inset:0;background:radial-gradient(720px 460px at 82% -6%,rgba(255,90,31,.09),transparent 60%),radial-gradient(620px 520px at 6% 8%,rgba(255,90,31,.04),transparent 60%);"></div></div>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="4" y="10" width="4" height="12" rx="2" fill="#FF5A1F"/><rect x="10" y="6" width="4" height="20" rx="2" fill="#FF5A1F" opacity=".85"/><rect x="16" y="2" width="4" height="28" rx="2" fill="#FF5A1F" opacity=".7"/><rect x="22" y="6" width="4" height="20" rx="2" fill="#FF5A1F" opacity=".55"/></svg>
      CWI <span class="dot">·</span> Client Directory
    </div>
    <div class="header-stats">
      <div class="stat-pill">Clients <span class="val" id="hdr-count">0</span></div>
      <div class="stat-pill">Active <span class="val" id="hdr-active">0</span></div>
      <div class="stat-pill">MRR <span class="val" id="hdr-mrr">$0</span></div>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline btn-sm" onclick="exportCSV()">&#8595; Export CSV</button>
      <button class="btn btn-sm" onclick="openModal()">+ Add Client</button>
    </div>
  </div>
  <div style="max-width:960px;margin:0 auto;padding:10px 24px 0;display:flex;gap:12px;flex-wrap:wrap;align-items:center;" class="toolbar-row">
    <div class="search-wrap">
      <svg width="15" height="15" fill="none" stroke="#85858E" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="Search name, email, industry…" oninput="renderTable()">
    </div>
    <select id="filter-tier" onchange="renderTable()">
      <option value="">All Tiers</option>
      <option value="Starter">Starter</option>
      <option value="Growth">Growth</option>
      <option value="Pro">Pro</option>
    </select>
    <select id="filter-status" onchange="renderTable()">
      <option value="">All Statuses</option>
      <option value="Active">Active</option>
      <option value="Paused">Paused</option>
      <option value="Churned">Churned</option>
    </select>
    <div class="toolbar-spacer"></div>
    <span id="result-count" style="font-size:12px;color:var(--steel)"></span>
  </div>
</header>

<!-- MAIN TABLE -->
<div class="main">
  <div class="table-wrap">
    <table id="client-table">
      <thead>
        <tr>
          <th style="width:32px"></th>
          <th data-col="businessName">Business <span class="sort-icon">▾</span></th>
          <th data-col="ownerName" class="col-hide">Owner <span class="sort-icon">▾</span></th>
          <th data-col="industry" class="col-hide">Industry <span class="sort-icon">▾</span></th>
          <th data-col="planTier">Tier <span class="sort-icon">▾</span></th>
          <th data-col="monthlyFee">MRR <span class="sort-icon">▾</span></th>
          <th data-col="status">Status <span class="sort-icon">▾</span></th>
          <th>Quick Copy</th>
          <th style="width:80px">Actions</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
    <div id="empty-state" class="empty-state" style="display:none">
      <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <p>No clients found. Add your first client or adjust filters.</p>
    </div>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-wrap" id="toast-wrap"></div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modal" style="display:none" onclick="overlayClose(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Add Client</h2>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <form id="client-form" onsubmit="saveClient(event)">
        <div class="form-grid">

          <div class="form-section-title">Business Info</div>

          <div class="form-group">
            <label for="businessName">Business Name *</label>
            <input type="text" id="businessName" name="businessName" required placeholder="Acme Plumbing LLC">
          </div>
          <div class="form-group">
            <label for="ownerName">Owner Name *</label>
            <input type="text" id="ownerName" name="ownerName" required placeholder="John Smith">
          </div>
          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required placeholder="owner@business.com">
          </div>
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" placeholder="(555) 000-0000">
          </div>
          <div class="form-group full">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" placeholder="123 Main St, City, ST 00000">
          </div>
          <div class="form-group">
            <label for="industry">Industry</label>
            <input type="text" id="industry" name="industry" placeholder="Plumbing, HVAC, Roofing…">
          </div>
          <div class="form-group">
            <label for="emergencyContact">Emergency Contact</label>
            <input type="text" id="emergencyContact" name="emergencyContact" placeholder="Name — (555) 000-0000">
          </div>

          <div class="form-section-title">Contract &amp; Billing</div>

          <div class="form-group">
            <label for="planTier">Plan Tier *</label>
            <select id="planTier" name="planTier" required>
              <option value="">Select tier…</option>
              <option value="Starter">Starter</option>
              <option value="Growth">Growth</option>
              <option value="Pro">Pro</option>
            </select>
          </div>
          <div class="form-group">
            <label for="monthlyFee">Monthly Fee ($) *</label>
            <input type="number" id="monthlyFee" name="monthlyFee" required min="0" step="0.01" placeholder="497">
          </div>
          <div class="form-group">
            <label for="onboardingDate">Onboarding Date</label>
            <input type="date" id="onboardingDate" name="onboardingDate">
          </div>
          <div class="form-group">
            <label for="contractTerm">Contract Term</label>
            <input type="text" id="contractTerm" name="contractTerm" placeholder="12 months, Month-to-Month…">
          </div>
          <div class="form-group">
            <label for="status">Status *</label>
            <select id="status" name="status" required>
              <option value="Active">Active</option>
              <option value="Paused">Paused</option>
              <option value="Churned">Churned</option>
            </select>
          </div>

          <div class="form-section-title">Integrations</div>

          <div class="form-group">
            <label for="resendDomain">Resend Domain</label>
            <input type="text" id="resendDomain" name="resendDomain" placeholder="send.clientdomain.com">
          </div>
          <div class="form-group">
            <label for="hubspotId">HubSpot Contact ID</label>
            <input type="text" id="hubspotId" name="hubspotId" placeholder="12345678">
          </div>
          <div class="form-group">
            <label for="stripeId">Stripe Customer ID</label>
            <input type="text" id="stripeId" name="stripeId" placeholder="cus_XXXXXXXXXXXXXXXX">
          </div>
          <div class="form-group">
            <label for="calendlyLink">Calendly Link</label>
            <input type="url" id="calendlyLink" name="calendlyLink" placeholder="https://calendly.com/…">
          </div>
          <div class="form-group">
            <label for="freshchatBotId">Freshchat Bot ID</label>
            <input type="text" id="freshchatBotId" name="freshchatBotId" placeholder="bot_XXXXXXXX">
          </div>

          <div class="form-section-title">Notes</div>

          <div class="form-group full">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" placeholder="Any additional context, special requirements, internal notes…"></textarea>
          </div>

        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-sm" onclick="document.getElementById('client-form').requestSubmit()">Save Client</button>
    </div>
  </div>
</div>

<script>
// ─── DATA LAYER ───────────────────────────────────────────────────────────────
const STORAGE_KEY = 'cwi_clients_v1';

const DEFAULT_CLIENTS = [
  {
    id: 'cli_001',
    businessName: 'Summit Plumbing Services',
    ownerName: 'Marcus Rivera',
    email: 'marcus@summitplumbing.com',
    phone: '(602) 555-0142',
    address: '4820 N 32nd Ave, Phoenix, AZ 85019',
    industry: 'Plumbing',
    planTier: 'Growth',
    monthlyFee: 997,
    onboardingDate: '2025-11-15',
    contractTerm: '12 months',
    resendDomain: 'send.summitplumbing.com',
    hubspotId: '48291037',
    stripeId: 'cus_QjK9mTxRv3pLwN',
    calendlyLink: 'https://calendly.com/summitplumbing/30min',
    freshchatBotId: 'bot_SP8824',
    emergencyContact: 'Carla Rivera — (602) 555-0199',
    notes: 'High referral potential. Prefers morning calls. Running Facebook + Google Ads combo. Wants monthly report by 1st of month.',
    status: 'Active',
    createdAt: new Date('2025-11-15').toISOString()
  },
  {
    id: 'cli_002',
    businessName: 'Arctic Air HVAC',
    ownerName: 'Donna Whitfield',
    email: 'donna@arcticairhvac.com',
    phone: '(713) 555-0378',
    address: '2201 Westheimer Rd, Houston, TX 77098',
    industry: 'HVAC',
    planTier: 'Starter',
    monthlyFee: 497,
    onboardingDate: '2026-01-08',
    contractTerm: 'Month-to-Month',
    resendDomain: 'send.arcticairhvac.com',
    hubspotId: '59103874',
    stripeId: 'cus_RkM2nUyQw4qMxO',
    calendlyLink: 'https://calendly.com/arcticairhvac/discovery',
    freshchatBotId: 'bot_AA3317',
    emergencyContact: 'Tom Whitfield — (713) 555-0300',
    notes: 'New client, still completing onboarding. Needs Freshchat widget installed on website. Potential upgrade to Growth in Q3.',
    status: 'Active',
    createdAt: new Date('2026-01-08').toISOString()
  }
];

function loadClients() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  const defaults = DEFAULT_CLIENTS;
  saveClients(defaults);
  return defaults;
}

function saveClients(clients) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(clients));
}

let clients = loadClients();
let editingId = null;
let sortCol = 'businessName';
let sortDir = 1;
let expandedId = null;

// ─── RENDER ───────────────────────────────────────────────────────────────────
function renderTable() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const tier = document.getElementById('filter-tier').value;
  const status = document.getElementById('filter-status').value;

  let filtered = clients.filter(c => {
    const matchQ = !q || [c.businessName,c.ownerName,c.email,c.industry,c.phone]
      .some(f => f && f.toLowerCase().includes(q));
    const matchTier = !tier || c.planTier === tier;
    const matchStatus = !status || c.status === status;
    return matchQ && matchTier && matchStatus;
  });

  filtered.sort((a,b) => {
    let av = a[sortCol] ?? '', bv = b[sortCol] ?? '';
    if (sortCol === 'monthlyFee') { av = +av; bv = +bv; }
    else { av = String(av).toLowerCase(); bv = String(bv).toLowerCase(); }
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });

  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';

  document.getElementById('empty-state').style.display = filtered.length ? 'none' : 'block';
  document.getElementById('result-count').textContent = filtered.length
    ? `${filtered.length} of ${clients.length} client${clients.length !== 1 ? 's' : ''}`
    : '';

  filtered.forEach(c => {
    // MAIN ROW
    const tr = document.createElement('tr');
    tr.className = 'client-row' + (expandedId === c.id ? ' expanded' : '');
    tr.dataset.id = c.id;
    tr.innerHTML = `
      <td style="text-align:center;width:32px">
        <span class="expand-icon">&#9658;</span>
      </td>
      <td>
        <div style="font-weight:600;font-size:13px">${esc(c.businessName)}</div>
        <div style="font-size:11px;color:var(--steel)">${esc(c.ownerName)}</div>
      </td>
      <td class="col-hide">${esc(c.ownerName)}</td>
      <td class="col-hide"><span style="font-size:12px">${esc(c.industry)}</span></td>
      <td><span class="badge badge-${c.planTier.toLowerCase()}">${esc(c.planTier)}</span></td>
      <td style="font-weight:600">$${Number(c.monthlyFee).toLocaleString()}</td>
      <td><span class="badge badge-${c.status.toLowerCase()}">${esc(c.status)}</span></td>
      <td>
        <div class="action-cell">
          <button class="copy-btn" title="Copy Email" onclick="copyField(event,'${esc(c.email)}','Email')">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button class="copy-btn" title="Copy Phone" onclick="copyField(event,'${esc(c.phone)}','Phone')">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.41 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6.18 6.18l.95-.95a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </button>
          <button class="copy-btn" title="Copy Calendly" onclick="copyField(event,'${esc(c.calendlyLink)}','Calendly')">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </button>
        </div>
      </td>
      <td>
        <div style="display:flex;gap:6px">
          <button class="btn btn-outline btn-sm" onclick="editClient(event,'${c.id}')">Edit</button>
          <button class="btn btn-sm" style="background:#ef4444;border-color:#ef4444;" onclick="deleteClient(event,'${c.id}')">Del</button>
        </div>
      </td>
    `;
    tr.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      toggleExpand(c.id);
    });
    tbody.appendChild(tr);

    // DETAIL ROW
    const det = document.createElement('tr');
    det.className = 'detail-row';
    det.dataset.detailFor = c.id;
    det.style.display = expandedId === c.id ? '' : 'none';
    det.innerHTML = `<td colspan="9"><div class="detail-card">${buildDetailCard(c)}</div></td>`;
    tbody.appendChild(det);
  });

  updateHeader();
  updateSortIndicators();
}

function buildDetailCard(c) {
  const fields = [
    ['Email', c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : '—'],
    ['Phone', c.phone ? `<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>` : '—'],
    ['Address', esc(c.address) || '—'],
    ['Industry', esc(c.industry) || '—'],
    ['Onboarding Date', c.onboardingDate ? new Date(c.onboardingDate+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}) : '—'],
    ['Contract Term', esc(c.contractTerm) || '—'],
    ['Resend Domain', c.resendDomain ? `<a href="https://${esc(c.resendDomain)}" target="_blank">${esc(c.resendDomain)}</a>` : '—'],
    ['HubSpot Contact ID', esc(c.hubspotId) || '—'],
    ['Stripe Customer ID', c.stripeId ? `<code style="font-size:12px;background:#f1f5f9;padding:2px 6px;border-radius:4px">${esc(c.stripeId)}</code>` : '—'],
    ['Calendly Link', c.calendlyLink ? `<a href="${esc(c.calendlyLink)}" target="_blank">Open Link</a>` : '—'],
    ['Freshchat Bot ID', esc(c.freshchatBotId) || '—'],
    ['Emergency Contact', esc(c.emergencyContact) || '—'],
  ];

  const grid = fields.map(([lbl, val]) => `
    <div class="detail-field">
      <label>${lbl}</label>
      <div class="val">${val}</div>
    </div>
  `).join('');

  const notes = `
    <div class="detail-field notes-block">
      <label>Notes</label>
      <div class="val">${esc(c.notes) || '<em>No notes.</em>'}</div>
    </div>
  `;

  const actions = `
    <div class="detail-actions">
      ${c.email ? `<button class="btn btn-outline btn-sm" onclick="copyField(event,'${esc(c.email)}','Email')">Copy Email</button>` : ''}
      ${c.phone ? `<button class="btn btn-outline btn-sm" onclick="copyField(event,'${esc(c.phone)}','Phone')">Copy Phone</button>` : ''}
      ${c.calendlyLink ? `<button class="btn btn-outline btn-sm" onclick="copyField(event,'${esc(c.calendlyLink)}','Calendly Link')">Copy Calendly</button>` : ''}
      ${c.stripeId ? `<button class="btn btn-outline btn-sm" onclick="copyField(event,'${esc(c.stripeId)}','Stripe ID')">Copy Stripe ID</button>` : ''}
      <button class="btn btn-sm" onclick="editClient(event,'${c.id}')">Edit Client</button>
      <button class="btn btn-sm" style="background:#ef4444;border-color:#ef4444;" onclick="deleteClient(event,'${c.id}')">Delete</button>
    </div>
  `;

  return `<div class="detail-grid">${grid}${notes}</div>${actions}`;
}

function toggleExpand(id) {
  expandedId = expandedId === id ? null : id;
  renderTable();
}

function updateHeader() {
  const active = clients.filter(c => c.status === 'Active');
  const mrr = active.reduce((s,c) => s + (+c.monthlyFee||0), 0);
  document.getElementById('hdr-count').textContent = clients.length;
  document.getElementById('hdr-active').textContent = active.length;
  document.getElementById('hdr-mrr').textContent = '$' + mrr.toLocaleString();
}

function updateSortIndicators() {
  document.querySelectorAll('thead th').forEach(th => {
    th.classList.remove('sorted');
    const icon = th.querySelector('.sort-icon');
    if (icon) icon.textContent = '▾';
  });
  const sorted = document.querySelector(`thead th[data-col="${sortCol}"]`);
  if (sorted) {
    sorted.classList.add('sorted');
    const icon = sorted.querySelector('.sort-icon');
    if (icon) icon.textContent = sortDir === 1 ? '▲' : '▼';
  }
}

// SORT
document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortDir = -sortDir;
    else { sortCol = col; sortDir = 1; }
    renderTable();
  });
});

// ─── MODAL ───────────────────────────────────────────────────────────────────
function openModal(id) {
  editingId = id || null;
  const form = document.getElementById('client-form');
  form.reset();
  document.getElementById('modal-title').textContent = id ? 'Edit Client' : 'Add Client';

  if (id) {
    const c = clients.find(x => x.id === id);
    if (c) {
      Object.keys(c).forEach(k => {
        const el = form.elements[k];
        if (el) el.value = c[k] ?? '';
      });
    }
  }

  document.getElementById('modal').style.display = 'flex';
  requestAnimationFrame(() => form.elements['businessName'].focus());
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
  editingId = null;
}

function overlayClose(e) {
  if (e.target.id === 'modal') closeModal();
}

function saveClient(e) {
  e.preventDefault();
  const form = e.target;
  const data = {};
  new FormData(form).forEach((v, k) => data[k] = v.trim());

  if (editingId) {
    const idx = clients.findIndex(c => c.id === editingId);
    if (idx !== -1) {
      clients[idx] = { ...clients[idx], ...data };
      toast('Client updated.');
    }
  } else {
    clients.push({
      id: 'cli_' + Date.now(),
      ...data,
      createdAt: new Date().toISOString()
    });
    toast('Client added.');
  }

  saveClients(clients);
  closeModal();
  renderTable();
}

function editClient(e, id) {
  e.stopPropagation();
  openModal(id);
}

// ─── DELETE ───────────────────────────────────────────────────────────────────
function deleteClient(e, id) {
  e.stopPropagation();
  const c = clients.find(x => x.id === id);
  if (!c) return;

  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `
    <div class="confirm-box">
      <h3>Delete Client?</h3>
      <p>Remove <strong>${esc(c.businessName)}</strong> from the directory? This cannot be undone.</p>
      <div class="actions">
        <button class="btn btn-outline btn-sm">Cancel</button>
        <button class="btn btn-sm" style="background:#ef4444;border-color:#ef4444;" id="confirm-del-btn">Delete</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('.btn-outline').onclick = () => overlay.remove();
  overlay.querySelector('#confirm-del-btn').onclick = () => {
    clients = clients.filter(x => x.id !== id);
    if (expandedId === id) expandedId = null;
    saveClients(clients);
    renderTable();
    overlay.remove();
    toast('Client deleted.');
  };
}

// ─── COPY ─────────────────────────────────────────────────────────────────────
function copyField(e, val, label) {
  e.stopPropagation();
  if (!val) { toast('Nothing to copy.'); return; }
  navigator.clipboard.writeText(val).then(() => {
    toast(`${label} copied!`);
    const btn = e.currentTarget;
    btn.classList.add('copied');
    setTimeout(() => btn.classList.remove('copied'), 1200);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = val; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast(`${label} copied!`);
  });
}

// ─── EXPORT CSV ───────────────────────────────────────────────────────────────
function exportCSV() {
  const cols = ['businessName','ownerName','email','phone','address','industry',
    'planTier','monthlyFee','onboardingDate','contractTerm','resendDomain',
    'hubspotId','stripeId','calendlyLink','freshchatBotId','emergencyContact','notes','status'];
  const headers = ['Business Name','Owner Name','Email','Phone','Address','Industry',
    'Plan Tier','Monthly Fee','Onboarding Date','Contract Term','Resend Domain',
    'HubSpot Contact ID','Stripe Customer ID','Calendly Link','Freshchat Bot ID',
    'Emergency Contact','Notes','Status'];

  const rows = [headers.join(',')];
  clients.forEach(c => {
    rows.push(cols.map(col => {
      const v = (c[col] ?? '').toString().replace(/"/g, '""');
      return `"${v}"`;
    }).join(','));
  });

  const blob = new Blob([rows.join('\r\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cwi-client-directory-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV exported.');
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function toast(msg) {
  const wrap = document.getElementById('toast-wrap');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => {
    t.classList.add('removing');
    setTimeout(() => t.remove(), 200);
  }, 2400);
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// ─── KEYBOARD ────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderTable();
</script>
</body>
</html>
