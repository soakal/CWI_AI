<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Swipe File — CWI</title>
<meta name="description" content="CWI internal content library for email subject lines, openers, social posts, CTAs, testimonial templates, and objection responses.">
<link rel="icon" type="image/png" href="../assets/cwi-favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0A0C;--ink-2:#0E0E11;--surface:#141418;--surface-2:#191920;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.14);--accent:#FF5A1F;--ember:#FF8A3D;--steel:#85858E;--text:#F4F4F6;--text-dim:#C2C2C8;--font-disp:'Sora',sans-serif;--font-body:'Instrument Sans',sans-serif;--r-sm:12px;--r-md:18px;--r-pill:999px;--ease:cubic-bezier(.22,.61,.36,1);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--ink);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh;padding:0 0 64px;}
h1,h2,h3,h4,h5,h6{font-family:var(--font-disp);letter-spacing:-.03em;line-height:1.15;font-weight:800;color:var(--text);}
a{color:var(--accent);text-decoration:none;}
p{color:var(--text-dim);line-height:1.65;}
ul,ol{color:var(--text-dim);padding-left:1.4em;}
li{margin-bottom:6px;}
/* Layout */
.wrap{max-width:960px;margin:0 auto;padding:0 24px;}
.container{max-width:900px;margin:0 auto;padding:0 24px;}
/* Topbar */
.topbar{border-bottom:1px solid var(--line);background:rgba(10,10,12,.9);backdrop-filter:blur(14px);position:sticky;top:0;z-index:100;padding:14px 0;}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:960px;margin:0 auto;padding:0 24px;}
.logo{font-family:var(--font-disp);font-weight:800;font-size:17px;letter-spacing:-.04em;display:flex;align-items:center;gap:8px;color:var(--text);}
.logo .dot{color:var(--accent);}
.back-link{font-size:13px;color:var(--steel);display:flex;align-items:center;gap:5px;transition:color .2s;}
.back-link:hover{color:var(--text);}
/* Hero */
.page-header,.hero{padding:52px 0 32px;text-align:center;}
.page-header .logo-block,.hero .logo-block{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-disp);font-size:20px;font-weight:800;margin-bottom:10px;color:var(--accent);}
.kicker,.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--steel);margin-bottom:16px;}
.pip{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.hero h1,.page-title{font-size:clamp(26px,3.5vw,44px);margin-bottom:12px;}
.hero p,.page-subtitle{font-size:clamp(14px,1.5vw,16px);color:var(--text-dim);max-width:52ch;margin:0 auto;}
/* Cards & panels */
.card,.panel,.form-card,.section-card,.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;margin-bottom:24px;}
.card:hover,.panel:hover{border-color:var(--line-2);}
/* Form elements */
label,.form-label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);display:block;margin-bottom:6px;}
input,select,textarea,.form-control{width:100%;background:var(--ink-2);border:1.5px solid var(--line-2);border-radius:var(--r-sm);padding:10px 14px;font-size:14px;font-family:var(--font-body);color:var(--text);outline:none;transition:border-color .2s;box-sizing:border-box;}
input:focus,select:focus,textarea:focus,.form-control:focus{border-color:var(--accent);background:var(--surface);}
textarea{resize:vertical;min-height:96px;}
select option{background:var(--surface);color:var(--text);}
/* Form layout */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.form-group,.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.form-group.full,.field.full{grid-column:1/-1;}
/* Buttons */
.btn,.btn-primary,.btn-generate,.btn-action{font-family:var(--font-body);font-size:14px;font-weight:600;padding:11px 24px;border-radius:var(--r-pill);border:1.5px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:all .22s var(--ease);display:inline-flex;align-items:center;gap:8px;text-decoration:none;}
.btn:hover,.btn-primary:hover,.btn-generate:hover,.btn-action:hover{background:var(--ember);border-color:var(--ember);box-shadow:0 0 22px rgba(255,90,31,.35);}
.btn-outline,.btn-ghost,.btn-secondary{background:rgba(255,90,31,.1);border-color:var(--accent);color:var(--text);}
.btn-outline:hover,.btn-ghost:hover,.btn-secondary:hover{background:var(--accent);color:#fff;}
.btn-sm{padding:8px 16px;font-size:13px;}
/* Tables */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:32px;}
table{width:100%;border-collapse:collapse;}
thead{background:var(--surface-2);}
th{font-family:var(--font-disp);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);}
td{font-size:14px;color:var(--text-dim);padding:11px 16px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
/* Badges / tags */
.badge,.tag{display:inline-block;padding:3px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:600;background:rgba(255,90,31,.12);color:var(--accent);border:1px solid rgba(255,90,31,.25);}
.badge.green,.tag.green{background:rgba(74,222,128,.12);color:#4ade80;border-color:rgba(74,222,128,.25);}
.badge.red,.tag.red{background:rgba(248,113,113,.12);color:#f87171;border-color:rgba(248,113,113,.25);}
/* Sections */
.section{padding:40px 0 0;}
.section-title{font-family:var(--font-disp);font-size:20px;font-weight:700;margin-bottom:18px;color:var(--text);}
.section-title span,.acc{color:var(--accent);}
/* Output/preview areas */
.output-area,.preview,.result-card,.output-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:28px 32px;margin-top:24px;}
/* Dividers */
hr,.rule,.divider{border:none;border-top:1px solid var(--line);margin:32px 0;}
/* Checklist items */
.check-item{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
.check-item:last-child{border-bottom:none;}
.check-item input[type="checkbox"]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;}
/* Lists */
.list-item{padding:12px 0;border-bottom:1px solid var(--line);color:var(--text-dim);}
.list-item:last-child{border-bottom:none;}
/* Stats / KPI */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:28px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px 22px;}
.stat-label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin-bottom:8px;}
.stat-value{font-family:var(--font-disp);font-size:30px;font-weight:800;color:var(--text);}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:11px 22px;font-size:14px;color:var(--text);transition:transform .3s var(--ease),opacity .3s;opacity:0;z-index:999;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
/* Footer */
.footer{border-top:1px solid var(--line);padding:24px 0;text-align:center;font-size:13px;color:var(--steel);margin-top:64px;}
.footer a{color:var(--accent);}
/* Responsive */
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}.card,.panel,.form-card{padding:20px 16px;}.stat-grid{grid-template-columns:1fr 1fr;}}

/* ── Page-specific styles ── */
/* Header actions */
.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
/* Search */
.search-wrap{position:relative;}
.search-wrap input{padding:9px 16px 9px 38px;width:240px;}
.search-wrap .search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--steel);font-size:14px;pointer-events:none;}
/* Tabs container */
.tabs-container{max-width:1100px;margin:28px auto;padding:0 20px;}
.tab-nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto;padding-bottom:0;scrollbar-width:none;}
.tab-nav::-webkit-scrollbar{display:none;}
.tab-btn{padding:10px 18px;border:none;background:none;cursor:pointer;font-size:0.88rem;font-weight:600;color:var(--steel);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;border-radius:6px 6px 0 0;transition:all .15s;font-family:var(--font-body);}
.tab-btn:hover{color:var(--accent);background:rgba(255,90,31,.07);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(255,90,31,.07);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
/* Stats bar */
.stats-bar{display:flex;gap:20px;margin-bottom:20px;padding:14px 18px;background:var(--surface);border-radius:var(--r-md);border:1px solid var(--line);flex-wrap:wrap;}
.stat{display:flex;flex-direction:column;gap:2px;}
.stat-val{font-size:1.2rem;font-weight:700;color:var(--accent);font-family:var(--font-disp);}
.stat-label{font-size:0.75rem;color:var(--steel);}
/* Content Grid */
.content-grid{display:grid;gap:14px;}
/* Card overrides for content cards */
.card{background:var(--surface);border-radius:var(--r-md);border:1.5px solid var(--line);padding:18px 20px;margin-bottom:0;transition:border-color .2s;}
.card:hover{border-color:var(--line-2);}
.card.favorited{border-color:rgba(255,138,61,.5);background:rgba(255,138,61,.05);}
.card-body{font-size:0.93rem;line-height:1.55;color:var(--text-dim);margin-bottom:14px;}
.card-body.large{font-size:1.0rem;}
.card-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.use-count{font-size:0.75rem;color:var(--steel);background:var(--surface-2);padding:3px 9px;border-radius:var(--r-pill);border:1px solid var(--line);}
.card-actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;}
.copy-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:var(--r-sm);font-size:0.78rem;font-weight:600;cursor:pointer;border:1.5px solid var(--accent);background:transparent;color:var(--accent);transition:all .15s;font-family:var(--font-body);}
.copy-btn:hover{background:var(--accent);color:#fff;}
.copy-btn.copied{background:#4ade80;border-color:#4ade80;color:#fff;}
.star-btn{background:none;border:none;cursor:pointer;font-size:1.2rem;line-height:1;padding:4px;transition:transform .15s;}
.star-btn:hover{transform:scale(1.2);}
/* Add item panel */
.add-panel{background:var(--surface-2);border:1.5px dashed var(--line-2);border-radius:var(--r-md);padding:20px;margin-top:20px;}
.add-panel h3{font-size:0.9rem;font-weight:700;color:var(--steel);margin-bottom:12px;font-family:var(--font-disp);}
.add-panel textarea,.add-panel input{margin-bottom:10px;}
.add-panel textarea{min-height:80px;}
.add-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
/* Search highlight */
mark{background:rgba(255,90,31,.25);color:var(--text);border-radius:2px;padding:0 2px;}
/* Empty state */
.empty-state{text-align:center;padding:48px 20px;color:var(--steel);}
.empty-state .icon{font-size:2.5rem;margin-bottom:10px;}
.empty-state p{font-size:0.9rem;}
/* Toast override (use id toast) */
#toast{position:fixed;bottom:28px;right:28px;background:var(--surface-2);color:var(--text);padding:12px 22px;border-radius:var(--r-md);font-size:0.88rem;font-weight:600;border:1px solid var(--line-2);opacity:0;pointer-events:none;transform:translateY(10px);transition:all .25s;z-index:9999;}
#toast.show{opacity:1;transform:translateY(0);}
/* Objection card */
.obj-q{font-size:0.78rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;}
/* Testimonial fill-in */
.tpl-text{font-size:0.93rem;line-height:1.6;color:var(--text-dim);}
.tpl-text .blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--accent);color:var(--accent);font-style:italic;padding:0 4px;}
/* Responsive */
@media(max-width:600px){.tabs-container{padding:0 10px;}.tab-btn{padding:8px 12px;font-size:0.82rem;}.search-wrap input{width:100%;}}
</style>
</head>
<body>

<div class="bg-field" style="position:fixed;inset:0;z-index:-1;pointer-events:none;"><div style="position:absolute;inset:0;background:radial-gradient(720px 460px at 82% -6%,rgba(255,90,31,.09),transparent 60%),radial-gradient(620px 520px at 6% 8%,rgba(255,90,31,.04),transparent 60%);"></div></div>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="4" y="10" width="4" height="12" rx="2" fill="#FF5A1F"/><rect x="10" y="6" width="4" height="20" rx="2" fill="#FF5A1F" opacity=".85"/><rect x="16" y="2" width="4" height="28" rx="2" fill="#FF5A1F" opacity=".7"/><rect x="22" y="6" width="4" height="20" rx="2" fill="#FF5A1F" opacity=".55"/></svg>
      CWI <span class="dot">·</span> Content Swipe File
    </div>
    <div class="header-actions">
      <div class="search-wrap">
        <span class="search-icon">&#128269;</span>
        <input type="text" id="globalSearch" placeholder="Search all content..." oninput="handleSearch(this.value)">
      </div>
      <button class="btn btn-outline" onclick="exportFavorites()">&#11088; Export Favorites</button>
      <a class="back-link" href="../index.html">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2L3 7l5 5"/><line x1="3" y1="7" x2="12" y2="7"/></svg>
        Back
      </a>
    </div>
  </div>
</header>

<div class="tabs-container">
  <div id="statsBar" class="stats-bar">
    <div class="stat"><span class="stat-val" id="statTotal">0</span><span class="stat-label">Total Items</span></div>
    <div class="stat"><span class="stat-val" id="statFavs">0</span><span class="stat-label">Favorites</span></div>
    <div class="stat"><span class="stat-val" id="statCopies">0</span><span class="stat-label">Total Copies</span></div>
    <div class="stat"><span class="stat-val" id="statCustom">0</span><span class="stat-label">Custom Items</span></div>
  </div>

  <nav class="tab-nav" role="tablist">
    <button class="tab-btn active" onclick="switchTab('subjects')" id="tab-subjects">&#9993; Email Subjects</button>
    <button class="tab-btn" onclick="switchTab('openers')" id="tab-openers">&#128221; Email Openers</button>
    <button class="tab-btn" onclick="switchTab('social')" id="tab-social">&#128241; Social Posts</button>
    <button class="tab-btn" onclick="switchTab('ctas')" id="tab-ctas">&#127919; CTAs</button>
    <button class="tab-btn" onclick="switchTab('testimonials')" id="tab-testimonials">&#128172; Testimonials</button>
    <button class="tab-btn" onclick="switchTab('objections')" id="tab-objections">&#128221; Objection Responses</button>
  </nav>

  <!-- TAB: Email Subjects -->
  <div class="tab-panel active" id="panel-subjects">
    <div class="content-grid" id="grid-subjects"></div>
    <div class="add-panel">
      <h3>+ Add Custom Subject Line</h3>
      <input type="text" id="new-subjects-tag" placeholder="Tag (optional, e.g. urgency)" style="margin-bottom:8px;">
      <textarea id="new-subjects-text" placeholder="Write your subject line here..."></textarea>
      <div class="add-row">
        <button class="btn btn-primary btn-sm" onclick="addCustomItem('subjects')">Add Subject Line</button>
      </div>
    </div>
  </div>

  <!-- TAB: Email Openers -->
  <div class="tab-panel" id="panel-openers">
    <div class="content-grid" id="grid-openers"></div>
    <div class="add-panel">
      <h3>+ Add Custom Opener</h3>
      <input type="text" id="new-openers-tag" placeholder="Tag (optional)">
      <textarea id="new-openers-text" placeholder="Write your opening paragraph here..."></textarea>
      <div class="add-row">
        <button class="btn btn-primary btn-sm" onclick="addCustomItem('openers')">Add Opener</button>
      </div>
    </div>
  </div>

  <!-- TAB: Social Posts -->
  <div class="tab-panel" id="panel-social">
    <div class="content-grid" id="grid-social"></div>
    <div class="add-panel">
      <h3>+ Add Custom Social Post</h3>
      <input type="text" id="new-social-tag" placeholder="Tag (optional, e.g. LinkedIn)">
      <textarea id="new-social-text" placeholder="Write your post here..."></textarea>
      <div class="add-row">
        <button class="btn btn-primary btn-sm" onclick="addCustomItem('social')">Add Post</button>
      </div>
    </div>
  </div>

  <!-- TAB: CTAs -->
  <div class="tab-panel" id="panel-ctas">
    <div class="content-grid" id="grid-ctas"></div>
    <div class="add-panel">
      <h3>+ Add Custom CTA</h3>
      <input type="text" id="new-ctas-tag" placeholder="Tag (optional, e.g. email)">
      <textarea id="new-ctas-text" placeholder="Write your call-to-action here..."></textarea>
      <div class="add-row">
        <button class="btn btn-primary btn-sm" onclick="addCustomItem('ctas')">Add CTA</button>
      </div>
    </div>
  </div>

  <!-- TAB: Testimonials -->
  <div class="tab-panel" id="panel-testimonials">
    <div class="content-grid" id="grid-testimonials"></div>
    <div class="add-panel">
      <h3>+ Add Custom Template</h3>
      <input type="text" id="new-testimonials-tag" placeholder="Tag (optional)">
      <textarea id="new-testimonials-text" placeholder="Write your testimonial template. Use [BLANK] for fill-in spots."></textarea>
      <div class="add-row">
        <button class="btn btn-primary btn-sm" onclick="addCustomItem('testimonials')">Add Template</button>
      </div>
    </div>
  </div>

  <!-- TAB: Objection Responses -->
  <div class="tab-panel" id="panel-objections">
    <div class="content-grid" id="grid-objections"></div>
    <div class="add-panel">
      <h3>+ Add Custom Objection Response</h3>
      <input type="text" id="new-objections-tag" placeholder="The objection (e.g. Too expensive)">
      <textarea id="new-objections-text" placeholder="Write your response here..."></textarea>
      <div class="add-row">
        <button class="btn btn-primary btn-sm" onclick="addCustomItem('objections')">Add Response</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

    { id:'o2', text:'I want to share something that happened with one of our clients last month. They were skeptical about AI answering their phones — until they saw the report: 31 leads captured over a single weekend.', tag:'story' },

    { id:'o4', text:'Hiring is brutal right now. Good front desk staff are hard to find, expensive to keep, and prone to calling out on your busiest days. There\'s a better way.', tag:'hiring pain' },
    { id:'o5', text:'You\'ve probably heard a lot about AI lately. Most of it sounds futuristic and complicated. What we do is neither — it\'s a phone assistant that answers calls, books appointments, and qualifies leads while you focus on your craft.', tag:'simplicity' },

// ============================================================
// STATE
// ============================================================
let state = {
  favorites: {},
  useCounts: {},
  customItems: {},
  searchQuery: '',
};

const TAB_KEYS = ['subjects','openers','social','ctas','testimonials','objections'];

function loadState() {
  try {
    const saved = localStorage.getItem('cwi_swipe_state');
    if (saved) {
      const parsed = JSON.parse(saved);
      state.favorites = parsed.favorites || {};
      state.useCounts = parsed.useCounts || {};
      state.customItems = parsed.customItems || {};
    }
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem('cwi_swipe_state', JSON.stringify(state));
  } catch(e) {}
}

function getAllItems(key) {
  const defaults = DEFAULT_DATA[key] || [];
  const customs = state.customItems[key] || [];
  return [...defaults, ...customs];
}

// ============================================================
// RENDER
// ============================================================
function renderAll() {
  TAB_KEYS.forEach(k => renderTab(k));
  updateStats();
}

function renderTab(key) {
  const grid = document.getElementById('grid-' + key);
  if (!grid) return;
  const items = getAllItems(key);
  const q = state.searchQuery.toLowerCase().trim();

  const filtered = q
    ? items.filter(item =>
        (item.text && item.text.toLowerCase().includes(q)) ||
        (item.tag && item.tag.toLowerCase().includes(q))
      )
    : items;

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">&#128270;</div><p>${q ? 'No results match your search.' : 'No items yet. Add one below!'}</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(item => renderCard(item, key, q)).join('');
}

function highlight(text, q) {
  if (!q) return escHtml(text);
  const escaped = escHtml(text);
  const escapedQ = escHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escaped.replace(new RegExp(escapedQ, 'gi'), m => `<mark>${m}</mark>`);
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderCard(item, key, q) {
  const isFav = !!state.favorites[item.id];
  const useCount = state.useCounts[item.id] || 0;
  const starClass = isFav ? 'active' : '';
  const starGlyph = isFav ? '&#11088;' : '&#9734;';
  const favClass = isFav ? 'favorited' : '';
  const isObj = key === 'objections';
  const isTpl = key === 'testimonials';

  let bodyHtml = '';
  if (isObj) {
    bodyHtml = `<div class="obj-q">${highlight(item.tag || '', q)}</div><div class="card-body">${highlight(item.text, q).replace(/\n/g,'<br>')}</div>`;
  } else if (isTpl) {
    const rendered = item.text.replace(/\[([^\]]+)\]/g, '<span class="blank">[$1]</span>');
    const hilighted = q ? rendered.replace(new RegExp(escHtml(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`) : rendered;
    bodyHtml = `<div class="card-body tpl-text">${hilighted.replace(/\n/g,'<br>')}</div>`;
  } else {
    bodyHtml = `<div class="card-body">${highlight(item.text, q).replace(/\n/g,'<br>')}</div>`;
  }

  return `<div class="card ${favClass}" id="card-${item.id}" data-key="${key}" data-id="${item.id}">
    ${bodyHtml}
    <div class="card-meta">
      ${item.tag && !isObj ? `<span class="tag">${escHtml(item.tag)}</span>` : ''}
      <span class="use-count" id="uc-${item.id}">Used ${useCount}x</span>
      <div class="card-actions">
        <button class="copy-btn" id="copybtn-${item.id}" onclick="copyItem('${item.id}','${key}')">&#128203; Copy</button>
        <button class="star-btn ${starClass}" id="starbtn-${item.id}" title="${isFav ? 'Remove favorite' : 'Add to favorites'}" onclick="toggleFav('${item.id}')">${starGlyph}</button>
      </div>
    </div>
  </div>`;
}

// ============================================================
// ACTIONS
// ============================================================
function copyItem(id, key) {
  const items = getAllItems(key);
  const item = items.find(i => i.id === id);
  if (!item) return;
  // Build copy text
  const key2 = key;
  let copyText = '';
  if (key2 === 'objections') {
    copyText = (item.tag ? item.tag + '\n\n' : '') + item.text;
  } else {
    copyText = item.text;
  }
  navigator.clipboard.writeText(copyText).then(() => {
    state.useCounts[id] = (state.useCounts[id] || 0) + 1;
    saveState();
    // Update UI
    const uc = document.getElementById('uc-' + id);
    if (uc) uc.textContent = 'Used ' + state.useCounts[id] + 'x';
    const btn = document.getElementById('copybtn-' + id);
    if (btn) {
      btn.textContent = '✓ Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.innerHTML = '&#128203; Copy';
        btn.classList.remove('copied');
      }, 1800);
    }
    updateStats();
    showToast('Copied to clipboard!');
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = copyText;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    state.useCounts[id] = (state.useCounts[id] || 0) + 1;
    saveState();
    const uc = document.getElementById('uc-' + id);
    if (uc) uc.textContent = 'Used ' + state.useCounts[id] + 'x';
    updateStats();
    showToast('Copied to clipboard!');
  });
}

function toggleFav(id) {
  if (state.favorites[id]) {
    delete state.favorites[id];
  } else {
    state.favorites[id] = true;
  }
  saveState();
  updateStats();
  // Update card in place
  const card = document.getElementById('card-' + id);
  const starBtn = document.getElementById('starbtn-' + id);
  if (card && starBtn) {
    const isFav = !!state.favorites[id];
    if (isFav) {
      card.classList.add('favorited');
      starBtn.innerHTML = '&#11088;';
      starBtn.title = 'Remove favorite';
    } else {
      card.classList.remove('favorited');
      starBtn.innerHTML = '&#9734;';
      starBtn.title = 'Add to favorites';
    }
  }
  showToast(state.favorites[id] ? 'Added to favorites!' : 'Removed from favorites');
}

function addCustomItem(key) {
  const textEl = document.getElementById('new-' + key + '-text');
  const tagEl = document.getElementById('new-' + key + '-tag');
  const text = textEl ? textEl.value.trim() : '';
  const tag = tagEl ? tagEl.value.trim() : '';
  if (!text) { showToast('Please enter some content first.'); return; }
  if (!state.customItems[key]) state.customItems[key] = [];
  const id = 'custom_' + key + '_' + Date.now();
  state.customItems[key].push({ id, text, tag });
  saveState();
  if (textEl) textEl.value = '';
  if (tagEl) tagEl.value = '';
  renderTab(key);
  updateStats();
  showToast('Item added!');
}

function handleSearch(val) {
  state.searchQuery = val;
  renderAll();
}

function switchTab(key) {
  TAB_KEYS.forEach(k => {
    const panel = document.getElementById('panel-' + k);
    const btn = document.getElementById('tab-' + k);
    if (panel) panel.classList.toggle('active', k === key);
    if (btn) btn.classList.toggle('active', k === key);
  });
}

function exportFavorites() {
  const lines = [];
  lines.push('CWI AI CONTENT SWIPE FILE — FAVORITES EXPORT');
  lines.push('Generated: ' + new Date().toLocaleDateString());
  lines.push('='.repeat(60));
  lines.push('');

  const tabLabels = {
    subjects: 'EMAIL SUBJECT LINES',
    openers: 'EMAIL BODY OPENERS',
    social: 'SOCIAL POSTS',
    ctas: 'CALL-TO-ACTION PHRASES',
    testimonials: 'TESTIMONIAL TEMPLATES',
    objections: 'OBJECTION RESPONSES',
  };

  TAB_KEYS.forEach(key => {
    const items = getAllItems(key).filter(i => state.favorites[i.id]);
    if (items.length === 0) return;
    lines.push(tabLabels[key]);
    lines.push('-'.repeat(40));
    items.forEach((item, idx) => {
      if (key === 'objections') {
        lines.push(`${idx+1}. OBJECTION: ${item.tag}`);
        lines.push('   RESPONSE: ' + item.text);
      } else if (item.tag) {
        lines.push(`${idx+1}. [${item.tag}] ${item.text}`);
      } else {
        lines.push(`${idx+1}. ${item.text}`);
      }
      lines.push('');
    });
  });

  const total = Object.keys(state.favorites).length;
  if (total === 0) {
    showToast('No favorites yet. Star items to save them!');
    return;
  }

  const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'CWI-AI-Favorites-' + new Date().toISOString().slice(0,10) + '.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`Exported ${total} favorite${total !== 1 ? 's' : ''}!`);
}

function updateStats() {
  const total = TAB_KEYS.reduce((sum, k) => sum + getAllItems(k).length, 0);
  const favs = Object.keys(state.favorites).length;
  const copies = Object.values(state.useCounts).reduce((a, b) => a + b, 0);
  const custom = TAB_KEYS.reduce((sum, k) => sum + (state.customItems[k] || []).length, 0);

  const el = (id, val) => { const e = document.getElementById(id); if(e) e.textContent = val; };
  el('statTotal', total);
  el('statFavs', favs);
  el('statCopies', copies);
  el('statCustom', custom);
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

// ============================================================
// INIT
// ============================================================
loadState();
renderAll();
</script>
